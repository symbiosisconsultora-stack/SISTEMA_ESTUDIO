<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SistemaGestión · Contable</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;--surface3:#edf0f4;
  --border:#e2e6ed;--border2:#ccd3df;
  --text:#1a1f2e;--text2:#5a6478;--text3:#9daab8;
  --accent:#2563eb;--accent2:#1d4ed8;--accent-bg:#eff4ff;--accent-border:#bfdbfe;
  --green:#16a34a;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --yellow:#b45309;--yellow-bg:#fffbeb;--yellow-bd:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --r:8px;--r-sm:5px;--r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.1);--sh-lg:0 8px 28px rgba(0,0,0,.14);
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sidebar:230px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
input,select,textarea,button{font-family:var(--font);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

/* ══════════ EMPRESA SELECTOR ══════════ */
#screen-empresas{flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.brand{text-align:center;margin-bottom:40px}
.brand-logo{width:104px;height:104px;background:var(--accent);border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font-size:47px;color:#fff;margin-bottom:14px;box-shadow:0 4px 16px rgba(37,99,235,.25)}
.brand h1{font-size:24px;font-weight:600;letter-spacing:-.3px}
.brand p{color:var(--text2);font-size:13px;margin-top:4px}
.empresas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;width:100%;max-width:760px}
.e-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all .15s}
.e-card:hover{border-color:var(--accent);box-shadow:var(--sh-md);transform:translateY(-2px)}
.e-card.new{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;color:var(--text2)}
.e-card.new:hover{color:var(--accent)}
.e-card .e-dot{width:10px;height:10px;border-radius:50%;margin-bottom:12px}
.e-card h3{font-size:14px;font-weight:600;margin-bottom:3px}
.e-card p{font-size:12px;color:var(--text2)}

/* ══════════ LOGIN ══════════ */
#screen-login{flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px;width:100%;max-width:360px;box-shadow:var(--sh-md)}
.login-box h2{font-size:18px;font-weight:600;margin-bottom:3px}
.login-box .sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.e-tag{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);margin-bottom:18px}

/* ══════════ APP LAYOUT ══════════ */
#screen-app{flex-direction:row}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* Sidebar sections */
.sb-brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-brand .logo{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.sb-brand .bn{font-size:13px;font-weight:600;line-height:1.3}
.sb-brand .bs{font-size:11px;color:var(--text3)}
.sb-empresa{padding:10px 12px;border-bottom:1px solid var(--border)}
.e-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s}
.e-chip:hover{border-color:var(--accent)}
.e-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.e-chip-name{font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.u-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rol{font-size:11px;color:var(--text3)}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;transition:color .15s}
.logout-btn:hover{color:var(--red)}
.nav{padding:8px;flex:1}
.nav-sec{margin-bottom:16px}
.nav-sec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:4px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .12s;user-select:none}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}

/* Topbar */
.tb-left h2{font-size:17px;font-weight:600}
.tb-left p{font-size:12px;color:var(--text2);margin-top:1px}
.tb-right{display:flex;gap:8px;align-items:center}

/* ══════════ FORMS ══════════ */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fg input::placeholder{color:var(--text3)}
.fg textarea{resize:vertical;min-height:72px}
.abonos-table{width:100%;border-collapse:collapse;margin-top:6px}
.abonos-table th{font-size:11px;font-weight:600;color:var(--text2);padding:4px 6px;text-align:left;background:var(--surface2);border-bottom:1px solid var(--border)}
.abonos-table td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.abonos-table input{width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px}
.abonos-table input:focus{outline:none;border-color:var(--accent)}
.ab-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:2px 4px;transition:color .15s}
.ab-del:hover{color:var(--red)}
.fg input[readonly]{background:var(--surface2);color:var(--text2);cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ══════════ BUTTONS ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.btn-danger:hover{background:#fee2e2}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid transparent;padding:6px 10px}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:6px 8px}
.btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:var(--font)}
.btn-link:hover{text-decoration:underline}

/* ══════════ TABLES ══════════ */
.tw{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface2);padding:9px 13px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td{padding:9px 13px;font-size:13px}
.td-mono{font-family:var(--mono);font-size:12px}
.td-r{text-align:right}
.td-act{display:flex;gap:4px}

/* ══════════ BADGES ══════════ */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-bd)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.badge-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
.son{background:var(--green)}.soff{background:var(--text3)}

/* ══════════ CARDS ══════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px}
.stat-lbl{font-size:12px;color:var(--text2);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:600;font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ══════════ MODAL ══════════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:var(--sh-lg);max-height:92vh;overflow-y:auto;animation:mIn .18s ease}
.modal-lg{max-width:740px}
@keyframes mIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:15px;font-weight:600}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.mcl{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1;transition:color .15s}
.mcl:hover{color:var(--text)}

/* ══════════ TOOLBAR ══════════ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-l{display:flex;align-items:center;gap:8px;flex:1}
.sw{position:relative}
.sw input{padding-left:32px;width:240px}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

/* ══════════ EMPTY ══════════ */
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty .ei{font-size:36px;opacity:.35;margin-bottom:12px}
.empty h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px}

/* ══════════ TOAST ══════════ */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 15px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-md);min-width:220px;animation:tIn .2s ease}
@keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--accent)}

/* ══════════ CONFIRM ══════════ */
#confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#confirm-overlay.open{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:var(--sh-lg)}
.confirm-box h3{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text2);margin-bottom:22px}
.confirm-box .ca{display:flex;gap:8px;justify-content:center}

/* ══════════ MISC ══════════ */
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.sh h3{font-size:16px;font-weight:600}
.sh p{font-size:12px;color:var(--text2);margin-top:2px}
.color-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cswatch:hover,.cswatch.sel{border-color:var(--text);transform:scale(1.1)}
.mono{font-family:var(--mono);font-size:12px}
.text-right{text-align:right}
.text-muted{color:var(--text2)}
.fw6{font-weight:600}
.mb4{margin-bottom:4px}
.mb8{margin-bottom:8px}
.mb16{margin-bottom:16px}
.mb24{margin-bottom:24px}
.gap8{gap:8px}
.flex{display:flex}
.flex-c{display:flex;align-items:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.dl{font-size:11px;color:var(--text2);margin-bottom:2px}
.dv{font-size:13px;font-weight:500}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:all .15s}
.mod-card:hover{border-color:var(--accent);box-shadow:var(--sh);transform:translateY(-1px)}
.mod-icon{font-size:26px;margin-bottom:10px}
.mod-name{font-size:13px;font-weight:600;margin-bottom:3px}
.mod-desc{font-size:12px;color:var(--text2)}
.cc-saldo-pos{color:var(--green);font-weight:600}
.cc-saldo-neg{color:var(--red);font-weight:600}

/* Lineas detalle */
.lineas-header{display:grid;gap:6px;margin-bottom:6px}
.linea-row{display:grid;gap:6px;margin-bottom:6px;align-items:end}
.linea-row input{padding:7px 9px}

/* ══════════ TEMA OSCURO ══════════ */
[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#1e2130;--surface3:#242737;
  --border:#2d3147;--border2:#373c56;
  --text:#e8eaf2;--text2:#8b91ae;--text3:#5a607e;
  --accent:#3b82f6;--accent2:#2563eb;--accent-bg:#1e2a4a;--accent-border:#2d4080;
  --green:#22c55e;--green-bg:#0d2818;--green-bd:#1a5c30;
  --yellow:#f59e0b;--yellow-bg:#2d1f04;--yellow-bd:#6b4a0c;
  --red:#f87171;--red-bg:#2d0f0f;--red-bd:#6b2020;
  --sh:0 1px 3px rgba(0,0,0,.4);--sh-md:0 4px 12px rgba(0,0,0,.5);--sh-lg:0 8px 28px rgba(0,0,0,.6);
}
[data-theme="ocean"]{
  --bg:#e8f4f8;--surface:#fff;--surface2:#f0f8fc;--surface3:#e0f0f7;
  --border:#c5dfe8;--border2:#a8cdd8;
  --text:#0c2d3d;--text2:#3d7a94;--text3:#7aafc0;
  --accent:#0284c7;--accent2:#0369a1;--accent-bg:#e0f2fe;--accent-border:#7dd3fc;
  --green:#059669;--green-bg:#ecfdf5;--green-bd:#6ee7b7;
  --yellow:#d97706;--yellow-bg:#fffbeb;--yellow-bd:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.1);--sh-lg:0 8px 28px rgba(0,0,0,.14);
}
[data-theme="forest"]{
  --bg:#e8f2ec;--surface:#fff;--surface2:#f0f7f2;--surface3:#e0f0e5;
  --border:#c2dbc9;--border2:#9ec9aa;
  --text:#0f2d1a;--text2:#3a7a50;--text3:#70a882;
  --accent:#16a34a;--accent2:#15803d;--accent-bg:#dcfce7;--accent-border:#86efac;
  --green:#16a34a;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --yellow:#ca8a04;--yellow-bg:#fefce8;--yellow-bd:#fde047;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.1);--sh-lg:0 8px 28px rgba(0,0,0,.14);
}
[data-theme="purple"]{
  --bg:#f3f0fa;--surface:#fff;--surface2:#f7f4fd;--surface3:#ede8f9;
  --border:#d8d0f0;--border2:#bfb3e4;
  --text:#1a0f33;--text2:#5a4a8a;--text3:#8a7ab8;
  --accent:#7c3aed;--accent2:#6d28d9;--accent-bg:#f3f0fa;--accent-border:#c4b5fd;
  --green:#16a34a;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --yellow:#b45309;--yellow-bg:#fffbeb;--yellow-bd:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.1);--sh-lg:0 8px 28px rgba(0,0,0,.14);
}
/* theme picker */
.theme-picker{display:flex;gap:5px;align-items:center}
.theme-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.theme-dot:hover,.theme-dot.active{border-color:var(--text);transform:scale(1.15)}

/* Print */
@media print{
  .sidebar,.topbar,#toast-wrap,#confirm-overlay,.overlay,.toolbar{display:none!important}
  .content{padding:0}
  body{background:#fff}
  .print-area{display:block!important}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══ SCREEN: EMPRESAS ══ -->
<div id="screen-empresas" class="screen active">
  <div class="brand">
    <div class="brand-logo" id="brand-logo-icon">📊</div>
    <h1>SistemaGestión</h1>
    <p>Seleccioná la empresa con la que querés trabajar</p>
  </div>
  <div class="empresas-grid" id="empresas-grid"></div>
</div>

<!-- ══ SCREEN: LOGIN ══ -->
<div id="screen-login" class="screen">
  <div>
    <button class="btn btn-secondary btn-sm mb16" onclick="showScreen('empresas')" style="display:block;margin-bottom:20px">← Cambiar empresa</button>
    <div class="login-box">
      <div id="lt-logo-wrap" style="text-align:center;margin-bottom:14px;display:none">
        <img id="lt-logo" src="" style="height:104px;max-width:312px;object-fit:contain">

// Preserva foco y posición del cursor en inputs de búsqueda al re-renderizar
function _captureFocus(){
  const el=document.activeElement;
  if(!el||el.tagName!=='INPUT')return null;
  return{placeholder:el.placeholder,sel:[el.selectionStart,el.selectionEnd]};
}
function _restoreFocus(snap,container){
  if(!snap)return;
  const c=container||document.getElementById('main-content');
  if(!c)return;
  requestAnimationFrame(()=>{
    const inp=Array.from(c.querySelectorAll('input')).find(i=>i.placeholder===snap.placeholder);
    if(!inp)return;
    inp.focus();
    try{inp.setSelectionRange(snap.sel[0],snap.sel[1]);}catch(e){}
  });
}
const fmtARS=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});

// Formatea un input numérico mientras escribe (punto de miles, coma decimal)
function fmtInputMiles(el){
  var raw=el.value.replace(/\./g,'').replace(',','.');
  var num=parseFloat(raw);
  if(!isNaN(num)){
    // Guardar posición para no mover cursor
    el.dataset.rawVal=String(num);
    el.value=num.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
  } else {
    el.dataset.rawVal='0';
  }
}
function getRawVal(el){
  // Leer valor numérico real del input formateado
  if(el.dataset.rawVal!==undefined) return parseFloat(el.dataset.rawVal)||0;
  return parseFloat(el.value.replace(/\./g,'').replace(',','.'))||0;
}
// Normaliza el objeto nums con valores por defecto para todas las keys
function getNums(cfg){
  const n=cfg.nums||{};

  return {...n,
    FAC:parseInt(n.FAC)||1,

const TABLE_COLS = {

  recibos_cobro:   new Set(['id','empresa_id','numero','fecha','cliente_id','importe','forma_pago_id','caja_id','banco_id','factura_ids','comprobantes_aplicados','observaciones','fecha_creacion']),
  ordenes_pago:    new Set(['id','empresa_id','numero','fecha','proveedor_id','importe','forma_pago_id','caja_id','banco_id','factura_ids','comprobantes_aplicados','observaciones','fecha_creacion']),
  empleados:       new Set(['id','empresa_id','nombre','dni','activo','fecha_alta']),

  pagos_sueldo:    new Set(['id','empresa_id','empleado_id','liquidacion_id','numero','fecha','importe','forma_pago_id','caja_id','observaciones','fecha_creacion']),
  rubros:          new Set(['id','empresa_id','nombre','tipo','activo']),
  formas_pago:     new Set(['id','empresa_id','nombre','tipo','activo']),
  cajas:           new Set(['id','empresa_id','nombre','tipo','activo']),
};
const FIELD_FROM_DB = {};
Object.entries(FIELD_TO_DB).forEach(([tbl, map]) => {
  FIELD_FROM_DB[tbl] = {};
  Object.entries(map).forEach(([js, db]) => { FIELD_FROM_DB[tbl][db] = js; });
});

function toDB(tbl, obj) {
  const map = FIELD_TO_DB[tbl] || {};
  const allowed = TABLE_COLS[tbl]; // whitelist de columnas Supabase; undefined = sin filtro
  const out = {};
  Object.entries(obj).forEach(([k, v]) => {
    const dbKey = map[k] || k;
    if (!allowed || allowed.has(dbKey)) out[dbKey] = v;
  });
  // empresa_id siempre presente para tablas que lo necesitan
  if (_empresa && TABLE_MAP[tbl] && tbl !== 'empresas') out.empresa_id = _empresa.id;
  return out;
}

function fromDB(tbl, row) {
  if (!row) return null;
  const map = FIELD_FROM_DB[tbl] || {};
  const out = {};
  Object.entries(row).forEach(([k, v]) => {
    const jsKey = map[k] || k;
    out[jsKey] = v;
  });
  return out;
}

// Headers comunes para todas las peticiones
function sbHeaders(extra={}) {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': `Bearer ${SB_KEY}`,
    'Prefer': 'return=representation',
    ...extra
  };
}

// ═══════════════════════════════════════════════════════════
// DB LAYER — Supabase REST API
// ═══════════════════════════════════════════════════════════
const DB = {
  // ── Cache en memoria para la sesión ──
  _cache: {},
  _cacheKey(eid, tbl) { return `${eid}__${tbl}`; },
  _setCache(eid, tbl, data) { DB._cache[DB._cacheKey(eid, tbl)] = data; },
  _getCache(eid, tbl) { return DB._cache[DB._cacheKey(eid, tbl)] || null; },
  _clearCache(eid, tbl) { delete DB._cache[DB._cacheKey(eid, tbl)]; },

  // ── Empresas ──
  async getEmpresas() {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/empresas?select=*&order=nombre`, { headers: sbHeaders() });
      const data = await r.json();
      if (!Array.isArray(data)) return [];
      return data.map(e => fromDB('empresas', e));
    } catch { return []; }
  },

  async saveEmpresa(obj) {
    const row = toDB('empresas', obj);
    delete row.empresa_id;
    try {
      const r = await fetch(`${SB_URL}/rest/v1/empresas`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=representation' }),
        body: JSON.stringify(row)
      });
      if(!r.ok){ const e=await r.text().catch(()=>''); console.error('saveEmpresa HTTP',r.status,e); toast('Error al crear empresa ('+r.status+'): '+e.slice(0,200),'error'); return false; }
      return true;
    } catch(e) { console.error('saveEmpresa', e); toast('Error de conexión al crear empresa','error'); return false; }
  },

  async updateEmpresa(obj) {
    const row = toDB('empresas', obj);
    delete row.empresa_id;
    try {
      const r = await fetch(`${SB_URL}/rest/v1/empresas?id=eq.${obj.id}`, {
        method: 'PATCH',
        headers: sbHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify(row)
      });
      if(!r.ok){ const e=await r.text().catch(()=>''); console.error('updateEmpresa HTTP',r.status,e); toast('Error al guardar empresa ('+r.status+'): '+e.slice(0,200),'error'); return false; }
      return true;
    } catch(e) { console.error('updateEmpresa', e); toast('Error de conexión al guardar empresa','error'); return false; }
  },

  async deleteEmpresa(id) {
    try {
      await fetch(`${SB_URL}/rest/v1/empresas?id=eq.${id}`, {
        method: 'DELETE', headers: sbHeaders()
      });
    } catch(e) { console.error('deleteEmpresa', e); }
  },

  // ── Genérico: getE, setE (upsert), deleteItem ──
  async getE(eid, tbl) {
    const cached = DB._getCache(eid, tbl);
    if (cached) return cached;
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?empresa_id=eq.${eid}&select=*`, { headers: sbHeaders() });
      if(!r.ok){
        // tabla no existe u otro error HTTP — log silencioso, devolver vacío
        console.warn('getE HTTP error', tbl, r.status);
        return [];
      }
      const data = await r.json();
      if (!Array.isArray(data)) return [];
      const mapped = data.map(row => fromDB(tbl, row));
      DB._setCache(eid, tbl, mapped);
      return mapped;
    } catch { return []; }
  },

  async setE(eid, tbl, items) {
    // Estrategia segura:
    // 1. Upsert TODOS los items primero
    // 2. Solo si el upsert fue exitoso, borrar huérfanos
    // 3. Nunca borrar nada si el upsert falló
    DB._setCache(eid, tbl, items);
    try {
      if (items.length) {
        const rows = items.map(item => {
          const row = toDB(tbl, item);
          row.empresa_id = eid;
          return row;
        });
        const upsertRes = await fetch(`${SB_URL}/rest/v1/${tbl}`, {
          method: 'POST',
          headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify(rows)
        });
        // CRÍTICO: solo borrar huérfanos si el upsert fue exitoso
        if (!upsertRes.ok) {
          const errBody = await upsertRes.text().catch(()=>'');
          console.error('setE upsert failed', tbl, upsertRes.status, errBody);
          toast('Error al guardar ('+upsertRes.status+'): '+errBody.slice(0,120),'error');
          return false;
        }
        const newIds = items.map(i => i.id).filter(Boolean);
        if (newIds.length) {
          await fetch(`${SB_URL}/rest/v1/${tbl}?empresa_id=eq.${eid}&id=not.in.(${newIds.join(',')})`, {
            method: 'DELETE', headers: sbHeaders()
          });
        }
      } else {
        // Lista vacía → borrar todo (vaciado intencional, ej. importar backup)
        await fetch(`${SB_URL}/rest/v1/${tbl}?empresa_id=eq.${eid}`, {
          method: 'DELETE', headers: sbHeaders()
        });
      }
      return true;
    } catch(e) { console.error('setE', tbl, e); toast('Error de conexión al guardar','error'); return false; }
  },

  // Upsert de un solo item (más eficiente que reescribir toda la tabla)
  async upsertItem(eid, tbl, item) {
    try {
      const row = toDB(tbl, item);
      row.empresa_id = eid;
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(row)
      });
      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('upsertItem HTTP error', tbl, r.status, errBody);
        toast('Error al guardar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('upsertItem', tbl, e); toast('Error de conexión al guardar','error'); return false; }
  },

  async deleteItem(eid, tbl, id) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?id=eq.${id}&empresa_id=eq.${eid}`, {

      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('deleteItem HTTP error', tbl, r.status, errBody);
        toast('Error al eliminar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('deleteItem', tbl, e); toast('Error de conexión al eliminar','error'); return false; }
  },

  async patchItem(eid, tbl, id, changes) {
    try {
      const row = toDB(tbl, changes);
      delete row.empresa_id;
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?id=eq.${id}&empresa_id=eq.${eid}`, {
        method: 'PATCH',
        headers: sbHeaders(),
        body: JSON.stringify(row)

      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('patchItem HTTP error', tbl, r.status, errBody);
        toast('Error al actualizar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('patchItem', tbl, e); toast('Error de conexión','error'); return false; }
  },

  // ── Configuración ──
  async cfg(eid) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/configuracion?empresa_id=eq.${eid}&select=*`, { headers: sbHeaders() });
      const data = await r.json();
      if (Array.isArray(data) && data.length) {
        const row = data[0];
        return {
          nums: row.nums || {FAC:1,REC:1,CMP:1,OP:1},
          cierres: row.cierres || [],
          empresa_id: row.empresa_id
        };
      }
      return { nums: {FAC:1,REC:1,CMP:1,OP:1}, cierres: [] };
    } catch { return { nums: {FAC:1,REC:1,CMP:1,OP:1}, cierres: [] }; }
  },

  async setCfg(eid, val) {
    try {
      // Leer config actual para hacer merge completo
      const current = await DB.cfg(eid);
      const merged = Object.assign({}, current, val);
      const body = { empresa_id: eid };
      if (merged.nums !== undefined) body.nums = merged.nums;
      if (merged.cierres !== undefined) body.cierres = merged.cierres;
      await fetch(`${SB_URL}/rest/v1/configuracion`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(body)
      });
    } catch(e) { console.error('setCfg', e); }
  },

  // ── Usuarios ──
  async getUsuarios(eid) {
    return await DB.getE(eid, 'usuarios');
  },

  async findUsuario(eid, usuario, pwd) {
    try {
      // Filtra directamente por empresa_id (columna real en Supabase)
      const r = await fetch(
        `${SB_URL}/rest/v1/usuarios?empresa_id=eq.${encodeURIComponent(eid)}&usuario=eq.${encodeURIComponent(usuario)}&pwd=eq.${encodeURIComponent(pwd)}&activo=eq.true&select=*`,
        { headers: sbHeaders() }
      );
      const data = await r.json();
      if (!Array.isArray(data) || !data.length) return null;
      return fromDB('usuarios', data[0]);
    } catch { return null; }
  },
};

const FP_DEF=[
  {tipo:'efectivo',nombre:'Efectivo'},{tipo:'transferencia',nombre:'Transferencia bancaria'},
  {tipo:'cheque_comun',nombre:'Cheque común'},{tipo:'cheque_diferido',nombre:'Cheque diferido'},
  {tipo:'tarjeta',nombre:'Tarjeta débito'},{tipo:'tarjeta',nombre:'Tarjeta crédito'},
  {tipo:'digital',nombre:'MercadoPago / CBU digital'},
];
const RUBROS_DEF=['Sueldos','Alquileres','Servicios','Honorarios','Mantenimiento','Impuestos','Varios'];
const CAJA_DEF=[
  {nombre:'Caja Principal',descripcion:'Caja de efectivo principal'},
  {nombre:'Caja Chica',descripcion:'Fondo fijo'},
];

// Tipos de FP que requieren banco vs caja
const FP_TIPO_BANCO=['transferencia','digital'];
const FP_TIPO_CAJA=['efectivo','cheque_comun','cheque_diferido','tarjeta','personalizada'];

async function initEmpresa(eid){
  const fps=await DB.getE(eid,'formas_pago');
  if(!fps.length) await DB.setE(eid,'formas_pago',FP_DEF.map(f=>({...f,id:genId(),activo:true})));
  const rubs=await DB.getE(eid,'rubros');
  if(!rubs.length) await DB.setE(eid,'rubros',RUBROS_DEF.map(n=>({id:genId(),nombre:n,activo:true})));
  const cfg=await DB.cfg(eid);
  if(!cfg.nums) await DB.setCfg(eid,{nums:{FAC:1,REC:1,CMP:1,OP:1}});
  const users=await DB.getUsuarios(eid);
  if(!users.length) await DB.setE(eid,'usuarios',[{id:genId(),nombre:'Administrador',usuario:'admin',pwd:hashPwd('admin'),rol:'admin',activo:true,empresaId:eid}]);
  try{
    const cajas=await DB.getE(eid,'cajas');
    if(!cajas.length) await DB.setE(eid,'cajas',CAJA_DEF.map(c=>({...c,id:genId(),activo:true})));
  }catch(e){}
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t||'');
  try{localStorage.setItem('sg-theme',t||'')}catch(e){}
  document.querySelectorAll('.theme-dot').forEach(d=>{
    d.classList.toggle('active',d.dataset.t===(t||''));
  });
}
function initTheme(){
  var t='';try{t=localStorage.getItem('sg-theme')||'';}catch(e){}
  applyTheme(t);
}

// ── Helper: determina si una FP requiere banco o caja ──
async function getFPTipo(eid,fpId){
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  if(!fp)return null;
  if(FP_TIPO_BANCO.includes(fp.tipo))return 'banco';
  if(FP_TIPO_CAJA.includes(fp.tipo))return 'caja';
  return null;
}

// ── HTML dinámico: campo banco o caja según FP ──
async function fpOnChange(eid,fpId,bancosHtml,cajasHtml,bancoContId,cajaContId){
  const tipo=await getFPTipo(eid,fpId);
  var bc=document.getElementById(bancoContId);
  var cc=document.getElementById(cajaContId);
  if(bc)bc.style.display=tipo==='banco'?'':'none';
  if(cc)cc.style.display=tipo==='caja'?'':'none';
}

async function renderDashboard(c){
  const eid=_empresa.id;
  const clientes=await DB.getE(eid,'clientes');
  const cl=clientes.filter(x=>x.activo).length;
  const pr=(await DB.getE(eid,'proveedores')).filter(x=>x.activo).length;
  const fv=await DB.getE(eid,'facturas_venta');
  const fc=await DB.getE(eid,'facturas_compra');
  const hoy=today();
  // Pendientes CC: misma lógica que calcCC en cuentas corrientes (saldo neto = FV - recibos - NC)
  const recibos=await DB.getE(eid,'recibos_cobro');
  let ncsVenta=[];try{ncsVenta=(await DB.getE(eid,'notas_credito')).filter(x=>x.tipo==='venta');}catch(e){}
  function getFechaVencFV(f){
    if(f.fechaVenc)return f.fechaVenc;
    const cl2=clientes.find(c2=>c2.id===f.clienteId);
    const dias=(cl2&&cl2.diasVenc)||30;
    if(!f.fecha)return hoy;
    const d=new Date(f.fecha);d.setDate(d.getDate()+dias);
    return d.toISOString().slice(0,10);
  }
  // Calcular por cliente igual que calcCC: débito CC - créditos (recibos + NC) = saldo neto
  // Incluir cualquier cliente con facturas cc o recibos, igual que renderCCClientes
  let pendVencido=0,pendNoVencido=0;
  const clientesCcActivos=clientes.filter(cl2=>
    cl2.condicionCobro==='cc'
    ||fv.some(f=>f.clienteId===cl2.id&&f.tipo==='cc')
    ||recibos.some(r=>r.clienteId===cl2.id)
  );
  for(const cl2 of clientesCcActivos){
    const fvsCl=fv.filter(f=>f.clienteId===cl2.id&&f.tipo==='cc');
    const recsCl=recibos.filter(r=>r.clienteId===cl2.id);
    const ncsCl=ncsVenta.filter(n=>n.clienteId===cl2.id);
    const debito=fvsCl.reduce((s,f)=>s+f.total,0);
    const credito=recsCl.reduce((s,r)=>s+r.importe,0)+ncsCl.reduce((s,n)=>s+n.importe,0);
    const saldoCl=debito-credito;
    if(saldoCl<=0)continue;
    // Distribuir saldo neto entre fv con saldo pendiente real por vencimiento
    // Usamos comprobantesAplicados para calcular saldo real de cada FV (independiente de su estado guardado)
    const fvsOrdenadas=fvsCl.slice().sort((a,b)=>getFechaVencFV(a)<getFechaVencFV(b)?-1:1);
    let resto=saldoCl;
    for(const f of fvsOrdenadas){
      if(resto<=0)break;
      const yaImputado=recsCl.reduce((s,r)=>(s+(r.comprobantesAplicados||[]).filter(c=>c.id===f.id).reduce((a,c)=>a+(parseFloat(c.importeAplicado)||0),0)),0);
      const saldoFv=Math.max(0,f.total-yaImputado);
      if(saldoFv<0.001)continue; // ya cubierta totalmente
      const aplicado=Math.min(saldoFv,resto);
      if(aplicado>0.001){
        if(getFechaVencFV(f)<hoy)pendVencido+=aplicado;
        else pendNoVencido+=aplicado;
        resto-=aplicado;
      }
    }
  }
  const pendCobro=pendVencido+pendNoVencido;
  const pendPago=fc.filter(f=>f.tipo==='cc'&&f.estado!=='pagada').reduce((s,f)=>s+f.total,0);
  const mes=today().slice(0,7)+'-01';
  const vtaMes=fv.filter(f=>f.fecha>=mes).reduce((s,f)=>s+f.total,0);
  (c||document.getElementById('main-content')).innerHTML=`
    <p class="mb16 text-muted">Bienvenido, <strong style="color:var(--text)">${esc(_user.nombre)}</strong> · ${esc(_empresa.nombre)}</p>
    <div class="g4 mb24">
      <div class="stat-card"><div class="stat-lbl">Clientes activos</div><div class="stat-val" style="color:var(--accent);font-size:20px">${cl}</div></div>
      <div class="stat-card"><div class="stat-lbl">Proveedores activos</div><div class="stat-val" style="color:var(--accent);font-size:20px">${pr}</div></div>
      <div class="stat-card"><div class="stat-lbl">Ventas del mes</div><div class="stat-val" style="color:var(--accent);font-size:20px">${fmtARS(vtaMes)}</div></div>
      <div class="stat-card" onclick="navTo('cuentas-corrientes')" style="cursor:pointer" title="Ver cuentas corrientes">
        <div class="stat-lbl">Pendiente de cobro</div>
        <div class="stat-val" style="color:var(--yellow);font-size:20px">${fmtARS(pendCobro)}</div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px">
          ${pendVencido>0?`<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--red);font-weight:600">⚠ Vencido</span><span style="color:var(--red);font-weight:600">${fmtARS(pendVencido)}</span></div>`:''}
          ${pendNoVencido>0?`<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text2)">Por vencer</span><span style="color:var(--text2)">${fmtARS(pendNoVencido)}</span></div>`:''}
          ${pendCobro===0?`<div style="font-size:11px;color:var(--green)">✓ Sin pendientes</div>`:''}
        </div>
      </div>
    </div>
    <h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Módulos del sistema</h3>
    <div class="module-grid">
      ${[['ventas','💰','Ventas','Facturas y recibos de cobro'],['compras','🛒','Compras','Facturas de compra y pagos'],['tesoreria','🏦','Tesorería','Caja, bancos y flujo de fondos'],['informes','📊','Informes','Reportes económicos'],['clientes','👥','Clientes','Maestro de clientes'],['proveedores','🏭','Proveedores','Maestro de proveedores']].map(([s,i,n,d])=>`
        <div class="mod-card" onclick="navTo('${s}')">
          <div class="mod-icon">${i}</div><div class="mod-name">${n}</div><div class="mod-desc">${d}</div>
        </div>`).join('')}
    </div>
    <div style="margin-top:20px;padding:14px 16px;background:var(--yellow-bg);border:1px solid var(--yellow-bd);border-radius:var(--r);display:flex;align-items:center;gap:12px">
      <span style="font-size:18px">🔄</span>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:var(--yellow)">Recalcular estados de facturas</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Si el dashboard muestra facturas pendientes que ya fueron cobradas/pagadas, usá esta herramienta para corregir los datos históricos.</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="recalcularEstados()" style="white-space:nowrap">Recalcular ahora</button>
    </div>`;
}

// ─── actualizar abonos globalmente ──────────────────────
async function actualizarAbonosGlobal(){
  const pct=parseFloat(prompt('¿En qué porcentaje actualizar los abonos? (ej: 15 para +15%):'));
  if(isNaN(pct)||pct===null)return;
  const factor=1+pct/100;
  const eid=_empresa.id;
  showLoading('Actualizando abonos...');
  const clientes=await DB.getE(eid,'clientes');
  let updated=0;
  for(const cl of clientes){
    if(!cl.activo||!cl.abonos||!cl.abonos.length)continue;
    const newAbonos=cl.abonos.map(a=>({...a,precio:Math.round(a.precio*factor*100)/100}));
    await DB.upsertItem(eid,'clientes',{...cl,abonos:newAbonos});
    updated++;
  }
  DB._clearCache(eid,'clientes');
  hideLoading();
  toast(`Abonos actualizados en ${updated} cliente${updated!==1?'s':''} (${pct>0?'+':''}${pct}%)  ✓`,'success');
}

// ─── actualizar precios productos venta ──────────────────
async function actualizarPreciosVenta(){
  const pct=parseFloat(prompt('¿En qué porcentaje actualizar los precios de venta? (ej: 15 para +15%):'));
  if(isNaN(pct)||pct===null)return;
  const factor=1+pct/100;
  const eid=_empresa.id;
  showLoading('Actualizando precios...');
  const prods=await DB.getE(eid,'productos_venta');
  let updated=0;
  for(const p of prods){
    if(!p.activo)continue;
    const newPrecio=Math.round(p.precio*factor*100)/100;
    await DB.upsertItem(eid,'productos_venta',{...p,precio:newPrecio});
    updated++;
  }
  DB._cache[eid+':productos_venta']=null;
  hideLoading();
  toast(`Precios actualizados en ${updated} producto${updated!==1?'s':''} (${pct>0?'+':''}${pct}%)  ✓`,'success');
  renderProductos('prod-venta');
}

async function renderSueldos(c){
  if(_user.rol!=='admin'){(c||document.getElementById('main-content')).innerHTML=`<div class="empty"><div class="ei">🔐</div><h3>Sin acceso</h3><p>Solo administradores pueden ver este módulo</p></div>`;return}
  const eid=_empresa.id;
  const empleados=await DB.getE(eid,'empleados');
  const liqAll=await DB.getE(eid,'liquidaciones_sueldo');
  const pagAll=await DB.getE(eid,'pagos_sueldo');

  const activos=empleados.filter(e=>e.activo!==false);

  // Resumen de deudas por empleado
  function saldoEmpleado(emp){
    const liqs=liqAll.filter(l=>l.empleadoId===emp.id&&l.estado!=='pagada');
    const pags=pagAll.filter(p=>p.empleadoId===emp.id);
    const totalLiq=liqs.reduce((s,l)=>s+l.total,0);
    const totalPag=pags.reduce((s,p)=>s+p.importe,0);
    return totalLiq-totalPag;
  }

  const cont=c||document.getElementById('main-content');
  cont.innerHTML=`
    <div class="toolbar mb16">
      <div class="toolbar-l"></div>
      <button class="btn btn-primary btn-sm" onclick="openEmpleadoModal()">+ Nuevo empleado</button>
    </div>
    ${activos.length===0?`<div class="empty"><div class="ei">👷</div><h3>Sin empleados</h3><p>Agregá el primer empleado para comenzar</p></div>`:`
    <div class="card">
      <h3 class="fw6 mb12" style="font-size:14px">Empleados</h3>
      <div class="tw"><table>
        <thead><tr><th>Nombre</th><th>DNI</th><th class="td-r">Saldo pendiente</th><th>Acciones</th></tr></thead>
        <tbody>
          ${activos.map(emp=>{
            const saldo=saldoEmpleado(emp);
            return`<tr>
              <td><strong>${esc(emp.nombre)}</strong></td>
              <td class="td-mono">${esc(emp.dni||'—')}</td>
              <td class="td-mono td-r" style="color:${saldo>0?'var(--red)':'var(--green)'}">${fmtARS(saldo)}</td>
              <td style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-sm" onclick="verCCEmpleado('${emp.id}')">📄 Cuenta corriente</button>
                <button class="btn btn-primary btn-sm" onclick="openLiqModal('${emp.id}')">+ Liquidar</button>
                <button class="btn btn-secondary btn-sm" onclick="editEmpleadoModal('${emp.id}')">✏️</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>`}
  `;
}

async function saveLiquidacion(){
  const eid=_empresa.id;
  const empleadoId=document.getElementById('liq-empid').value;
  const periodo=document.getElementById('liq-periodo').value;
  const fecha=document.getElementById('liq-fecha').value;
  const sueldo=parseFloat(document.getElementById('liq-sueldo').value)||0;
  const comision=parseFloat(document.getElementById('liq-comision').value)||0;
  const total=sueldo+comision;
  if(!periodo){toast('El período es obligatorio','error');return;}
  if(!fecha){toast('La fecha es obligatoria','error');return;}
  if(total<=0){toast('El total debe ser mayor a cero','error');return;}
  const cfg=await DB.cfg(eid);
  const nums=getNums(cfg);
  const numLiq=nums.LIQ||1;
  const numero='LIQ-'+String(numLiq).padStart(5,'0');
  await DB.setCfg(eid,{...cfg,nums:{...nums,LIQ:numLiq+1}});
  const liq={
    id:genId(),empleadoId,numero,periodo,fecha,sueldo,comision,total,
    estado:'pendiente',observaciones:document.getElementById('liq-obs').value.trim(),
    fechaCreacion:new Date().toISOString()

  else await renderSueldos(document.getElementById('main-content'));

async function verCCEmpleado(empleadoId){
  _suelEmp=empleadoId;
  if(_user.rol!=='admin') return;
  const eid=_empresa.id;
  const emps=await DB.getE(eid,'empleados');
  const emp=emps.find(e=>e.id===empleadoId);
  if(!emp)return;
  const liqs=( await DB.getE(eid,'liquidaciones_sueldo')).filter(l=>l.empleadoId===empleadoId);
  const pags=(await DB.getE(eid,'pagos_sueldo')).filter(p=>p.empleadoId===empleadoId);
  const fps=await DB.getE(eid,'formas_pago');

  // Construir movimientos de CC
  const movs=[
    ...liqs.map(l=>({fecha:l.fecha,tipo:'Liquidación',numero:l.numero,periodo:l.periodo,debito:l.total,credito:0,estado:l.estado,id:l.id,tabla:'liq'})),
    ...pags.map(p=>{const fp=fps.find(x=>x.id===p.formaPagoId);return{fecha:p.fecha,tipo:'Pago',numero:p.numero,debito:0,credito:p.importe,estado:'pagado',desc:fp?fp.nombre:'',id:p.id,tabla:'pag'};})
  ].sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);

  let saldo=0;
  const rows=movs.map(m=>{
    saldo+=m.debito-m.credito;
    const signo=saldo>0?'var(--red)':saldo<0?'var(--green)':'var(--text)';
    return`<tr>
      <td>${esc(m.fecha)}</td>
      <td><span class="badge ${m.tipo==='Liquidación'?'badge-yellow':'badge-green'}">${esc(m.tipo)}</span></td>
      <td class="td-mono">${esc(m.numero||'')}</td>
      <td>${esc(m.periodo||m.desc||'')}</td>
      <td class="td-mono td-r" style="color:var(--red)">${m.debito>0?fmtARS(m.debito):'—'}</td>
      <td class="td-mono td-r" style="color:var(--green)">${m.credito>0?fmtARS(m.credito):'—'}</td>
      <td class="td-mono td-r" style="font-weight:600;color:${signo}">${fmtARS(Math.abs(saldo))}</td>
      <td style="display:flex;gap:4px">
        ${m.tabla==='liq'&&m.estado==='pendiente'?`<button class="btn btn-primary btn-sm" onclick="openPagoSueldoModal('${m.id}','${empleadoId}')">💰 Pagar</button>`:''}
        ${m.tabla==='pag'?`<button class="btn btn-danger btn-sm" onclick="eliminarPagoSueldo('${m.id}','${empleadoId}')">🗑</button>`:''}
      </td>
    </tr>`;
  }).join('');

  const deuda=liqs.reduce((s,l)=>s+l.total,0)-pags.reduce((s,p)=>s+p.importe,0);

  const cont=document.getElementById('main-content');
  cont.innerHTML=`
    <div class="toolbar mb16">
      <div class="toolbar-l">
        <button class="btn btn-secondary btn-sm" onclick="renderSueldos(document.getElementById('main-content'))">← Volver</button>
        <span style="font-size:15px;font-weight:600;margin-left:12px">👷 ${esc(emp.nombre)}</span>
        <span class="badge badge-blue" style="margin-left:8px">DNI: ${esc(emp.dni||'—')}</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="openLiqModal('${empleadoId}')">+ Liquidar</button>
        ${deuda>0?`<button class="btn btn-primary btn-sm" onclick="openPagoSueldoModal(null,'${empleadoId}')">💰 Registrar pago</button>`:''}
      </div>
    </div>
    <div class="stat-card mb16" style="display:inline-flex;gap:20px;padding:14px 20px">
      <div><div class="stat-lbl">Saldo pendiente</div><div class="stat-val" style="color:${deuda>0?'var(--red)':deuda<0?'var(--green)':'var(--text2)'};">${fmtARS(deuda)}</div></div>
      <div><div class="stat-lbl">Total liquidado</div><div class="stat-val">${fmtARS(liqs.reduce((s,l)=>s+l.total,0))}</div></div>
      <div><div class="stat-lbl">Total pagado</div><div class="stat-val" style="color:var(--green)">${fmtARS(pags.reduce((s,p)=>s+p.importe,0))}</div></div>
    </div>
    <div class="card">
      <h3 class="fw6 mb12" style="font-size:14px">Cuenta corriente</h3>
      ${movs.length?`<div class="tw"><table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>N°</th><th>Período / Forma</th><th class="td-r">Débito</th><th class="td-r">Crédito</th><th class="td-r">Saldo</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`:`<p class="text-muted" style="font-size:13px">Sin movimientos aún</p>`}
    </div>
  `;
}

async function openPagoSueldoModal(liqId,empleadoId){
  const eid=_empresa.id;
  const fps=await DB.getE(eid,'formas_pago');
  const cajas=await DB.getE(eid,'cajas');
  const emps=await DB.getE(eid,'empleados');
  const emp=emps.find(e=>e.id===empleadoId);

  // Si se paga una liquidación específica, pre-llenar importe
  let importePre=0;
  if(liqId){
    const liqs=await DB.getE(eid,'liquidaciones_sueldo');
    const liq=liqs.find(l=>l.id===liqId);
    if(liq){
      const pags=(await DB.getE(eid,'pagos_sueldo')).filter(p=>p.liquidacionId===liqId);
      importePre=liq.total-pags.reduce((s,p)=>s+p.importe,0);
      if(importePre<0)importePre=0;
    }
  }

  openModal('Registrar pago'+(emp?' · '+esc(emp.nombre):''),`
    <input type="hidden" id="pago-liqid" value="${liqId||''}">
    <input type="hidden" id="pago-empid" value="${empleadoId}">
    <div class="fg">
      <div class="fc"><label class="lbl">Fecha *</label><input id="pago-fecha" class="inp" type="date" value="${today()}"></div>
      <div class="fc"><label class="lbl">Importe *</label><input id="pago-importe" class="inp" type="number" min="0" step="0.01" value="${importePre||''}"></div>
    </div>
    <div class="fg">
      <div class="fc"><label class="lbl">Forma de pago</label>
        <select id="pago-fp" class="inp">
          <option value="">— Seleccionar —</option>
          ${fps.filter(f=>f.activo).map(f=>`<option value="${f.id}">${esc(f.nombre)}</option>`).join('')}
        </select>
      </div>
      <div class="fc"><label class="lbl">Caja / Banco</label>
        <select id="pago-caja" class="inp">
          <option value="">— Opcional —</option>
          ${cajas.filter(c=>c.activo).map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fc mt8"><label class="lbl">Observaciones</label><textarea id="pago-obs" class="inp" rows="2" placeholder="Opcional"></textarea></div>
  `,[{lbl:'Registrar pago',cls:'btn-primary',fn:'savePagoSueldo()'}]);
  setTimeout(()=>document.getElementById('pago-importe').focus(),50);
}

async function savePagoSueldo(){
  const eid=_empresa.id;
  const liqId=document.getElementById('pago-liqid').value||null;
  const empleadoId=document.getElementById('pago-empid').value;
  const fecha=document.getElementById('pago-fecha').value;
  const importe=parseFloat(document.getElementById('pago-importe').value)||0;
  const formaPagoId=document.getElementById('pago-fp').value||null;
  const cajaId=document.getElementById('pago-caja').value||null;
  if(!fecha){toast('La fecha es obligatoria','error');return;}
  if(importe<=0){toast('El importe debe ser mayor a cero','error');return;}
  const cfg=await DB.cfg(eid);
  const nums=getNums(cfg);
  const numPag=nums.PS||1;
  const numero='PS-'+String(numPag).padStart(5,'0');
  await DB.setCfg(eid,{...cfg,nums:{...nums,PS:numPag+1}});
  const pago={
    id:genId(),empleadoId,liquidacionId:liqId,numero,fecha,importe,
    formaPagoId,cajaId,observaciones:document.getElementById('pago-obs').value.trim(),
    fechaCreacion:new Date().toISOString()
  };
  await DB.upsertItem(eid,'pagos_sueldo',pago);
  DB._clearCache(eid,'pagos_sueldo');
  // Marcar liquidación como pagada si saldo cubre el total
  if(liqId){
    const liqs=await DB.getE(eid,'liquidaciones_sueldo');
    const liq=liqs.find(l=>l.id===liqId);
    if(liq){
      const pagsLiq=(await DB.getE(eid,'pagos_sueldo')).filter(p=>p.liquidacionId===liqId);
      const totalPagado=pagsLiq.reduce((s,p)=>s+p.importe,0);
      if(totalPagado>=liq.total){
        await DB.upsertItem(eid,'liquidaciones_sueldo',{...liq,estado:'pagada'});
        DB._clearCache(eid,'liquidaciones_sueldo');
      }
    }
  }
  closeModal();toast('Pago '+numero+' registrado ✓','success');
  await verCCEmpleado(empleadoId);
}

async function eliminarPagoSueldo(pagoId,empleadoId){
  confirm('Eliminar pago','¿Eliminar este pago de sueldo? Esta acción no se puede deshacer.',async()=>{
    const eid=_empresa.id;
    const pags=await DB.getE(eid,'pagos_sueldo');
    const pago=pags.find(p=>p.id===pagoId);
    if(pago&&pago.liquidacionId){
      // Revertir estado de la liquidación a pendiente
      const liqs=await DB.getE(eid,'liquidaciones_sueldo');
      const liq=liqs.find(l=>l.id===pago.liquidacionId);
      if(liq&&liq.estado==='pagada'){
        await DB.upsertItem(eid,'liquidaciones_sueldo',{...liq,estado:'pendiente'});
        DB._clearCache(eid,'liquidaciones_sueldo');
      }
    }
    await DB.deleteItem(eid,'pagos_sueldo',pagoId);
    DB._clearCache(eid,'pagos_sueldo');
    toast('Pago eliminado','success');
    await verCCEmpleado(empleadoId);
  });
}

async function saveUsuario(id){
  const nombre=document.getElementById('us-n').value.trim();
  const usuario=document.getElementById('us-u').value.trim();
  if(!nombre||!usuario){toast('Nombre y usuario obligatorios','error');return}
  const eid=_empresa.id;
  let items=await DB.getE(eid,'usuarios');
  if(items.find(x=>x.usuario===usuario&&x.id!==id)){toast('Ese usuario ya existe','error');return}
  const old=id?items.find(x=>x.id===id):null;
  const pwd=document.getElementById('us-p').value;
  const cbs=[...document.querySelectorAll('.us-emp-cb:checked')].map(x=>x.value);
  const empresasIds=cbs.length?cbs:[eid];
  const obj={id:id||genId(),nombre,usuario,rol:document.getElementById('us-r').value,
    activo:document.getElementById('us-act').value==='1',
    pwd:pwd?hashPwd(pwd):(old?old.pwd:hashPwd('admin')),
    empresasIds,empresaId:eid};
  showLoading('Guardando...');
  const ok=await DB.upsertItem(eid,'usuarios',obj);
  DB._clearCache(eid,'usuarios');
  hideLoading();
  if(!ok)return;
  closeModal();toast('Usuario guardado','success');renderUsuarios();
}

function previewLogo(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('ec-logo-data').value=e.target.result;
    const p=document.getElementById('logo-preview');
    if(p.tagName==='IMG')p.src=e.target.result;
    else{const img=document.createElement('img');img.id='logo-preview';img.src=e.target.result;img.style='height:48px;max-width:180px;object-fit:contain;border:1px solid var(--border);border-radius:6px;padding:4px';p.replaceWith(img);}
  };
  reader.readAsDataURL(file);
}

async function fvAddLinea(){
  _fvLineas.push({id:genId(),desc:'',cantidad:1,precio:0});
  fvRenderLineas();
}
async function fvRemoveLinea(id){
  _fvLineas=_fvLineas.filter(x=>x.id!==id);
  fvRenderLineas();
}
async function fvUpdateLinea(id,field,val){
  const ln=_fvLineas.find(x=>x.id===id);if(!ln)return;
  if(field==='cantidad'||field==='precio'){
    ln[field]=typeof val==='number'?val:parseFloat(String(val).replace(/\./g,'').replace(',','.'))||0;
  } else {
    ln[field]=val;
    if(field==='desc'&&ln.precio===0){
      const eid=_empresa.id;
      const prod=(await DB.getE(eid,'productos_venta')).find(p=>p.descripcion.toLowerCase()===val.toLowerCase());
      if(prod){ln.precio=prod.precio;fvRenderLineas();return}
    }
  }
  // Actualizar subtotal en el DOM sin re-renderizar toda la grilla
  const cont=document.getElementById('fv-lineas');
  if(cont){
    const divs=cont.querySelectorAll('div[style*="grid"]');
    const idx=_fvLineas.findIndex(x=>x.id===id);
    if(idx>=0&&divs[idx]){
      const sub=divs[idx].querySelectorAll('input')[3];
      if(sub)sub.value=fmtNum(ln.cantidad*ln.precio);
    }
  }
  fvUpdateTotal();
}
async function fvRenderLineas(){
  const eid=_empresa.id;
  const prods=(await DB.getE(eid,'productos_venta')).filter(x=>x.activo);
  const cont=document.getElementById('fv-lineas');if(!cont)return;
  cont.innerHTML=_fvLineas.map(ln=>`

      <div><input value="${esc(ln.desc)}" placeholder="Concepto..." oninput="fvUpdateLinea('${ln.id}','desc',this.value)" list="fv-prods" style="width:100%;box-sizing:border-box;padding:7px 9px"></div>
      <div><input inputmode="decimal" data-raw-val="${ln.cantidad}" value="${ln.cantidad.toLocaleString('es-AR',{maximumFractionDigits:2})}" oninput="fmtInputMiles(this);fvUpdateLinea('${ln.id}','cantidad',getRawVal(this))" style="width:100%;box-sizing:border-box;text-align:right;padding:7px 9px"></div>
      <div><input inputmode="decimal" data-raw-val="${ln.precio}" value="${ln.precio>0?ln.precio.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}" placeholder="0,00" oninput="fmtInputMiles(this);fvUpdateLinea('${ln.id}','precio',getRawVal(this))" style="width:100%;box-sizing:border-box;text-align:right;padding:7px 9px"></div>
      <div><input value="${fmtNum(ln.cantidad*ln.precio)}" readonly style="width:100%;box-sizing:border-box;text-align:right;padding:7px 9px;background:var(--surface2);font-family:var(--mono);font-size:12px"></div>
      <button class="btn btn-ghost btn-icon" onclick="fvRemoveLinea('${ln.id}')" style="padding:4px 6px;font-size:12px">✕</button>
    </div>
  `).join('')+`<datalist id="fv-prods">${prods.map(p=>`<option value="${esc(p.descripcion)}">`).join('')}</datalist>`;
  fvUpdateTotal();
}
function fvUpdateTotal(){
  const t=_fvLineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
  const el=document.getElementById('fv-total');if(el)el.textContent=fmtARS(t);
}
async function saveFV(){
  const eid=_empresa.id;
  const clienteId=document.getElementById('fv-cl').value;
  if(!clienteId){toast('Seleccioná un cliente','error');return}
  const tipo=document.getElementById('fv-tipo').value;
  const lineas=_fvLineas.filter(l=>l.desc||l.precio>0);
  if(!lineas.length){toast('Agregá al menos una línea','error');return}
  const _fechaFV=document.getElementById('fv-f').value;
  if(await isMesCerrado(_fechaFV)){toast('El período '+_fechaFV.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const total=lineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
  const cfg=await DB.cfg(eid);const nums=getNums(cfg);
  const numero=`FAC-${String(nums.FAC).padStart(5,'0')}`;
  nums.FAC++;await DB.setCfg(eid,{nums});
  let formaPagoId=null,cajaId=null,bancoId=null;
  if(tipo==='contado'){
    formaPagoId=document.getElementById('fv-fp').value;
    if(!formaPagoId){toast('Seleccioná una forma de cobro','error');return}
    const fps2=await DB.getE(eid,'formas_pago');
    const fp=fps2.find(x=>x.id===formaPagoId);

async function saveReciboRapido(facId){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('rc-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('rc-fp').value;
  if(!fpId){toast('Seleccioná una forma de cobro','error');return}
  // validar banco o caja según tipo
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  let bancoId='',cajaId='';
  if(fp&&FP_TIPO_BANCO.includes(fp.tipo)){
    bancoId=document.getElementById('rc-bk')?.value||'';
    if(!bancoId){toast('Seleccioná el banco para esta forma de cobro','error');return}
  }
  if(fp&&FP_TIPO_CAJA.includes(fp.tipo)){
    cajaId=document.getElementById('rc-cj')?.value||'';
    if(!cajaId){toast('Seleccioná la caja para esta forma de cobro','error');return}
  }
  const _fechaRR=document.getElementById('rc-f').value;
  if(await isMesCerrado(_fechaRR)){toast('El período '+_fechaRR.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const cfg=await DB.cfg(eid);const nums=getNums(cfg);
  const numero=`RC-${String(nums.RC||1).padStart(5,'0')}`;
  nums.RC=(nums.RC||1)+1;await DB.setCfg(eid,{...cfg,nums});
  const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===facId);
  const recibo={id:genId(),numero,fecha:document.getElementById('rc-f').value,
    clienteId:fac.clienteId,importe,formaPagoId:fpId,
    ...(bancoId&&{bancoId}),
    ...(cajaId&&{cajaId}),
    facturaIds:[facId],
    comprobantesAplicados:[{id:facId,tipo:'fv',numero:fac.numero,importeAplicado:importe}],
    observaciones:document.getElementById('rc-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  await DB.upsertItem(eid,'recibos_cobro',recibo);
  DB._clearCache(eid,'recibos_cobro');
  // marcar factura cobrada solo si el importe cubre el total
  const facToMark=await DB.getE(eid,'facturas_venta').then(fvs=>fvs.find(f=>f.id===facId));
  if(facToMark&&importe>=facToMark.total-0.001){await DB.upsertItem(eid,'facturas_venta',{...facToMark,estado:'cobrada',fechaCobro:recibo.fecha});DB._clearCache(eid,'facturas_venta');}
  closeModal();toast(`Cobro registrado · ${numero}`,'success');renderVentas();
}

function exportarAbonosExcel(){
  const eid=_empresa.id;
  // Obtener clientes seleccionados actualmente
  const cks=[...document.querySelectorAll('.fm-ck:checked')];
  if(!cks.length){toast('Seleccioná al menos un cliente','error');return;}
  const fecha=document.getElementById('fm-fecha')?.value||today();
  DB.getE(eid,'clientes').then(todos=>{
    const selIds=new Set(cks.map(c=>c.value));
    const clientes=todos.filter(c=>selIds.has(c.id));
    // Armar filas: una fila por línea de abono
    const rows=[];
    clientes.forEach(cl=>{
      const abs=(cl.abonos&&cl.abonos.length)?cl.abonos:(cl.serviciosHabituales||[]);
      abs.forEach((a,i)=>{
        rows.push({
          Cliente:cl.nombre,
          Descripcion:a.descripcion||'',
          Cantidad:a.cantidad||1,
          PrecioUnitario:a.precio||0,
          Subtotal:(a.cantidad||1)*(a.precio||0),
          FechaEmision:fecha,
          CondicionCobro:cl.condicionCobro||'',
          DiasVencimiento:cl.diasVenc||''
        });
      });
    });
    if(!rows.length){toast('No hay abonos para exportar','error');return;}
    // Generar CSV compatible con Excel (UTF-8 BOM para acentos)
    const headers=['Cliente','Descripcion','Cantidad','PrecioUnitario','Subtotal','FechaEmision','CondicionCobro','DiasVencimiento'];
    const sep=';'; // punto y coma — estándar Argentina/Excel español
    const csvLines=[headers.join(sep)];
    rows.forEach(r=>{
      csvLines.push(headers.map(h=>{
        const v=r[h];
        if(typeof v==='string'&&(v.includes(sep)||v.includes('"')||v.includes('\n'))){
          return '"'+v.replace(/"/g,'""')+'"';
        }
        return v;
      }).join(sep));
    });
    const bom='﻿';
    const csvStr=bom+csvLines.join('\r\n');
    const blob=new Blob([csvStr],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`abonos_${fecha}.csv`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`${rows.length} fila${rows.length!==1?'s':''} exportada${rows.length!==1?'s':''}  ✓`,'success');
  });
}

async function ejecutarFacMasiva(){
  const eid=_empresa.id;
  const fecha=document.getElementById('fm-fecha').value;
  if(!fecha){toast('Seleccioná una fecha','error');return}
  const selected=[...document.querySelectorAll('.fm-ck:checked')].map(x=>x.value);
  if(!selected.length){toast('Seleccioná al menos un cliente','error');return}
  // Control mes cerrado
  const cfg=await DB.cfg(eid);
  const mesFecha=fecha.substring(0,7);
  const cierres=cfg.cierres||[];
  if(cierres.some(c=>c.mes>=mesFecha)){
    toast(`El mes ${mesFecha} o un mes posterior está cerrado — no se puede generar`,'error');return;
  }
  const totalSel=selected.length;
  confirm(
    '¿Generar facturas de abonos?',
    `Se generarán facturas para ${totalSel} cliente${totalSel!==1?'s':''} con fecha ${fecha}. Esta operación se puede deshacer.`,
    async()=>{
      const clientes=(await DB.getE(eid,'clientes')).filter(x=>selected.includes(x.id));
      const nums=getNums(cfg);
      // Siempre leer facturas frescas desde Supabase para evitar cache desactualizado
      DB._clearCache(eid,'facturas_venta');
      const fvs=await DB.getE(eid,'facturas_venta');
      // Clientes que ya tienen factura de abono para este mes → saltear
      const yaFacturadosEsMes=new Set(fvs.filter(f=>f.loteAbonos&&f.fecha&&f.fecha.startsWith(mesFecha)).map(f=>f.clienteId));
      const loteId=genId(); // ID de lote para poder deshacer
      const nuevasFacs=[];
      let count=0;
      let saltados=0;
      clientes.forEach(cl=>{
        if(yaFacturadosEsMes.has(cl.id)){saltados++;return;}
        const _abs=(cl.abonos&&cl.abonos.length)?cl.abonos:(cl.serviciosHabituales||[]);
        if(!_abs.length)return;
        const lineas=_abs.map(s=>({id:genId(),desc:s.descripcion,cantidad:s.cantidad,precio:s.precio}));
        const total=lineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
        const numero=`FAC-${String(nums.FAC).padStart(5,'0')}`;nums.FAC++;count++;
        nuevasFacs.push({id:genId(),numero,fecha,clienteId:cl.id,tipo:cl.condicionCobro,
          vencimiento:cl.condicionCobro==='cc'?addDays(fecha,cl.diasVenc||30):null,
          total,lineas,estado:cl.condicionCobro==='contado'?'cobrada':'pendiente',
          loteAbonos:loteId,
          fechaCreacion:new Date().toISOString()});
      });
      if(!count){hideLoading();toast('No hay clientes nuevos para generar en '+mesFecha+' (todos ya tienen abono facturado ese mes)','info');return;}
      showLoading('Generando facturas...');
      await DB.setCfg(eid,{...cfg,nums});
      // Insertar solo las facturas nuevas — nunca tocar las existentes
      for(const fac of nuevasFacs){
        await DB.upsertItem(eid,'facturas_venta',fac);
      }
      DB._clearCache(eid,'facturas_venta');
      hideLoading();
      const saltMsg=saltados?` (${saltados} ya ten${saltados===1?'ía':'ían'} factura ese mes)`:'';
      toast(`${count} factura${count!==1?'s':''} generada${count!==1?'s':''}${saltMsg}  ✓`,'success');
      navTo('ventas');
    }
  );
}

async function deshacerFacMasiva(){
  const eid=_empresa.id;
  let fvs=await DB.getE(eid,'facturas_venta');
  // Encontrar último lote
  const lotesIds=[...new Set(fvs.filter(f=>f.loteAbonos).map(f=>f.loteAbonos))];
  if(!lotesIds.length){toast('No hay lote de abonos para deshacer','error');return}
  // Buscar el lote más reciente (último creado)
  const facsDeLotes=fvs.filter(f=>f.loteAbonos);
  const ultimoLoteId=facsDeLotes.reduce((prev,curr)=>(curr.fechaCreacion>prev.fechaCreacion?curr:prev)).loteAbonos;
  const facsLote=fvs.filter(f=>f.loteAbonos===ultimoLoteId);
  if(!facsLote.length){toast('No hay facturas en ese lote','error');return}
  // Verificar mes cerrado
  const cfg=await DB.cfg(eid);
  const cierres=cfg.cierres||[];
  const fechaLote=facsLote[0].fecha;
  const mesLote=fechaLote.substring(0,7);
  if(cierres.some(c=>c.mes>=mesLote)){
    toast(`El mes ${mesLote} está cerrado — no se puede deshacer`,'error');return;
  }
  // Verificar que ninguna factura del lote esté cobrada
  const cobradas=facsLote.filter(f=>f.estado==='cobrada'&&f.tipo==='cc');
  if(cobradas.length){
    toast(`${cobradas.length} factura${cobradas.length!==1?'s':''} del lote ya tiene${cobradas.length!==1?'n':''} cobro registrado — eliminá los cobros primero`,'error');return;
  }
  confirm(
    '¿Deshacer generación de abonos?',
    `Se eliminarán ${facsLote.length} factura${facsLote!==1?'s':''} del lote generado el ${fechaLote}. Esta acción no se puede deshacer.`,
    async()=>{
      showLoading('Deshaciendo...');
      for(const f of facsLote){
        await DB.deleteItem(eid,'facturas_venta',f.id);
      }
      DB._clearCache(eid,'facturas_venta');
      hideLoading();
      toast(`${facsLote.length} factura${facsLote.length!==1?'s':''} eliminada${facsLote.length!==1?'s':''}`,'success');
      navTo('facturacion-masiva');
    }
  );
}

    const idx=_fcLineas.findIndex(x=>x.id===id);

  `,[{lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},{lbl:'Confirmar pago',cls:'btn-primary',fn:`savePagoRapido('${facId}')`}]);

async function savePagoRapido(facId){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('op-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('op-fp').value;
  if(!fpId){toast('Seleccioná una forma de pago','error');return}
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  let bancoId='',cajaId='';
  if(fp&&FP_TIPO_BANCO.includes(fp.tipo)){
    bancoId=document.getElementById('op-bk')?.value||'';
    if(!bancoId){toast('Seleccioná el banco para esta forma de pago','error');return}
  }
  if(fp&&FP_TIPO_CAJA.includes(fp.tipo)){
    cajaId=document.getElementById('op-cj')?.value||'';
    if(!cajaId){toast('Seleccioná la caja para esta forma de pago','error');return}
  }
  const _fechaPR=document.getElementById('op-f').value;
  if(await isMesCerrado(_fechaPR)){toast('El período '+_fechaPR.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{OP:1};
  const numero=`OP-${String(nums.OP).padStart(5,'0')}`;nums.OP++;await DB.setCfg(eid,{nums});
  const facs=await DB.getE(eid,'facturas_compra');
  const fac=facs.find(x=>x.id===facId);
  const op={id:genId(),numero,fecha:document.getElementById('op-f').value,
    proveedorId:fac.proveedorId,importe,formaPagoId:fpId,
    ...(bancoId&&{bancoId}),
    ...(cajaId&&{cajaId}),
    facturaIds:[facId],
    observaciones:document.getElementById('op-obs').value.trim(),fechaCreacion:new Date().toISOString()};
  showLoading('Registrando pago...');
  await DB.upsertItem(eid,'ordenes_pago',op);
  await DB.patchItem(eid,'facturas_compra',facId,{estado:'pagada',fechaPago:op.fecha});
  hideLoading();
  closeModal();toast(`Pago registrado · ${numero}`,'success');renderCompras();
}

async function saveCobroDirecto(){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('cd-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('cd-fp').value;
  if(!fpId){toast('Seleccioná una forma de cobro','error');return}
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  let bancoId='',cajaId='';
  if(fp&&FP_TIPO_BANCO.includes(fp.tipo)){
    bancoId=document.getElementById('cd-bk')?.value||'';
    if(!bancoId){toast('Seleccioná el banco para esta forma de cobro','error');return}
  }
  if(fp&&FP_TIPO_CAJA.includes(fp.tipo)){
    cajaId=document.getElementById('cd-cj')?.value||'';
    if(!cajaId){toast('Seleccioná la caja para esta forma de cobro','error');return}
  }
  const _fechaCD=document.getElementById('cd-f').value;
  if(await isMesCerrado(_fechaCD)){toast('El período '+_fechaCD.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const cfg=await DB.cfg(eid);const nums=getNums(cfg);
  const numero='RC-'+String(nums.RC||1).padStart(5,'0');
  nums.RC=(nums.RC||1)+1;
  await DB.setCfg(eid,{...cfg,nums});
  // Comprobantes seleccionados
  var compSelects=document.querySelectorAll('.cd-comp-check:checked');
  var compsAplicados=[];
  compSelects.forEach(function(cb){
    var inp=document.getElementById('cd-comp-imp-'+cb.value);
    var imp=inp?parseFloat(inp.value)||0:0;
    compsAplicados.push({id:cb.value,tipo:cb.dataset.tipo,numero:cb.dataset.num,importeAplicado:imp});
  });
  const rec={id:genId(),numero,fecha:document.getElementById('cd-f').value,
    clienteId:document.getElementById('cd-cl').value||null,
    importe,formaPagoId:fpId,
    ...(bancoId&&{bancoId}),
    ...(cajaId&&{cajaId}),
    facturaIds:compsAplicados.filter(c=>c.tipo==='fv').map(c=>c.id),
    comprobantesAplicados:compsAplicados,
    observaciones:document.getElementById('cd-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  showLoading('Registrando cobro...');
  await DB.upsertItem(eid,'recibos_cobro',rec);
  // Marcar como cobradas las facturas de venta aplicadas solo si el importe cubre el total
  const fvsAll=await DB.getE(eid,'facturas_venta');
  const recsAllUpd=await DB.getE(eid,'recibos_cobro');
  for(const comp of compsAplicados){
    if(comp.tipo==='fv'){
      const fv=fvsAll.find(f=>f.id===comp.id);
      if(fv&&fv.estado!=='cobrada'){
        const totalImputado=recsAllUpd.reduce((s,r)=>(s+(r.comprobantesAplicados||[]).filter(c=>c.id===fv.id).reduce((a,c)=>a+c.importeAplicado,0)),0);
        if(totalImputado>=fv.total-0.001){
          await DB.upsertItem(eid,'facturas_venta',{...fv,estado:'cobrada',fechaCobro:rec.fecha});
        }
      }
    }
  }
  DB._clearCache(eid,'facturas_venta');
  DB._clearCache(eid,'recibos_cobro');
  hideLoading();
  closeModal();toast('Cobro registrado · '+numero,'success');renderTesoreria();
}

async function abrirPagoDirecto(){
