async function renderInformeEconomico(c,filtros){
  const eid=_empresa.id;
  const fv=(await DB.getE(eid,'facturas_venta')).filter(f=>f.fecha>=_infDesde&&f.fecha<=_infHasta);
  const fc=(await DB.getE(eid,'facturas_compra')).filter(f=>f.fecha>=_infDesde&&f.fecha<=_infHasta);
  const clientes=await DB.getE(eid,'clientes');
  const provs=await DB.getE(eid,'proveedores');
  const rubros=await DB.getE(eid,'rubros');

  const totalVentas=fv.reduce((s,f)=>s+f.total,0);
  const totalCobrado=fv.filter(f=>f.estado==='cobrada').reduce((s,f)=>s+f.total,0);
  const totalCompras=fc.reduce((s,f)=>s+f.total,0);
  const resultado=totalVentas-totalCompras;

  const rubroTotals={};
  fc.forEach(f=>(f.lineas||[]).forEach(l=>{if(l.rubro)rubroTotals[l.rubro]=(rubroTotals[l.rubro]||0)+(l.cantidad*l.precio)}));
  if(!Object.keys(rubroTotals).length)fc.forEach(f=>{if(f.rubroId)rubroTotals[f.rubroId]=(rubroTotals[f.rubroId]||0)+f.total});

  c.innerHTML=filtros+`
    <div class="card mb20">
      <h3 class="fw6 mb12" style="font-size:14px">Resultado económico del período</h3>
      <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total Ventas devengadas</span><span style="font-family:var(--mono);font-weight:600;color:var(--text)">${fmtARS(totalVentas)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total Compras y Gastos devengados</span><span style="font-family:var(--mono);font-weight:600;color:var(--text)">${fmtARS(totalCompras)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface2)"><span style="font-size:14px;font-weight:700">RESULTADO BRUTO</span><span style="font-family:var(--mono);font-weight:700;font-size:15px;color:${resultado>=0?'var(--green)':'var(--red)'}">${fmtARS(resultado)}</span></div>
      </div>
    </div>

    <div class="g2" style="gap:20px;align-items:start">
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Ventas del período <span class="badge badge-blue" style="margin-left:8px">${fv.length}</span></h3>
        ${fv.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th class="td-r">Total</th><th>Estado</th></tr></thead>
        <tbody>${fv.map(f=>{const cl=clientes.find(x=>x.id===f.clienteId);return`<tr>
          <td class="td-mono">${esc(f.numero)}</td><td>${esc(f.fecha)}</td>
          <td>${cl?esc(cl.nombre):'—'}</td>
          <td class="td-mono td-r">${fmtARS(f.total)}</td>
          <td><span class="badge ${f.estado==='cobrada'?'badge-green':'badge-yellow'}">${f.estado==='cobrada'?'Cobrada':'Pendiente'}</span></td>
        </tr>`}).join('')}
        <tr><td colspan="3" style="font-weight:700;text-align:right;padding-top:10px">Total cobrado</td><td class="td-mono td-r" style="font-weight:700;color:var(--green)">${fmtARS(totalCobrado)}</td><td></td></tr>
        </tbody></table></div>`
        :`<p class="text-muted" style="font-size:13px">Sin ventas en el período</p>`}
      </div>
      <div>
        <div class="card mb16">
          <h3 class="fw6 mb12" style="font-size:14px">Gastos por rubro</h3>
          ${Object.keys(rubroTotals).length?Object.entries(rubroTotals).sort((a,b)=>b[1]-a[1]).map(([rid,tot])=>{
            const rub=rubros.find(x=>x.id===rid);const pct=totalCompras?Math.round(tot/totalCompras*100):0;
            return`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${rub?esc(rub.nombre):rid}</span><span class="td-mono">${fmtARS(tot)}</span></div>
            <div style="height:4px;background:var(--surface3);border-radius:2px"><div style="height:4px;width:${pct}%;background:var(--accent);border-radius:2px"></div></div></div>`;}).join('')
          :`<p class="text-muted" style="font-size:13px">Sin datos de rubros</p>`}
        </div>
        <div class="card">

async function renderInformeFinanciero(c,filtros){
  const eid=_empresa.id;
  const recCob=await DB.getE(eid,'recibos_cobro');
  const ordPago=await DB.getE(eid,'ordenes_pago');
  const fvCob=(await DB.getE(eid,'facturas_venta')).filter(x=>x.tipo==='contado'&&x.estado==='cobrada');
  const fcPag=(await DB.getE(eid,'facturas_compra')).filter(x=>x.tipo==='contado'&&x.estado==='pagada');
  const fps=await DB.getE(eid,'formas_pago');
  const clientes=await DB.getE(eid,'clientes');
  const provs=await DB.getE(eid,'proveedores');

  const movs=[];
  recCob.filter(r=>r.fecha>=_infDesde&&r.fecha<=_infHasta).forEach(r=>{const cl=clientes.find(x=>x.id===r.clienteId);movs.push({fecha:r.fecha,tipo:'Cobro',desc:'Cobro cliente'+(cl?' · '+cl.nombre:''),numero:r.numero,importe:r.importe,dir:'in',fpId:r.formaPagoId});});
  fvCob.filter(f=>f.fecha>=_infDesde&&f.fecha<=_infHasta).forEach(f=>{const cl=clientes.find(x=>x.id===f.clienteId);movs.push({fecha:f.fecha,tipo:'Cobro',desc:'Venta contado'+(cl?' · '+cl.nombre:''),numero:f.numero,importe:f.total,dir:'in',fpId:f.formaPagoId});});
  ordPago.filter(o=>o.fecha>=_infDesde&&o.fecha<=_infHasta).forEach(o=>{const pv=provs.find(x=>x.id===o.proveedorId);movs.push({fecha:o.fecha,tipo:'Pago',desc:'Pago proveedor'+(pv?' · '+pv.nombre:''),numero:o.numero,importe:o.importe,dir:'out',fpId:o.formaPagoId});});
  fcPag.filter(f=>f.fecha>=_infDesde&&f.fecha<=_infHasta).forEach(f=>{const pv=provs.find(x=>x.id===f.proveedorId);movs.push({fecha:f.fecha,tipo:'Pago',desc:'Compra contado'+(pv?' · '+pv.nombre:''),numero:f.numero,importe:f.total,dir:'out',fpId:f.formaPagoId});});
  movs.sort((a,b)=>a.fecha>b.fecha?-1:1);

  const totalIn=movs.filter(m=>m.dir==='in').reduce((s,m)=>s+m.importe,0);
  const totalOut=movs.filter(m=>m.dir==='out').reduce((s,m)=>s+m.importe,0);
  const resultado=totalIn-totalOut;

  // Agrupado por forma de pago
  const porFP={};
  movs.forEach(m=>{const k=m.fpId||'_';if(!porFP[k]){porFP[k]={in:0,out:0};}if(m.dir==='in')porFP[k].in+=m.importe;else porFP[k].out+=m.importe;});

  // Agrupado por mes
  const porMes={};
  movs.forEach(m=>{const mes=m.fecha.slice(0,7);if(!porMes[mes]){porMes[mes]={in:0,out:0};}if(m.dir==='in')porMes[mes].in+=m.importe;else porMes[mes].out+=m.importe;});

  var movRows=movs.map(function(m){
    var fp=fps.find(x=>x.id===m.fpId);
    return '<tr>'
      +'<td>'+esc(m.fecha)+'</td>'
      +'<td>'+esc(m.desc)+'</td>'
      +'<td class="td-mono">'+esc(m.numero)+'</td>'
      +'<td>'+(fp?esc(fp.nombre):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--green)">'+(m.dir==='in'?fmtARS(m.importe):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--red)">'+(m.dir==='out'?fmtARS(m.importe):'—')+'</td>'
      +'</tr>';
  }).join('');

  c.innerHTML=filtros+`
    <div class="card mb20">
      <h3 class="fw6 mb12" style="font-size:14px">Resultado financiero del período</h3>
      <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total cobranzas</span><span style="font-family:var(--mono);font-weight:600;color:var(--green)">${fmtARS(totalIn)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total pagos</span><span style="font-family:var(--mono);font-weight:600;color:var(--red)">${fmtARS(totalOut)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface2)"><span style="font-size:14px;font-weight:700">RESULTADO DE CAJA</span><span style="font-family:var(--mono);font-weight:700;font-size:15px;color:${resultado>=0?'var(--green)':'var(--red)'}">${fmtARS(resultado)}</span></div>
      </div>
    </div>

    <div class="g2 mb20" style="gap:20px;align-items:start">
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Por forma de pago</h3>
        <div class="tw"><table><thead><tr><th>Forma de pago</th><th class="td-r">Ingresos</th><th class="td-r">Egresos</th><th class="td-r">Neto</th></tr></thead><tbody>
        ${Object.entries(porFP).map(function(entry){
          var kid=entry[0];var v=entry[1];
          var fp=fps.find(x=>x.id===kid);
          var neto=v.in-v.out;
          return '<tr>'
            +'<td>'+(fp?esc(fp.nombre):'Sin forma de pago')+'</td>'
            +'<td class="td-mono td-r" style="color:var(--green)">'+fmtARS(v.in)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--red)">'+fmtARS(v.out)+'</td>'
            +'<td class="td-mono td-r" style="font-weight:600;color:'+(neto>=0?'var(--green)':'var(--red)')+'">'+fmtARS(neto)+'</td>'
            +'</tr>';
        }).join('')}
        </tbody></table></div>
      </div>
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Por mes</h3>
        <div class="tw"><table><thead><tr><th>Mes</th><th class="td-r">Ingresos</th><th class="td-r">Egresos</th><th class="td-r">Neto</th></tr></thead><tbody>
        ${Object.entries(porMes).sort().map(function(entry){
          var mes=entry[0];var v=entry[1];
          var neto=v.in-v.out;
          return '<tr>'
            +'<td class="td-mono">'+esc(mes)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--green)">'+fmtARS(v.in)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--red)">'+fmtARS(v.out)+'</td>'
            +'<td class="td-mono td-r" style="font-weight:600;color:'+(neto>=0?'var(--green)':'var(--red)')+'">'+fmtARS(neto)+'</td>'
            +'</tr>';
        }).join('')}
        </tbody></table></div>
      </div>
    </div>

    <div class="card">
      <h3 class="fw6 mb12" style="font-size:14px">Detalle de movimientos <span class="badge badge-blue" style="margin-left:8px">${movs.length}</span></h3>
      ${movs.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>N°</th><th>Forma pago</th><th class="td-r">Ingreso</th><th class="td-r">Egreso</th></tr></thead>
      <tbody>${movRows}</tbody></table></div>`
      :`<p class="text-muted" style="font-size:13px">Sin movimientos en el período</p>`}
    </div>`;
}

var _ccQ='';
async function renderCCClientes(){
  const eid=_empresa.id;
  const clientes=(await DB.getE(eid,'clientes')).filter(x=>x.activo);
  const fvsAll=await DB.getE(eid,'facturas_venta');
  const recsAll=await DB.getE(eid,'recibos_cobro');
  var ncsAll=[];try{ncsAll=(await DB.getE(eid,'notas_credito')).filter(x=>x.tipo==='venta');}catch(e){}

  // Calcular saldo por cliente
  var clientesCC=clientes.filter(function(cl){
    var tieneMovs=fvsAll.some(f=>f.clienteId===cl.id&&f.tipo==='cc')
      ||recsAll.some(r=>r.clienteId===cl.id);
    return cl.condicionCobro==='cc'||tieneMovs;
  });
  if(_ccQ){
    var q=_ccQ.toLowerCase();
    clientesCC=clientesCC.filter(x=>x.nombre.toLowerCase().includes(q)||(x.cuit||'').includes(q));
  }

  var rows=clientesCC.map(function(cl){
    var fvs=fvsAll.filter(f=>f.clienteId===cl.id&&f.tipo==='cc');
    var recs=recsAll.filter(r=>r.clienteId===cl.id);
    var ncs=ncsAll.filter(n=>n.clienteId===cl.id);
    var debito=fvs.reduce(function(s,f){return s+f.total;},0);
    var credito=recs.reduce(function(s,r){return s+r.importe;},0)+ncs.reduce(function(s,n){return s+n.importe;},0);
    var saldo=debito-credito;
    var saldoCls=saldo>0?'color:var(--red)':saldo<0?'color:var(--green)':'color:var(--text2)';
    var cid=cl.id;
    return '<tr>'
      +'<td><strong>'+esc(cl.nombre)+'</strong>'+(cl.cuit?'<br><span style="font-size:11px;color:var(--text2)">'+esc(cl.cuit)+'</span>':'')+'</td>'
      +'<td class="td-mono">'+fmtARS(debito)+'</td>'
      +'<td class="td-mono">'+fmtARS(credito)+'</td>'
      +'<td class="td-mono fw6" style="'+saldoCls+'">'+fmtARS(saldo)+'</td>'
      +'<td><div class="td-act">'
      +'<button class="btn btn-secondary btn-sm" onclick="verCCCliente('+JSON.stringify(cid)+')">Ver cuenta</button>'
      +'<button class="btn btn-ghost btn-sm btn-icon" onclick="abrirNotaCreditoCliente('+JSON.stringify(cid)+')" title="Nota de crédito">📝</button>'
      +'</div></td>'
      +'</tr>';
  }).join('');

  var totalSaldo=clientesCC.reduce(function(s,cl){
    var fvs=fvsAll.filter(f=>f.clienteId===cl.id&&f.tipo==='cc');
    var recs=recsAll.filter(r=>r.clienteId===cl.id);
    var ncs=ncsAll.filter(n=>n.clienteId===cl.id);
    var d=fvs.reduce(function(a,f){return a+f.total;},0);
    var cr=recs.reduce(function(a,r){return a+r.importe;},0)+ncs.reduce(function(a,n){return a+n.importe;},0);
    return s+(d-cr);
  },0);

  document.getElementById('main-content').innerHTML=`
    <div class="g3 mb20">
      <div class="stat-card"><div class="stat-lbl">Clientes en CC</div><div class="stat-val" style="color:var(--accent)">${clientesCC.length}</div></div>
      <div class="stat-card"><div class="stat-lbl">Saldo total a cobrar</div><div class="stat-val" style="color:${totalSaldo>=0?'var(--red)':'var(--green)'}">${fmtARS(Math.abs(totalSaldo))}</div></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-l"><div class="sw"><span class="si">🔍</span><input value="${esc(_ccQ)}" placeholder="Buscar cliente..." oninput="_ccQ=this.value;renderCCClientes()" style="width:240px;padding-left:32px"></div></div>
    </div>
    ${clientesCC.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th class="td-r">Débito</th><th class="td-r">Crédito</th><th class="td-r">Saldo</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`
    :`<div class="empty"><div class="ei">📒</div><h3>Sin cuentas corrientes</h3><p>Los clientes con condición CC aparecerán aquí</p></div>`}`;
}

async function verCCCliente(clienteId){
  const eid=_empresa.id;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===clienteId);if(!cl)return;
  const fvs=(await DB.getE(eid,'facturas_venta')).filter(f=>f.clienteId===clienteId&&f.tipo==='cc');
  const recs=(await DB.getE(eid,'recibos_cobro')).filter(r=>r.clienteId===clienteId);
  var ncs=[];try{ncs=(await DB.getE(eid,'notas_credito')).filter(n=>n.clienteId===clienteId&&n.tipo==='venta');}catch(e){}
  const movs=[
    ...fvs.map(f=>({fecha:f.fecha,tipo:'Factura',numero:f.numero,debito:f.total,credito:0})),
    ...recs.map(r=>({fecha:r.fecha,tipo:'Recibo',numero:r.numero,debito:0,credito:r.importe})),
    ...ncs.map(n=>({fecha:n.fecha,tipo:'Nota crédito',numero:n.numero,debito:0,credito:n.importe})),
  ].sort((a,b)=>a.fecha>b.fecha?1:-1);
  let saldo=0;
  const rows=movs.map(m=>{saldo+=m.debito-m.credito;return Object.assign({},m,{saldo:saldo});});
  var cid=clienteId;
  openModal('CC · '+esc(cl.nombre),`
    <div style="text-align:right;margin-bottom:12px">
      <button class="btn btn-secondary btn-sm" onclick="closeModal();abrirNotaCreditoCliente(${JSON.stringify(cid)})">📝 Nota de crédito</button>
    </div>
    <div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>N°</th><th class="td-r">Débito</th><th class="td-r">Crédito</th><th class="td-r">Saldo</th></tr></thead>
    <tbody>`+rows.map(function(r){
      return '<tr>'
        +'<td>'+esc(r.fecha)+'</td><td>'+esc(r.tipo)+'</td><td class="td-mono">'+esc(r.numero)+'</td>'
        +'<td class="td-mono td-r" style="color:var(--red)">'+(r.debito?fmtARS(r.debito):'—')+'</td>'
        +'<td class="td-mono td-r" style="color:var(--green)">'+(r.credito?fmtARS(r.credito):'—')+'</td>'
        +'<td class="td-mono td-r" style="font-weight:600;color:'+(r.saldo>0?'var(--red)':r.saldo<0?'var(--green)':'var(--text)')+'">'+fmtARS(r.saldo)+'</td>'
        +'</tr>';
    }).join('')+`
    </tbody></table></div>
    <div style="text-align:right;margin-top:12px;font-size:14px;font-weight:600">Saldo actual: <span style="font-family:var(--mono);color:${saldo>0?'var(--red)':saldo<0?'var(--green)':'var(--text)'}">${fmtARS(saldo)}</span></div>
  `,[{lbl:'Cerrar',cls:'btn-secondary',fn:'closeModal()'},{lbl:'🖨️ Imprimir CC',cls:'btn-secondary',fn:'closeModal();imprimirComprobante(\'cc\',\''+clienteId+'\')'}],true);
}

async function saveNotaCreditoCliente(){
  const eid=_empresa.id;
  const clId=document.getElementById('nc-cl').value;
  if(!clId){toast('Seleccioná un cliente','error');return}
  const importe=parseFloat(document.getElementById('nc-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}

  if(!desc){toast('El concepto es obligatorio','error');return}
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{NCV:1};
  if(!nums.NCV)nums.NCV=1;
  const numero='NCV-'+String(nums.NCV).padStart(5,'0');nums.NCV++;
  await DB.setCfg(eid,{nums});
  const nc={id:genId(),numero,tipo:'venta',fecha:document.getElementById('nc-f').value,
    clienteId:clId,facturaId:document.getElementById('nc-fac').value||null,
    importe,descripcion:desc,
    observaciones:document.getElementById('nc-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  showLoading('Emitiendo nota de crédito...');
  await DB.upsertItem(eid,'notas_credito',nc);

  closeModal();toast('Nota de crédito emitida · '+numero,'success');
  if(_section==='cc-clientes')renderCCClientes();
  else if(_section==='ventas')renderVentas();
}

async function toggleItem(key,id,cb,isUsers){
  const eid=_empresa.id;
  const tbl=isUsers?'usuarios':key;
  const items=await DB.getE(eid,tbl);
  const item=items.find(x=>x.id===id);
  if(!item)return;
  const nuevoActivo=!item.activo;
  await DB.patchItem(eid,tbl,id,{activo:nuevoActivo});
  DB._clearCache(eid,tbl);
  if(typeof cb==='function')await cb();
}
async function delItem(key,id,cb){
  confirm('¿Eliminar registro?','Esta acción no se puede deshacer.',async()=>{
    const eid=_empresa.id;
    await DB.deleteItem(eid,key,id);
    toast('Eliminado','success');
    if(typeof cb==='function')await cb();
  });
}

function _logoHtml(h){
  if(!_empresa||!_empresa.logo)return '';
  return '<img src="'+_empresa.logo+'" style="height:'+h+'px;max-width:160px;object-fit:contain">';
}
function _empresaHeader(){
  var logoH=_empresa&&_empresa.logo?'<img src="'+_empresa.logo+'" style="height:90px;max-width:260px;object-fit:contain;display:block;margin-bottom:6px">':'';
  var nombre=_empresa?esc(_empresa.nombre||''):'';
  var cuit=_empresa&&_empresa.cuit?'CUIT: '+esc(_empresa.cuit):'';
  var dir=_empresa&&_empresa.direccion?esc(_empresa.direccion):'';
  var tel=_empresa&&_empresa.telefono?'Tel: '+esc(_empresa.telefono):'';
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #334155">'
    +'<div>'+logoH+'<div style="font-size:15px;font-weight:700;color:#1e293b">'+nombre+'</div>'
    +(cuit?'<div style="font-size:12px;color:#64748b">'+cuit+'</div>':'')
    +(dir?'<div style="font-size:12px;color:#64748b">'+dir+'</div>':'')
    +(tel?'<div style="font-size:12px;color:#64748b">'+tel+'</div>':'')
    +'</div></div>';
}

async function imprimirComprobante(tipo,id){
  const eid=_empresa.id;
  var html='';
  if(tipo==='fv'){
    const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===id);if(!fac)return;
    const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===fac.clienteId);
    html='<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">FACTURA DE VENTA · '+esc(fac.numero)+'</h2>'
      +_empresaHeader()
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr>'
      +'<td style="padding:4px 0;font-size:12px;color:#64748b;width:120px">Cliente</td><td style="font-size:13px;font-weight:600">'+esc(cl?cl.nombre:'—')+(cl&&cl.cuit?'<span style="font-weight:400;color:#64748b"> · CUIT: '+esc(cl.cuit)+'</span>':'')+'</td></tr>'
      +(cl&&cl.direccion?'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Dirección</td><td style="font-size:12px">'+esc(cl.direccion)+'</td></tr>':'')
      +'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Fecha</td><td style="font-size:12px">'+esc(fac.fecha)+'</td></tr>'
      +(fac.vencimiento?'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Vencimiento</td><td style="font-size:12px">'+esc(fac.vencimiento)+'</td></tr>':'')
      +'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Tipo</td><td style="font-size:12px">'+(fac.tipo==='cc'?'Cuenta Corriente':'Contado')+'</td></tr></table>'
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><thead><tr style="background:#f1f5f9">'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Descripción</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:60px">Cant.</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:110px">Precio</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:110px">Subtotal</th>'
      +'</tr></thead><tbody>'
      +(fac.lineas||[]).map(function(l){return '<tr><td style="padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(l.desc)+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+l.cantidad+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+fmtARS(l.precio)+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0"><strong>'+fmtARS(l.cantidad*l.precio)+'</strong></td></tr>';}).join('')
      +'</tbody></table>'
      +'<div style="text-align:right;font-size:16px;font-weight:700;color:#1e293b;padding-top:8px;border-top:2px solid #334155">TOTAL: '+fmtARS(fac.total)+'</div>'
      +(fac.observaciones?'<p style="font-size:11px;color:#64748b;margin-top:14px">'+esc(fac.observaciones)+'</p>':'');
  } else if(tipo==='fc'){
    const fac=(await DB.getE(eid,'facturas_compra')).find(x=>x.id===id);if(!fac)return;
    const pv=(await DB.getE(eid,'proveedores')).find(x=>x.id===fac.proveedorId);
    html='<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">FACTURA DE COMPRA · '+esc(fac.numero)+'</h2>'
      +_empresaHeader()
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr>'
      +'<td style="padding:4px 0;font-size:12px;color:#64748b;width:120px">Proveedor</td><td style="font-size:13px;font-weight:600">'+esc(pv?pv.nombre:'—')+'</td></tr>'
      +'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Fecha</td><td style="font-size:12px">'+esc(fac.fecha)+'</td></tr>'
      +(fac.nFP?'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">N° Proveedor</td><td style="font-size:12px">'+esc(fac.nFP)+'</td></tr>':'')
      +'</table>'
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><thead><tr style="background:#f1f5f9">'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Descripción</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:60px">Cant.</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:110px">Precio</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1;width:110px">Subtotal</th>'
      +'</tr></thead><tbody>'
      +(fac.lineas||[]).map(function(l){return '<tr><td style="padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(l.desc)+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+l.cantidad+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+fmtARS(l.precio)+'</td>'
        +'<td style="text-align:right;padding:6px 8px;font-size:12px;border-bottom:1px solid #e2e8f0"><strong>'+fmtARS(l.cantidad*l.precio)+'</strong></td></tr>';}).join('')
      +'</tbody></table>'
      +'<div style="text-align:right;font-size:16px;font-weight:700;color:#1e293b;padding-top:8px;border-top:2px solid #334155">TOTAL: '+fmtARS(fac.total)+'</div>';
  } else if(tipo==='nc'){
    const nc=(await DB.getE(eid,'notas_credito')).find(x=>x.id===id);if(!nc)return;
    const cl=nc.clienteId?(await DB.getE(eid,'clientes')).find(x=>x.id===nc.clienteId):null;
    const pv=nc.proveedorId?(await DB.getE(eid,'proveedores')).find(x=>x.id===nc.proveedorId):null;
    html='<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">NOTA DE CRÉDITO · '+esc(nc.numero)+'</h2>'
      +_empresaHeader()
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px">'
      +(cl?'<tr><td style="padding:4px 0;font-size:12px;color:#64748b;width:120px">Cliente</td><td style="font-size:13px;font-weight:600">'+esc(cl.nombre)+'</td></tr>':'')
      +(pv?'<tr><td style="padding:4px 0;font-size:12px;color:#64748b;width:120px">Proveedor</td><td style="font-size:13px;font-weight:600">'+esc(pv.nombre)+'</td></tr>':'')
      +'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Fecha</td><td style="font-size:12px">'+esc(nc.fecha)+'</td></tr>'
      +'<tr><td style="font-size:12px;color:#64748b;padding:4px 0">Concepto</td><td style="font-size:12px">'+esc(nc.descripcion||'')+'</td></tr>'
      +'</table>'
      +'<div style="text-align:right;font-size:16px;font-weight:700;color:#16a34a;padding-top:8px;border-top:2px solid #334155">IMPORTE NC: '+fmtARS(nc.importe)+'</div>'
      +(nc.observaciones?'<p style="font-size:11px;color:#64748b;margin-top:14px">'+esc(nc.observaciones)+'</p>':'');
  } else if(tipo==='cc'){
    // CC cliente completa — id es clienteId
    const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===id);if(!cl)return;
    const fvs=(await DB.getE(eid,'facturas_venta')).filter(f=>f.clienteId===id&&f.tipo==='cc');
    const recs=(await DB.getE(eid,'recibos_cobro')).filter(r=>r.clienteId===id);
    var ncsCC=[];try{ncsCC=(await DB.getE(eid,'notas_credito')).filter(n=>n.clienteId===id&&n.tipo==='venta');}catch(e){}
    const movs=[
      ...fvs.map(f=>({fecha:f.fecha,tipo:'Factura',numero:f.numero,debito:f.total,credito:0})),
      ...recs.map(r=>({fecha:r.fecha,tipo:'Recibo',numero:r.numero,debito:0,credito:r.importe})),
      ...ncsCC.map(n=>({fecha:n.fecha,tipo:'Nota Crédito',numero:n.numero,debito:0,credito:n.importe})),
    ].sort((a,b)=>a.fecha>b.fecha?1:-1);
    var saldo=0;
    var rowsCC=movs.map(function(m){saldo+=m.debito-m.credito;
      return '<tr><td style="padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(m.fecha)+'</td>'
        +'<td style="padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(m.tipo)+'</td>'
        +'<td style="font-family:monospace;padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(m.numero)+'</td>'
        +'<td style="text-align:right;font-family:monospace;padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0;color:#dc2626">'+(m.debito?fmtARS(m.debito):'—')+'</td>'
        +'<td style="text-align:right;font-family:monospace;padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0;color:#16a34a">'+(m.credito?fmtARS(m.credito):'—')+'</td>'
        +'<td style="text-align:right;font-family:monospace;font-weight:600;padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0;color:'+(saldo>0?'#dc2626':saldo<0?'#16a34a':'#334155')+'">'+fmtARS(saldo)+'</td>'
        +'</tr>';
    }).join('');
    html='<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">CUENTA CORRIENTE · '+esc(cl.nombre)+'</h2>'
      +_empresaHeader()
      +'<p style="font-size:12px;color:#64748b;margin-bottom:14px">Emitido: '+today()+'</p>'
      +'<table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f1f5f9">'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Fecha</th>'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Tipo</th>'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">N°</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Débito</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Crédito</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Saldo</th>'
      +'</tr></thead><tbody>'+rowsCC+'</tbody></table>'
      +'<div style="text-align:right;font-size:15px;font-weight:700;margin-top:12px;padding-top:8px;border-top:2px solid #334155;color:'+(saldo>0?'#dc2626':saldo<0?'#16a34a':'#334155')+'">Saldo: '+fmtARS(saldo)+'</div>';
  }
  if(!html)return;
  abrirVentanaImpresion(html);
}

function abrirVentanaImpresion(contenidoHtml){
  var w=window.open('','_blank','width=800,height=900');
  if(!w){toast('Habilitá las ventanas emergentes para imprimir','error');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Imprimir</title>'
    +'<style>body{font-family:Arial,sans-serif;margin:0;padding:28px 36px;color:#1e293b;background:#fff}'
    +'@media print{body{padding:0}@page{margin:1.5cm}}</style></head>'
    +'<body>'+contenidoHtml
    +'<div style="margin-top:40px;text-align:center">'
    +'<button onclick="window.print()" style="background:#2563eb;color:#fff;border:none;padding:10px 28px;border-radius:6px;font-size:14px;cursor:pointer;margin-right:10px">🖨️ Imprimir / Guardar PDF</button>'
    +'<button onclick="window.close()" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer">Cerrar</button>'
    +'</div></body></html>');
  w.document.close();
}

async function imprimirInforme(){
  const eid=_empresa.id;
  const desde=_infDesde||'';
  const hasta=_infHasta||'';
  var html='';

  if(_infTab==='financiero'){
    const recCob=await DB.getE(eid,'recibos_cobro');
    const ordPago=await DB.getE(eid,'ordenes_pago');
    const fvCob=(await DB.getE(eid,'facturas_venta')).filter(x=>x.tipo==='contado'&&x.estado==='cobrada');
    const fcPag=(await DB.getE(eid,'facturas_compra')).filter(x=>x.tipo==='contado'&&x.estado==='pagada');
    const fps=await DB.getE(eid,'formas_pago');
    const clientes=await DB.getE(eid,'clientes');
    const provs=await DB.getE(eid,'proveedores');
    const movs=[];
    recCob.filter(r=>r.fecha>=desde&&r.fecha<=hasta).forEach(r=>{const cl=clientes.find(x=>x.id===r.clienteId);movs.push({fecha:r.fecha,tipo:'Cobro',desc:'Cobro cliente'+(cl?' · '+cl.nombre:''),numero:r.numero,importe:r.importe,dir:'in',fpId:r.formaPagoId});});
    fvCob.filter(f=>f.fecha>=desde&&f.fecha<=hasta).forEach(f=>{const cl=clientes.find(x=>x.id===f.clienteId);movs.push({fecha:f.fecha,tipo:'Cobro',desc:'Venta contado'+(cl?' · '+cl.nombre:''),numero:f.numero,importe:f.total,dir:'in',fpId:f.formaPagoId});});
    ordPago.filter(o=>o.fecha>=desde&&o.fecha<=hasta).forEach(o=>{const pv=provs.find(x=>x.id===o.proveedorId);movs.push({fecha:o.fecha,tipo:'Pago',desc:'Pago proveedor'+(pv?' · '+pv.nombre:''),numero:o.numero,importe:o.importe,dir:'out',fpId:o.formaPagoId});});
    fcPag.filter(f=>f.fecha>=desde&&f.fecha<=hasta).forEach(f=>{const pv=provs.find(x=>x.id===f.proveedorId);movs.push({fecha:f.fecha,tipo:'Pago',desc:'Compra contado'+(pv?' · '+pv.nombre:''),numero:f.numero,importe:f.total,dir:'out',fpId:f.formaPagoId});});
    movs.sort((a,b)=>a.fecha>b.fecha?-1:1);
    const totalIn=movs.filter(m=>m.dir==='in').reduce((s,m)=>s+m.importe,0);
    const totalOut=movs.filter(m=>m.dir==='out').reduce((s,m)=>s+m.importe,0);
    const resultado=totalIn-totalOut;
    html=_empresaHeader()
      +'<h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Informe Financiero</h2>'
      +'<p style="font-size:12px;color:#64748b;margin-bottom:18px">Período: '+esc(desde)+' al '+esc(hasta)+'</p>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px">'
      +'<tr style="background:#f1f5f9"><td style="padding:8px 10px;border:1px solid #e2e8f0">Total cobranzas</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600;color:#16a34a">'+fmtARS(totalIn)+'</td></tr>'
      +'<tr><td style="padding:8px 10px;border:1px solid #e2e8f0">Total pagos</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600;color:#dc2626">'+fmtARS(totalOut)+'</td></tr>'
      +'<tr style="background:#f8fafc"><td style="padding:10px;border:1px solid #e2e8f0;font-weight:700">RESULTADO DE CAJA</td><td style="padding:10px;border:1px solid #e2e8f0;text-align:right;font-weight:700;font-size:14px;color:'+(resultado>=0?'#16a34a':'#dc2626')+'">'+fmtARS(resultado)+'</td></tr>'
      +'</table>'
      +'<h3 style="font-size:13px;font-weight:700;margin-bottom:8px">Detalle de movimientos</h3>'
      +'<table style="width:100%;border-collapse:collapse;font-size:11px">'
      +'<thead><tr style="background:#f1f5f9"><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:left">Fecha</th><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:left">Descripción</th><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:left">N°</th><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:left">F.Pago</th><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:right">Ingreso</th><th style="padding:6px 8px;border:1px solid #e2e8f0;text-align:right">Egreso</th></tr></thead>'
      +'<tbody>'+movs.map(function(m){var fp=fps.find(x=>x.id===m.fpId);return '<tr><td style="padding:5px 8px;border:1px solid #e2e8f0">'+esc(m.fecha)+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0">'+esc(m.desc)+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0;font-family:monospace">'+esc(m.numero)+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0">'+(fp?esc(fp.nombre):'—')+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0;text-align:right;color:#16a34a">'+(m.dir==='in'?fmtARS(m.importe):'—')+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0;text-align:right;color:#dc2626">'+(m.dir==='out'?fmtARS(m.importe):'—')+'</td></tr>';}).join('')
      +'</tbody></table>';
  } else {
    // economico
    const fv=(await DB.getE(eid,'facturas_venta')).filter(f=>f.fecha>=desde&&f.fecha<=hasta);
    const fc=(await DB.getE(eid,'facturas_compra')).filter(f=>f.fecha>=desde&&f.fecha<=hasta);
    const clientes=await DB.getE(eid,'clientes');
    const provs=await DB.getE(eid,'proveedores');
    const totalVentas=fv.reduce((s,f)=>s+f.total,0);
    const totalCompras=fc.reduce((s,f)=>s+f.total,0);
    const resultado=totalVentas-totalCompras;
    html=_empresaHeader()
      +'<h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Informe Económico</h2>'
      +'<p style="font-size:12px;color:#64748b;margin-bottom:18px">Período: '+esc(desde)+' al '+esc(hasta)+'</p>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px">'
      +'<tr style="background:#f1f5f9"><td style="padding:8px 10px;border:1px solid #e2e8f0">Total ventas devengadas</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600">'+fmtARS(totalVentas)+'</td></tr>'
      +'<tr><td style="padding:8px 10px;border:1px solid #e2e8f0">Total compras y gastos devengados</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600">'+fmtARS(totalCompras)+'</td></tr>'
      +'<tr style="background:#f8fafc"><td style="padding:10px;border:1px solid #e2e8f0;font-weight:700">RESULTADO BRUTO</td><td style="padding:10px;border:1px solid #e2e8f0;text-align:right;font-weight:700;font-size:14px;color:'+(resultado>=0?'#16a34a':'#dc2626')+'">'+fmtARS(resultado)+'</td></tr>'
      +'</table>'
      +'<div style="display:flex;gap:24px;margin-bottom:20px">'
      +'<div style="flex:1"><h3 style="font-size:13px;font-weight:700;margin-bottom:8px">Ventas del período ('+fv.length+')</h3>'

async function exportBackup(){
  if(!_empresa){toast('Sin empresa activa','error');return}
  showLoading('Generando backup...');
  const eid=_empresa.id;
  const tables=['clientes','proveedores','productos_venta','productos_compra','rubros',
    'formas_pago','bancos','usuarios','facturas_venta','recibos_cobro','facturas_compra','ordenes_pago'];
  const data={empresa:_empresa};
  for(const tbl of tables){
    data[tbl]=await DB.getE(eid,tbl);
  }
  data.cfg=await DB.cfg(eid);
  hideLoading();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`backup_${_empresa.nombre.replace(/\s+/g,'_')}_${today()}.json`;
  a.click();toast('Backup descargado','success');
}
async function importBackup(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      confirm('¿Importar backup?','Esto restaurará todos los datos desde el archivo.',async()=>{
        showLoading('Importando datos...');
        const eid=_empresa.id;
        const tables=['clientes','proveedores','productos_venta','productos_compra','rubros',
          'formas_pago','bancos','usuarios','facturas_venta','recibos_cobro','facturas_compra','ordenes_pago'];
        for(const tbl of tables){
          if(data[tbl]) await DB.setE(eid,tbl,data[tbl]);
        }
        if(data.cfg) await DB.setCfg(eid,data.cfg);
        hideLoading();
        toast('Backup importado correctamente','success');
        await navTo(_section);
      });
    }catch{toast('Archivo inválido','error')}
  };
  reader.readAsText(file);input.value='';
}

// ── Convierte un item de DB a fila Excel (resuelve rubroNombre) ──
function itemToRow(item, cols, rubros) {
  const row = {};
  cols.forEach(col => {
    if (col.k === 'rubroNombre') {
      const rub = rubros.find(r => r.id === item.rubroId);
      row[col.h] = rub ? rub.nombre : '';
    } else if (col.k === 'activo') {
      row[col.h] = item.activo === false ? 'NO' : 'SI';
    } else {
      row[col.h] = item[col.k] !== undefined ? item[col.k] : (col.def !== undefined ? col.def : '');
    }
  });
  return row;
}

// ── Exportar planilla de un maestro ──
async function exportarExcelMaestro(maestroKey) {
  if (!XLSX) { toast('SheetJS no disponible', 'error'); return; }
  const def = MAESTROS[maestroKey];
  if (!def) return;
  const eid = _empresa.id;
  const items = await DB.getE(eid, def.dbKey);
  const rubros = await DB.getE(eid, 'rubros');

  // Hoja de datos
  const dataRows = items.length
    ? items.map(it => itemToRow(it, def.cols, rubros))
    : [Object.fromEntries(def.cols.map(c => [c.h, c.def !== undefined ? c.def : '']))];

  const wsData = XLSX.utils.json_to_sheet(dataRows, { header: def.cols.map(c => c.h) });

  // Estilos básicos de cabecera (ancho de columnas)
  const colWidths = def.cols.map(c => ({ wch: Math.max(c.h.length + 2, 18) }));
  wsData['!cols'] = colWidths;

  // Hoja de instrucciones
  const instrRows = [
    { A: `INSTRUCCIONES — ${def.label}` },
    { A: '' },
    { A: '• Esta planilla tiene el formato de importación para el sistema.' },
    { A: '• Podés editar las filas existentes o agregar nuevas al final.' },
    { A: '• Al importar, los registros nuevos se AGREGAN (no reemplazan la base).' },
    { A: `• Si un registro ya existe (mismo "${def.idField}"), el sistema te preguntará qué hacer.` },
    { A: '• Columnas marcadas con * son obligatorias.' },
    { A: '• No modifiques los encabezados de la primera fila.' },
    { A: '' },
    { A: 'Campos requeridos (*):', },
    ...def.cols.filter(c => c.req).map(c => ({ A: `  → ${c.h} *` })),
  ];
  const wsInstr = XLSX.utils.json_to_sheet(instrRows, { header: ['A'], skipHeader: true });
  wsInstr['!cols'] = [{ wch: 70 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsData, def.label);
  XLSX.utils.book_append_sheet(wb, wsInstr, 'Instrucciones');

  XLSX.writeFile(wb, `${def.label.replace(/ /g, '_')}_${_empresa.nombre.replace(/ /g, '_')}.xlsx`);
  toast(`Planilla "${def.label}" descargada`, 'success');
}

// ── Importar planilla: parsear y mostrar modal de confirmación ──
async function importarExcelMaestro(input, maestroKey) {
  const file = input.files[0];
  if (!file) return;
  const def = MAESTROS[maestroKey];
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      // Buscar la hoja del maestro (primera que no sea "Instrucciones")
      const sheetName = wb.SheetNames.find(n => n !== 'Instrucciones') || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!rows.length) { toast('La planilla está vacía', 'error'); return; }

      // Validar que tenga columnas correctas
      const firstRow = rows[0];
      const missingRequired = def.cols.filter(c => c.req && !(c.h in firstRow));
      if (missingRequired.length) {
        toast(`Faltan columnas: ${missingRequired.map(c => c.h).join(', ')}`, 'error');
        return;
      }

      // Procesar cada fila → objeto normalizado
      const eid = _empresa.id;
      const rubros = await DB.getE(eid, 'rubros');
      const existing = await DB.getE(eid, def.dbKey);

      const parsed = rows.map((row, i) => {
        const obj = { id: genId(), activo: true };
        def.cols.forEach(col => {
          const val = row[col.h];
          if (col.k === 'rubroNombre') {
            const rub = rubros.find(r => r.nombre.toLowerCase() === String(val || '').toLowerCase());
            obj.rubroId = rub ? rub.id : '';
          } else if (col.k === 'activo') {
            obj.activo = String(val || '').toUpperCase() !== 'NO';
          } else if (col.k === 'precio' || col.k === 'saldoInicial' || col.k === 'diasVenc') {
            obj[col.k] = parseFloat(val) || (col.def || 0);
          } else {
            obj[col.k] = val !== '' ? val : (col.def !== undefined ? col.def : '');
          }
        });
        obj._rowNum = i + 2; // fila Excel (1=header, 2=primera data)
        return obj;
      }).filter(obj => {
        // Filtrar filas completamente vacías
        const idVal = obj[def.idField];
        return idVal && String(idVal).trim() !== '';
      });

      if (!parsed.length) { toast('No se encontraron filas con datos válidos', 'error'); return; }

      // Clasificar: nuevos vs duplicados
      const idField = def.idField;
      const nuevos = [];
      const duplicados = [];

      parsed.forEach(obj => {
        const idVal = String(obj[idField] || '').toLowerCase().trim();
        const match = existing.find(ex => String(ex[idField] || '').toLowerCase().trim() === idVal);
        if (match) {
          duplicados.push({ nuevo: obj, existente: match });
        } else {
          nuevos.push(obj);
        }
      });

      // Mostrar modal de revisión
      mostrarModalImportacion(def, nuevos, duplicados, eid);

    } catch (err) {
      console.error(err);
      toast('Error al leer el archivo Excel', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  input.value = '';
}

// ── Modal de revisión de importación ──
let _importPendingDups = []; // duplicados con decisión pendiente
let _importNuevos = [];
let _importDef = null;
let _importEid = null;

function mostrarModalImportacion(def, nuevos, duplicados, eid) {
  _importDef = def;
  _importNuevos = nuevos;
  _importEid = eid;
  _importPendingDups = duplicados.map((d, i) => ({ ...d, idx: i, accion: 'omitir' }));

  const totalFilas = nuevos.length + duplicados.length;

  let dupHTML = '';
  if (duplicados.length) {
    dupHTML = `
      <div style="margin-top:16px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--yellow)">
          ⚠️ ${duplicados.length} registro${duplicados.length !== 1 ? 's' : ''} ya exist${duplicados.length !== 1 ? 'en' : 'e'} en la base
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
          Elegí qué hacer con cada uno:
        </div>
        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)">
          <table style="width:100%;border-collapse:collapse">
            <thead><tr style="background:var(--surface2)">
              <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Registro</th>
              <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Fila Excel</th>
              <th style="padding:8px 12px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Acción</th>
            </tr></thead>
            <tbody>
              ${_importPendingDups.map(d => `
                <tr style="border-bottom:1px solid var(--border)" id="dup-row-${d.idx}">
                  <td style="padding:9px 12px;font-size:13px"><strong>${esc(String(d.nuevo[def.idField] || ''))}</strong></td>
                  <td style="padding:9px 12px;font-size:12px;color:var(--text2)">Fila ${d.nuevo._rowNum}</td>
                  <td style="padding:9px 12px">
                    <select onchange="setDupAccion(${d.idx},this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--surface);color:var(--text);outline:none">
                      <option value="omitir" selected>Omitir (mantener existente)</option>
                      <option value="reemplazar">Reemplazar con nueva versión</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-secondary btn-sm" onclick="setTodasAccion('omitir')">Omitir todos</button>
          <button class="btn btn-secondary btn-sm" onclick="setTodasAccion('reemplazar')">Reemplazar todos</button>
        </div>
      </div>`;
  }

  openModal(`Importar ${def.label}`,`
    <div>
      <div class="g3" style="margin-bottom:16px">
        <div class="stat-card">
          <div class="stat-lbl">Total en planilla</div>
          <div class="stat-val" style="color:var(--accent);font-size:20px">${totalFilas}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Registros nuevos</div>
          <div class="stat-val" style="color:var(--green);font-size:20px">${nuevos.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Ya existentes</div>
          <div class="stat-val" style="color:var(--yellow);font-size:20px">${duplicados.length}</div>
        </div>
      </div>
      ${nuevos.length ? `<div style="font-size:13px;color:var(--green);margin-bottom:8px">✓ ${nuevos.length} registro${nuevos.length !== 1 ? 's' : ''} nuevo${nuevos.length !== 1 ? 's' : ''} listo${nuevos.length !== 1 ? 's' : ''} para agregar</div>` : ''}
      ${dupHTML}
    </div>
  `,[
    { lbl: 'Cancelar', cls: 'btn-secondary', fn: 'closeModal()' },
    { lbl: 'Confirmar importación', cls: 'btn-primary', fn: 'ejecutarImportacion()' },
  ], true);
}

function setDupAccion(idx, accion) {
  const d = _importPendingDups.find(x => x.idx === idx);
  if (d) d.accion = accion;
}

function setTodasAccion(accion) {
  _importPendingDups.forEach(d => {
    d.accion = accion;
    const sel = document.querySelector(`#dup-row-${d.idx} select`);
    if (sel) sel.value = accion;
  });
}

async function ejecutarImportacion() {
  const def = _importDef;
  const eid = _importEid;
  let agregados = 0;
  let reemplazados = 0;
  let omitidos = 0;

  showLoading('Importando registros...');
  closeModal();

  // Agregar nuevos
  for (const obj of _importNuevos) {
    delete obj._rowNum;
    await DB.upsertItem(eid, def.dbKey, obj);
    agregados++;
  }

  // Procesar duplicados según decisión
  for (const d of _importPendingDups) {
    delete d.nuevo._rowNum;
    if (d.accion === 'reemplazar') {
      d.nuevo.id = d.existente.id;
      await DB.upsertItem(eid, def.dbKey, d.nuevo);
      reemplazados++;
    } else {
      omitidos++;
    }
  }

  hideLoading();

  const parts = [];
  if (agregados) parts.push(`${agregados} agregado${agregados !== 1 ? 's' : ''}`);
  if (reemplazados) parts.push(`${reemplazados} reemplazado${reemplazados !== 1 ? 's' : ''}`);
  if (omitidos) parts.push(`${omitidos} omitido${omitidos !== 1 ? 's' : ''}`);
  toast(`Importación completada: ${parts.join(' · ')}`, 'success');

  await navTo(_section);
}
