async function savePagoDirecto(){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('pd-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('pd-fp').value;
  if(!fpId){toast('Seleccioná una forma de pago','error');return}
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  let bancoId='',cajaId='';
  if(fp&&FP_TIPO_BANCO.includes(fp.tipo)){
    bancoId=document.getElementById('pd-bk')?.value||'';
    if(!bancoId){toast('Seleccioná el banco para esta forma de pago','error');return}
  }
  if(fp&&FP_TIPO_CAJA.includes(fp.tipo)){
    cajaId=document.getElementById('pd-cj')?.value||'';
    if(!cajaId){toast('Seleccioná la caja para esta forma de pago','error');return}
  }
  const _fechaPD=document.getElementById('pd-f').value;
  if(await isMesCerrado(_fechaPD)){toast('El período '+_fechaPD.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{OP:1};
  if(!nums.OP)nums.OP=1;
  const numero='OP-'+String(nums.OP).padStart(5,'0');nums.OP++;
  await DB.setCfg(eid,{nums});
  var pdCompSelects=document.querySelectorAll('.pd-comp-check:checked');
  var pdCompsAplicados=[];
  pdCompSelects.forEach(function(cb){
    var inp=document.getElementById('pd-comp-imp-'+cb.value);
    var imp=inp?parseFloat(inp.value)||0:0;
    pdCompsAplicados.push({id:cb.value,tipo:cb.dataset.tipo,numero:cb.dataset.num,importeAplicado:imp});
  });
  const op={id:genId(),numero,fecha:document.getElementById('pd-f').value,
    proveedorId:document.getElementById('pd-pv').value||null,
    importe,formaPagoId:fpId,
    ...(bancoId&&{bancoId}),
    ...(cajaId&&{cajaId}),
    facturaIds:pdCompsAplicados.filter(c=>c.tipo==='fc').map(c=>c.id),
    comprobantesAplicados:pdCompsAplicados,
    observaciones:document.getElementById('pd-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  showLoading('Registrando pago...');
  await DB.upsertItem(eid,'ordenes_pago',op);
  // Marcar como pagadas las facturas de compra aplicadas
  const fcsAll=await DB.getE(eid,'facturas_compra');
  for(const comp of pdCompsAplicados){
    if(comp.tipo==='fc'){
      const fc=fcsAll.find(f=>f.id===comp.id);
      if(fc&&fc.estado!=='pagada'){
        await DB.upsertItem(eid,'facturas_compra',{...fc,estado:'pagada',fechaPago:op.fecha});
      }
    }
  }
  DB._clearCache(eid,'facturas_compra');
  DB._clearCache(eid,'ordenes_pago');
  hideLoading();
  closeModal();toast('Pago registrado · '+numero,'success');renderTesoreria();
}

async function recalcularEstados(){
  const eid=_empresa.id;
  showLoading('Recalculando estados de facturas...');
  try{
    // Cargar todos los datos necesarios
    DB._clearCache(eid,'facturas_venta');
    DB._clearCache(eid,'facturas_compra');
    DB._clearCache(eid,'recibos_cobro');
    DB._clearCache(eid,'ordenes_pago');
    const [fvsAll,fcsAll,recibos,ordenes]=await Promise.all([
      DB.getE(eid,'facturas_venta'),
      DB.getE(eid,'facturas_compra'),
      DB.getE(eid,'recibos_cobro'),
      DB.getE(eid,'ordenes_pago')
    ]);
    let updFV=0,updFC=0;
    // Recalcular estado de cada FV en base al total realmente imputado
    for(const fv of fvsAll){
      let nuevoEstado,fechaCobro=fv.fechaCobro||null;
      if(fv.tipo==='contado'){
        // Contado siempre cobrada
        nuevoEstado='cobrada';
        if(!fechaCobro)fechaCobro=fv.fecha;
      } else {
        // CC: sumar todo lo imputado en comprobantesAplicados de todos los recibos
        const totalImputado=recibos.reduce(function(s,r){
          return s+(r.comprobantesAplicados||[]).filter(function(c){return c.id===fv.id;}).reduce(function(a,c){return a+(parseFloat(c.importeAplicado)||0);},0);
        },0);
        if(totalImputado>=fv.total-0.001){
          nuevoEstado='cobrada';
          // fecha del último recibo que la cubre
          const recsCubre=recibos.filter(r=>(r.comprobantesAplicados||[]).some(c=>c.id===fv.id));
          fechaCobro=recsCubre.length?recsCubre[recsCubre.length-1].fecha:fv.fecha;
        } else {
          nuevoEstado='pendiente';
          fechaCobro=null;
        }
      }
      if(fv.estado!==nuevoEstado||fv.fechaCobro!==fechaCobro){
        await DB.upsertItem(eid,'facturas_venta',{...fv,estado:nuevoEstado,fechaCobro});
        updFV++;
      }
    }
    // Marcar facturas compra pagadas: cualquier FC cuyo id aparezca en alguna orden de pago
    const fcPagadasIds=new Set();
    const fcFechaMap={};
    for(const o of ordenes){
      const ids=o.facturaIds||[];
      const comps=o.comprobantesAplicados||[];
      for(const fid of ids){ fcPagadasIds.add(fid); if(!fcFechaMap[fid])fcFechaMap[fid]=o.fecha; }
      for(const c of comps){ if(c.tipo==='fc'){ fcPagadasIds.add(c.id); if(!fcFechaMap[c.id])fcFechaMap[c.id]=o.fecha; } }
    }
    // También facturas compra contado
    for(const fc of fcsAll){
      if(fc.tipo==='contado'&&fc.estado!=='pagada'){
        fcPagadasIds.add(fc.id);
        if(!fcFechaMap[fc.id])fcFechaMap[fc.id]=fc.fecha;
      }
    }
    for(const fc of fcsAll){
      if(fcPagadasIds.has(fc.id)&&fc.estado!=='pagada'){
        await DB.upsertItem(eid,'facturas_compra',{...fc,estado:'pagada',fechaPago:fcFechaMap[fc.id]||fc.fecha});
        updFC++;
      }
    }
    DB._clearCache(eid,'facturas_venta');
    DB._clearCache(eid,'facturas_compra');
    hideLoading();
    toast(`Estados actualizados: ${updFV} facturas de venta cobradas, ${updFC} facturas de compra pagadas`,'success');
    renderDashboard();
  }catch(e){
    hideLoading();
    toast('Error al recalcular estados: '+e.message,'error');
  }
}

function eliminarMovTesoreria(tabla,id){
  confirm('¿Eliminar movimiento?','Esta acción no se puede deshacer.',async function(){
    const eid=_empresa.id;
    const _existingElim=(await DB.getE(eid,tabla)).find(x=>x.id===id);
    const _fechaElim=_existingElim?(_existingElim.fecha||''):'';
    if(_fechaElim&&await isMesCerrado(_fechaElim)){toast('El período '+_fechaElim.slice(0,7)+' está cerrado. No se pueden eliminar operaciones.','error');return}
    if(tabla==='facturas_venta'){
      const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===id);
      if(fac){await DB.upsertItem(eid,'facturas_venta',Object.assign({},fac,{estado:'pendiente',fechaCobro:null}));}
    } else if(tabla==='facturas_compra'){
      const fac=(await DB.getE(eid,'facturas_compra')).find(x=>x.id===id);
      if(fac){await DB.upsertItem(eid,'facturas_compra',Object.assign({},fac,{estado:'pendiente',fechaPago:null}));}
    } else if(tabla==='recibos_cobro'){
      // Al eliminar un cobro, revertir las facturas vinculadas a pendiente
      const rec=_existingElim;
      if(rec&&rec.facturaIds&&rec.facturaIds.length){
        const fvs=await DB.getE(eid,'facturas_venta');
        const idSet=new Set(rec.facturaIds);
        const toRevert=fvs.filter(f=>idSet.has(f.id));
        for(const f of toRevert){await DB.upsertItem(eid,'facturas_venta',Object.assign({},f,{estado:'pendiente',fechaCobro:null}));}
        DB._clearCache(eid,'facturas_venta');
      }
      await DB.deleteItem(eid,tabla,id);
    } else if(tabla==='ordenes_pago'){
      // Al eliminar un pago, revertir las facturas de compra vinculadas a pendiente
      const op=_existingElim;
      if(op&&op.facturaIds&&op.facturaIds.length){
        const fcs=await DB.getE(eid,'facturas_compra');
        const idSet=new Set(op.facturaIds);
        const toRevert=fcs.filter(f=>idSet.has(f.id));
        for(const f of toRevert){await DB.upsertItem(eid,'facturas_compra',Object.assign({},f,{estado:'pendiente',fechaPago:null}));}
        DB._clearCache(eid,'facturas_compra');
      }
      await DB.deleteItem(eid,tabla,id);
    } else {
      await DB.deleteItem(eid,tabla,id);
    }
    toast('Movimiento eliminado','success');
    renderTesoreria();
  });
}

function renderCompAplList(){
  var list=document.getElementById('comp-apl-list');
  if(!list)return;
  var comps=window._editCompsApl||[];
  if(!comps.length){list.innerHTML='<div style="color:#888;font-size:13px;margin-top:4px;">Sin imputaciones registradas</div>';actualizarResumenApl();return;}
  var html='<div style="margin-top:4px;">';
  comps.forEach(function(c,i){
    var label=c.tipo==='fv'?'FV':'NC';
    html+='<div class="comp-apl-row" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
      +'<span style="flex:1;font-size:13px;">'+esc(label+' '+c.numero)+'</span>'
      +'<input type="number" step="0.01" min="0" class="comp-apl-imp" data-idx="'+i+'" value="'+c.importeAplicado+'" style="width:110px;" oninput="syncCompImp('+i+',this.value);actualizarResumenApl()">'
      +'<button onclick="quitarCompApl('+i+')" style="background:#e74c3c;color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:13px;">✕</button>'
      +'</div>';
  });
  html+='</div>';
  list.innerHTML=html;
  actualizarResumenApl();
}
function syncCompImp(idx,val){
  if(window._editCompsApl&&window._editCompsApl[idx]!==undefined){
    window._editCompsApl[idx].importeAplicado=parseFloat(val)||0;
  }
}
function quitarCompApl(idx){
  if(!window._editCompsApl)return;
  window._editCompsApl.splice(idx,1);
  // Refresh add-factura select to show removed factura again
  var fvsAll=window._editFvsAll||[];
  var clienteId=window._editClienteId;
  var comps=window._editCompsApl;
  var fvsDisp=fvsAll.filter(function(f){return f.clienteId===clienteId&&f.tipo==='cc'&&(f.estado!=='cobrada'||comps.some(function(c){return c.id===f.id;}));});
  var fvDispOpts=fvsDisp.filter(function(f){return !comps.some(function(c){return c.id===f.id;});})
    .map(function(f){return '<option value="'+f.id+'">'+esc('FV '+f.numero+' — $'+f.total.toLocaleString('es-AR'))+'</option>';}).join('');
  var sel=document.getElementById('em-fv-add');
  if(sel){sel.innerHTML='<option value="">+ Agregar factura...</option>'+fvDispOpts;}
  renderCompAplList();
}
function agregarCompApl(){
  var sel=document.getElementById('em-fv-add');
  if(!sel||!sel.value)return;
  var fvId=sel.value;
  var fvsAll=window._editFvsAll||[];
  var fv=fvsAll.find(function(f){return f.id===fvId;});
  if(!fv)return;
  var comps=window._editCompsApl||[];
  if(comps.some(function(c){return c.id===fvId;}))return;
  // Calculate remaining on factura (total - already applied by other recibos)
  // Default to full total for new addition
  comps.push({id:fv.id,tipo:'fv',numero:fv.numero,importeAplicado:fv.total});
  window._editCompsApl=comps;
  // Remove from select
  var opt=sel.querySelector('option[value="'+fvId+'"]');
  if(opt)opt.remove();
  sel.value='';
  renderCompAplList();
}
function actualizarResumenApl(){
  var res=document.getElementById('comp-apl-resumen');
  if(!res)return;
  var comps=window._editCompsApl||[];
  var totalApl=comps.reduce(function(s,c){return s+(parseFloat(c.importeAplicado)||0);},0);
  var importe=parseFloat((document.getElementById('em-imp')||{}).value)||0;
  var diff=importe-totalApl;
  var color=Math.abs(diff)<0.01?'#27ae60':(diff>0?'#e67e22':'#e74c3c');
  var msg=Math.abs(diff)<0.01?'✓ Imputación completa':(diff>0?'⚠ Quedan $'+diff.toLocaleString('es-AR',{minimumFractionDigits:2})+' sin imputar':'⚠ Imputado $'+Math.abs(diff).toLocaleString('es-AR',{minimumFractionDigits:2})+' más que el importe');
  res.innerHTML='<span style="color:'+color+'">'+msg+'</span>';
}

  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('em-fp').value;
  if(!fpId){toast('Seleccioná una forma de pago','error');return}
  if(await isMesCerrado(fecha)){toast('El período '+fecha.slice(0,7)+' está cerrado. No se pueden registrar ni modificar operaciones.','error');return}
  const fps=await DB.getE(eid,'formas_pago');
  const fp=fps.find(x=>x.id===fpId);
  let bancoId='',cajaId='';
  if(fp&&FP_TIPO_BANCO.includes(fp.tipo)){bancoId=document.getElementById('em-bk')?.value||'';}
  if(fp&&FP_TIPO_CAJA.includes(fp.tipo)){cajaId=document.getElementById('em-cj')?.value||'';}
  const existing=(await DB.getE(eid,tabla)).find(x=>x.id===id);
  if(!existing){toast('Registro no encontrado','error');return}
  // Sync any pending input changes to _editCompsApl
  if(tabla==='recibos_cobro'&&window._editCompsApl){
    document.querySelectorAll('.comp-apl-imp').forEach(function(inp){
      var idx=parseInt(inp.dataset.idx);
      if(!isNaN(idx)&&window._editCompsApl[idx]){
        window._editCompsApl[idx].importeAplicado=parseFloat(inp.value)||0;
      }
    });
  }
  const updated=Object.assign({},existing,{
    fecha,importe,formaPagoId:fpId,
    bancoId:bancoId||null,cajaId:cajaId||null,
    observaciones:document.getElementById('em-obs').value.trim(),
    ...(tabla==='recibos_cobro'&&{
      clienteId:document.getElementById('em-cl')?.value||null,
      comprobantesAplicados:window._editCompsApl||existing.comprobantesAplicados||[],
    }),
    ...(tabla==='ordenes_pago'&&{proveedorId:document.getElementById('em-pv')?.value||null}),
  });
  showLoading('Guardando...');
  await DB.upsertItem(eid,tabla,updated);
  DB._clearCache(eid,tabla);
  DB._clearCache(eid,'facturas_venta');
  // Recalculate factura estados after recibo edit
  if(tabla==='recibos_cobro'){
    const todosRecibos=await DB.getE(eid,'recibos_cobro'); // fresh after clearCache
    const fvsAll=await DB.getE(eid,'facturas_venta'); // fresh after clearCache
    // Collect all FV ids referenced across all recibos
    const fvIdsAfectados=new Set();
    (updated.comprobantesAplicados||[]).forEach(function(c){if(c.tipo==='fv')fvIdsAfectados.add(c.id);});
    (existing.comprobantesAplicados||[]).forEach(function(c){if(c.tipo==='fv')fvIdsAfectados.add(c.id);});
    for(const fvId of fvIdsAfectados){
      const fv=fvsAll.find(function(f){return f.id===fvId;});
      if(!fv)continue;
      const totalImputado=todosRecibos.reduce(function(s,r){
        // Use updated recibo data for the one we just saved
        var comps=(r.id===id?(updated.comprobantesAplicados||[]):(r.comprobantesAplicados||[]));
        return s+comps.filter(function(c){return c.id===fvId;}).reduce(function(a,c){return a+(parseFloat(c.importeAplicado)||0);},0);
      },0);
      const nuevoEstado=totalImputado>=fv.total-0.001?'cobrada':'pendiente';
      // Siempre actualizar para corregir estados incorrectos históricos
      await DB.upsertItem(eid,'facturas_venta',Object.assign({},fv,{estado:nuevoEstado,fechaCobro:nuevoEstado==='cobrada'?fecha:null}));
      DB._clearCache(eid,'facturas_venta');
    }
  }
  hideLoading();
  closeModal();toast('Movimiento actualizado','success');renderTesoreria();
}

  pagosSueldo.filter(p=>p.fecha>=_infDesde&&p.fecha<=_infHasta).forEach(p=>{const emp=empsF.find(e=>e.id===p.empleadoId);movs.push({fecha:p.fecha,tipo:'Pago sueldo',desc:'Pago sueldo'+(emp?' · '+emp.nombre:''),numero:p.numero,importe:p.importe,dir:'out',fpId:p.formaPagoId});});
  movs.sort((a,b)=>a.fecha>b.fecha?-1:1);

  const totalIn=movs.filter(m=>m.dir==='in').reduce((s,m)=>s+m.importe,0);
  const totalOut=movs.filter(m=>m.dir==='out').reduce((s,m)=>s+m.importe,0);
  const resultado=totalIn-totalOut;

  // Agrupado por forma de pago
  const porFP={};
  movs.forEach(m=>{const k=m.fpId||'_';if(!porFP[k]){porFP[k]={in:0,out:0};}if(m.dir==='in')porFP[k].in+=m.importe;else porFP[k].out+=m.importe;});

  // Agrupado por mes
  const porMes={};
  movs.forEach(m=>{const mes=m.fecha.slice(0,7);if(!porMes[mes]){porMes[mes]={in:0,out:0};}if(m.dir==='in')porMes[mes].in+=m.importe;else porMes[mes].out+=m.importe;});

  var movRows=movs.map(function(m){
    var fp=fps.find(x=>x.id===m.fpId);
    return '<tr>'
      +'<td>'+esc(m.fecha)+'</td>'
      +'<td>'+esc(m.desc)+'</td>'
      +'<td class="td-mono">'+esc(m.numero)+'</td>'
      +'<td>'+(fp?esc(fp.nombre):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--green)">'+(m.dir==='in'?fmtARS(m.importe):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--red)">'+(m.dir==='out'?fmtARS(m.importe):'—')+'</td>'
      +'</tr>';
  }).join('');

  c.innerHTML=filtros+`
    <div class="card mb20">
      <h3 class="fw6 mb12" style="font-size:14px">Resultado financiero del período</h3>
      <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total cobranzas</span><span style="font-family:var(--mono);font-weight:600;color:var(--green)">${fmtARS(totalIn)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><span style="font-size:13px">Total pagos</span><span style="font-family:var(--mono);font-weight:600;color:var(--red)">${fmtARS(totalOut)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface2)"><span style="font-size:14px;font-weight:700">RESULTADO DE CAJA</span><span style="font-family:var(--mono);font-weight:700;font-size:15px;color:${resultado>=0?'var(--green)':'var(--red)'}">${fmtARS(resultado)}</span></div>
      </div>
    </div>

    <div class="g2 mb20" style="gap:20px;align-items:start">
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Por forma de pago</h3>
        <div class="tw"><table><thead><tr><th>Forma de pago</th><th class="td-r">Ingresos</th><th class="td-r">Egresos</th><th class="td-r">Neto</th></tr></thead><tbody>
        ${Object.entries(porFP).map(function(entry){
          var kid=entry[0];var v=entry[1];
          var fp=fps.find(x=>x.id===kid);
          var neto=v.in-v.out;
          return '<tr>'
            +'<td>'+(fp?esc(fp.nombre):'Sin forma de pago')+'</td>'
            +'<td class="td-mono td-r" style="color:var(--green)">'+fmtARS(v.in)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--red)">'+fmtARS(v.out)+'</td>'
            +'<td class="td-mono td-r" style="font-weight:600;color:'+(neto>=0?'var(--green)':'var(--red)')+'">'+fmtARS(neto)+'</td>'
            +'</tr>';
        }).join('')}
        </tbody></table></div>
      </div>
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Por mes</h3>
        <div class="tw"><table><thead><tr><th>Mes</th><th class="td-r">Ingresos</th><th class="td-r">Egresos</th><th class="td-r">Neto</th></tr></thead><tbody>
        ${Object.entries(porMes).sort().map(function(entry){
          var mes=entry[0];var v=entry[1];
          var neto=v.in-v.out;
          return '<tr>'
            +'<td class="td-mono">'+esc(mes)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--green)">'+fmtARS(v.in)+'</td>'
            +'<td class="td-mono td-r" style="color:var(--red)">'+fmtARS(v.out)+'</td>'
            +'<td class="td-mono td-r" style="font-weight:600;color:'+(neto>=0?'var(--green)':'var(--red)')+'">'+fmtARS(neto)+'</td>'
            +'</tr>';
        }).join('')}
        </tbody></table></div>
      </div>
    </div>

    <div class="card">
      <h3 class="fw6 mb12" style="font-size:14px">Detalle de movimientos <span class="badge badge-blue" style="margin-left:8px">${movs.length}</span></h3>
      ${movs.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>N°</th><th>Forma pago</th><th class="td-r">Ingreso</th><th class="td-r">Egreso</th></tr></thead>

}

// ═══════════════════════════════════════════════════════════
// MÓDULO CUENTAS CORRIENTES CLIENTES
// ═══════════════════════════════════════════════════════════
var _ccQ='';
var _ccDesde='',_ccHasta='';
var _ccSoloDeudor=false,_ccSoloAcreedor=false,_ccOcultarSinSaldo=false,_ccOcultarSinMovs=false,_ccSoloSinAplicar=false;
async function renderCCClientes(){
  const _fSnap=_captureFocus();
  const eid=_empresa.id;
  const clientes=(await DB.getE(eid,'clientes')).filter(x=>x.activo);
  const fvsAll=await DB.getE(eid,'facturas_venta');
  const recsAll=await DB.getE(eid,'recibos_cobro');
  var ncsAll=[];try{ncsAll=(await DB.getE(eid,'notas_credito')).filter(x=>x.tipo==='venta');}catch(e){}

  // Calcular datos por cliente
  var clientesCC=clientes.filter(function(cl){
    var tieneMovs=fvsAll.some(f=>f.clienteId===cl.id&&f.tipo==='cc')
      ||recsAll.some(r=>r.clienteId===cl.id);
    return cl.condicionCobro==='cc'||tieneMovs;
  });
  if(_ccQ){
    var q=_ccQ.toLowerCase();
    clientesCC=clientesCC.filter(x=>x.nombre.toLowerCase().includes(q)||(x.cuit||'').includes(q));
  }

  const _hoy=today();
  // Calcular saldos (con filtro de fechas si hay)
  function calcCC(cl){
    var fvs=fvsAll.filter(f=>f.clienteId===cl.id&&f.tipo==='cc');
    var recs=recsAll.filter(r=>r.clienteId===cl.id);
    var ncs=ncsAll.filter(n=>n.clienteId===cl.id);
    // saldo previo
    var saldoPrevio=0;
    if(_ccDesde){
      fvs.filter(f=>f.fecha<_ccDesde).forEach(f=>{saldoPrevio+=f.total;});
      recs.filter(r=>r.fecha<_ccDesde).forEach(r=>{saldoPrevio-=r.importe;});
      ncs.filter(n=>n.fecha<_ccDesde).forEach(n=>{saldoPrevio-=n.importe;});
    }
    // en período
    var fvsP=_ccDesde?fvs.filter(f=>f.fecha>=_ccDesde):fvs;
    var recsP=_ccDesde?recs.filter(r=>r.fecha>=_ccDesde):recs;
    var ncsP=_ccDesde?ncs.filter(n=>n.fecha>=_ccDesde):ncs;
    if(_ccHasta){fvsP=fvsP.filter(f=>f.fecha<=_ccHasta);recsP=recsP.filter(r=>r.fecha<=_ccHasta);ncsP=ncsP.filter(n=>n.fecha<=_ccHasta);}
    var debito=fvsP.reduce((s,f)=>s+f.total,0);
    var credito=recsP.reduce((s,r)=>s+r.importe,0)+ncsP.reduce((s,n)=>s+n.importe,0);
    var saldo=saldoPrevio+debito-credito;
    var tieneMovs=(fvs.length+recs.length+ncs.length)>0;
    // Calcular vencido vs no vencido sobre facturas pendientes (sin filtro de fechas para saldo real)
    function fechaVencFV(f){
      if(f.fechaVenc)return f.fechaVenc;
      var dias=(cl.diasVenc)||30;
      if(!f.fecha)return _hoy;
      var d=new Date(f.fecha);d.setDate(d.getDate()+dias);
      return d.toISOString().slice(0,10);
    }
    // Desglose vencido/no vencido usando saldo real por factura (independiente del estado guardado)
    var fvsFiltradas=fvs.slice();
    if(_ccDesde)fvsFiltradas=fvsFiltradas.filter(f=>f.fecha>=_ccDesde);
    if(_ccHasta)fvsFiltradas=fvsFiltradas.filter(f=>f.fecha<=_ccHasta);
    var saldoVencido=0,saldoNoVencido=0;
    fvsFiltradas.forEach(function(f){
      var yaImputado=recs.reduce(function(s,r){return s+(r.comprobantesAplicados||[]).filter(function(c){return c.id===f.id;}).reduce(function(a,c){return a+(parseFloat(c.importeAplicado)||0);},0);},0);
      var saldoFv=Math.max(0,f.total-yaImputado);
      if(saldoFv<0.001)return;
      if(fechaVencFV(f)<_hoy)saldoVencido+=saldoFv;
      else saldoNoVencido+=saldoFv;
    });
    // Recibos con saldo sin aplicar (importe cobrado > lo efectivamente imputado a facturas)
    var saldoSinAplicar=recs.reduce(function(s,r){
      var aplicado=(r.comprobantesAplicados||[]).reduce(function(a,c){return a+c.importeAplicado;},0);
      return s+Math.max(0,r.importe-aplicado);
    },0);
    return {saldoPrevio,debito,credito,saldo,tieneMovs,saldoVencido,saldoNoVencido,saldoSinAplicar};
  }

  // Aplicar filtros de checkbox
  var clientesFilt=clientesCC.filter(function(cl){
    var d=calcCC(cl);
    if(_ccOcultarSinMovs&&!d.tieneMovs)return false;
    if(_ccOcultarSinSaldo&&Math.abs(d.saldo)<0.001)return false;
    if(_ccSoloDeudor&&d.saldo<=0)return false;
    if(_ccSoloAcreedor&&d.saldo>=0)return false;
    if(_ccSoloSinAplicar&&d.saldoSinAplicar<0.001)return false;
    return true;
  });

  var rows=clientesFilt.map(function(cl){
    var d=calcCC(cl);
    var saldoCls=d.saldo>0?'color:var(--red)':d.saldo<0?'color:var(--green)':'color:var(--text2)';
    var cid=cl.id;
    var vencHtml=d.saldoVencido>0
      ?'<br><span style="font-size:10px;color:var(--red);font-weight:600">⚠ Venc: '+fmtARS(d.saldoVencido)+'</span>'
        +(d.saldoNoVencido>0?'<br><span style="font-size:10px;color:var(--text2)">A vencer: '+fmtARS(d.saldoNoVencido)+'</span>':'')
      :(d.saldoNoVencido>0?'<br><span style="font-size:10px;color:var(--text2)">A vencer: '+fmtARS(d.saldoNoVencido)+'</span>':'');
    return '<tr>'
      +'<td><strong>'+esc(cl.nombre)+'</strong>'+(cl.cuit?'<br><span style="font-size:11px;color:var(--text2)">'+esc(cl.cuit)+'</span>':'')+'</td>'
      +(_ccDesde?'<td class="td-mono" style="font-size:12px;color:var(--text2)">'+fmtARS(d.saldoPrevio)+'</td>':'')
      +'<td class="td-mono">'+fmtARS(d.debito)+'</td>'
      +'<td class="td-mono">'+fmtARS(d.credito)+'</td>'
      +'<td class="td-mono fw6" style="'+saldoCls+'">'+fmtARS(d.saldo)+vencHtml+'</td>'
      +'<td><div class="td-act">'
      +'<button class="btn btn-secondary btn-sm" onclick="verCCCliente(\''+cid+'\',\''+(_ccDesde||'')+'\',\''+(_ccHasta||'')+'\')">Ver cuenta</button>'
      +'<button class="btn btn-ghost btn-sm btn-icon" onclick="abrirNotaCreditoCliente(\''+cid+'\')" title="Nota de crédito">📝</button>'
      +'</div></td>'
      +'</tr>';
  }).join('');

  var totalSaldo=clientesFilt.reduce(function(s,cl){return s+calcCC(cl).saldo;},0);
  var totalDeb=clientesFilt.reduce(function(s,cl){return s+calcCC(cl).debito;},0);
  var totalCred=clientesFilt.reduce(function(s,cl){return s+calcCC(cl).credito;},0);
  var totalVencido=clientesFilt.reduce(function(s,cl){return s+calcCC(cl).saldoVencido;},0);
  var totalNoVencido=clientesFilt.reduce(function(s,cl){return s+calcCC(cl).saldoNoVencido;},0);

  var theadPrevio=_ccDesde?'<th class="td-r">Saldo previo</th>':'';
  var theadRow='<tr><th>Cliente</th>'+theadPrevio+'<th class="td-r">Débito</th><th class="td-r">Crédito</th><th class="td-r">Saldo · Vencimiento</th><th></th></tr>';

  document.getElementById('main-content').innerHTML=`
    <div class="g4 mb20" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
      <div class="stat-card"><div class="stat-lbl">Clientes</div><div class="stat-val" style="color:var(--accent)">${clientesFilt.length}</div></div>
      <div class="stat-card"><div class="stat-lbl">Total débito</div><div class="stat-val" style="color:var(--red);font-size:16px">${fmtARS(totalDeb)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Total crédito</div><div class="stat-val" style="color:var(--green);font-size:16px">${fmtARS(totalCred)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Saldo total</div><div class="stat-val" style="color:${totalSaldo>=0?'var(--red)':'var(--green)'};font-size:16px">${fmtARS(Math.abs(totalSaldo))}</div></div>
      ${totalVencido>0?`<div class="stat-card" style="border-color:var(--red-bd);background:var(--red-bg)"><div class="stat-lbl" style="color:var(--red)">⚠ Vencido</div><div class="stat-val" style="color:var(--red);font-size:16px">${fmtARS(totalVencido)}</div></div>`:''}
      ${totalNoVencido>0?`<div class="stat-card"><div class="stat-lbl" style="color:var(--text2)">Por vencer</div><div class="stat-val" style="color:var(--yellow);font-size:16px">${fmtARS(totalNoVencido)}</div></div>`:''}
    </div>
    <div class="card mb16">
      <div class="flex-c gap8 flex-wrap">
        <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Desde</label><input type="date" value="${_ccDesde}" onchange="_ccDesde=this.value;renderCCClientes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
        <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Hasta</label><input type="date" value="${_ccHasta}" onchange="_ccHasta=this.value;renderCCClientes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
        <div class="fg" style="margin:0;flex:1;min-width:180px;align-self:flex-end"><div class="sw" style="position:relative"><span class="si" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3)">🔍</span><input value="${esc(_ccQ)}" placeholder="Buscar cliente..." oninput="_ccQ=this.value;renderCCClientes()" style="width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font);background:var(--surface)"></div></div>
        <div class="fg" style="margin:0;flex:0 0 auto;align-self:flex-end"><button class="btn btn-ghost btn-sm" onclick="_ccDesde='';_ccHasta='';_ccQ='';renderCCClientes()">↺ Limpiar</button></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${_ccSoloDeudor?'checked':''} onchange="_ccSoloDeudor=this.checked;if(_ccSoloDeudor)_ccSoloAcreedor=false;renderCCClientes()"> Solo saldo deudor (deben)</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${_ccSoloAcreedor?'checked':''} onchange="_ccSoloAcreedor=this.checked;if(_ccSoloAcreedor)_ccSoloDeudor=false;renderCCClientes()"> Solo saldo acreedor (a favor)</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${_ccOcultarSinSaldo?'checked':''} onchange="_ccOcultarSinSaldo=this.checked;renderCCClientes()"> Ocultar sin saldo</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${_ccOcultarSinMovs?'checked':''} onchange="_ccOcultarSinMovs=this.checked;renderCCClientes()"> Ocultar sin movimientos</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${_ccSoloSinAplicar?'checked':''} onchange="_ccSoloSinAplicar=this.checked;renderCCClientes()"> Solo con recibos sin imputar</label>
      </div>
    </div>
    <div class="toolbar mb12" style="padding:0">
      <div style="flex:1;font-size:14px;font-weight:600">Cuentas corrientes${_ccDesde||_ccHasta?' · período filtrado':''}</div>
      <button class="btn btn-secondary btn-sm" onclick="exportarExcelCCGlobal()">⬇ Excel</button>
    </div>
    ${clientesFilt.length?`<div class="tw"><table><thead>${theadRow}</thead>
    <tbody>${rows}</tbody></table></div>`
    :`<div class="empty"><div class="ei">📒</div><h3>Sin cuentas corrientes</h3><p>Los clientes con condición CC aparecerán aquí</p></div>`}`;
  _restoreFocus(_fSnap,document.getElementById('main-content'));
}

async function verCCCliente(clienteId,desde,hasta){
  const eid=_empresa.id;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===clienteId);if(!cl)return;
  const fvs=(await DB.getE(eid,'facturas_venta')).filter(f=>f.clienteId===clienteId&&f.tipo==='cc');
  const recs=(await DB.getE(eid,'recibos_cobro')).filter(r=>r.clienteId===clienteId);
  var ncs=[];try{ncs=(await DB.getE(eid,'notas_credito')).filter(n=>n.clienteId===clienteId&&n.tipo==='venta');}catch(e){}
  // todos los movimientos sin filtro (para calcular saldo previo)
  const allMovs=[
    ...fvs.map(f=>({fecha:f.fecha,tipo:'Factura',numero:f.numero,debito:f.total,credito:0,id:f.id,tabla:'facturas_venta'})),
    ...recs.map(r=>({fecha:r.fecha,tipo:'Recibo',numero:r.numero,debito:0,credito:r.importe,id:r.id,tabla:'recibos_cobro'})),
    ...ncs.map(n=>({fecha:n.fecha,tipo:'Nota crédito',numero:n.numero,debito:0,credito:n.importe,id:n.id,tabla:'notas_credito'})),
  ].sort((a,b)=>a.fecha<b.fecha?-1:1);
  // Calcular saldo previo (movimientos ANTES del período)
  let saldoPrevio=0;
  var movsFiltrados=allMovs;
  if(desde){
    allMovs.filter(m=>m.fecha<desde).forEach(m=>{saldoPrevio+=m.debito-m.credito;});
    movsFiltrados=allMovs.filter(m=>m.fecha>=desde);
  }
  if(hasta){movsFiltrados=movsFiltrados.filter(m=>m.fecha<=hasta);}
  // ordenar DESC (más reciente primero)
  movsFiltrados.sort((a,b)=>a.fecha>b.fecha?-1:1);
  let saldo=saldoPrevio;
  // calcular saldos en orden cronológico primero, luego revertir para mostrar
  const movsAsc=[...movsFiltrados].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let s=saldoPrevio;
  const saldoMap={};
  movsAsc.forEach((m,i)=>{s+=m.debito-m.credito;saldoMap[i]=s;});
  const saldoFinal=s;
  // reordenar a DESC para mostrar
  const rows=movsFiltrados.map((m,i)=>{
    const idx=movsAsc.findIndex(x=>x.fecha===m.fecha&&x.numero===m.numero&&x.tipo===m.tipo);
    return Object.assign({},m,{saldo:saldoMap[idx]});
  });
  var cid=clienteId;
  var desdeDef=desde||'';var hastaDef=hasta||today();
  openModal('CC · '+esc(cl.nombre),`

  const recs=(await DB.getE(eid,'recibos_cobro')).filter(r=>r.clienteId===clienteId);
  var ncs=[];try{ncs=(await DB.getE(eid,'notas_credito')).filter(n=>n.clienteId===clienteId&&n.tipo==='venta');}catch(e){}
  const allMovs=[
    ...fvs.map(f=>({fecha:f.fecha,tipo:'Factura',numero:f.numero,debito:f.total,credito:0})),
    ...recs.map(r=>({fecha:r.fecha,tipo:'Recibo',numero:r.numero,debito:0,credito:r.importe})),
    ...ncs.map(n=>({fecha:n.fecha,tipo:'Nota Crédito',numero:n.numero,debito:0,credito:n.importe})),
  ].sort((a,b)=>a.fecha<b.fecha?-1:1);

    return '<tr><td style="padding:5px 8px;font-size:12px;border-bottom:1px solid #e2e8f0">'+esc(m.fecha)+'</td>'

  }).join('');
  var periodoLabel=(desde||hasta)?'Período: '+(desde||'inicio')+' al '+(hasta||'hoy'):'Histórico completo';
  var html='<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">CUENTA CORRIENTE · '+esc(cl.nombre)+'</h2>'
    +_empresaHeader()

    +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Tipo</th>'

async function exportarExcelCCGlobal(){
  try{
    const eid=_empresa.id;
    const clientes=(await DB.getE(eid,'clientes')).filter(x=>x.activo);
    const fvsAll=await DB.getE(eid,'facturas_venta');
    const recsAll=await DB.getE(eid,'recibos_cobro');
    var ncsAll=[];try{ncsAll=(await DB.getE(eid,'notas_credito')).filter(x=>x.tipo==='venta');}catch(e){}
    var clientesCC=clientes.filter(function(cl){
      return cl.condicionCobro==='cc'||fvsAll.some(f=>f.clienteId===cl.id&&f.tipo==='cc')||recsAll.some(r=>r.clienteId===cl.id);
    });
    if(_ccQ){var q=_ccQ.toLowerCase();clientesCC=clientesCC.filter(x=>x.nombre.toLowerCase().includes(q)||(x.cuit||'').includes(q));}
    function calcCC2(cl){
      var fvs=fvsAll.filter(f=>f.clienteId===cl.id&&f.tipo==='cc');
      var recs=recsAll.filter(r=>r.clienteId===cl.id);
      var ncs=ncsAll.filter(n=>n.clienteId===cl.id);
      var saldoPrevio=0;
      if(_ccDesde){fvs.filter(f=>f.fecha<_ccDesde).forEach(f=>{saldoPrevio+=f.total;});recs.filter(r=>r.fecha<_ccDesde).forEach(r=>{saldoPrevio-=r.importe;});ncs.filter(n=>n.fecha<_ccDesde).forEach(n=>{saldoPrevio-=n.importe;});}
      var fvsP=_ccDesde?fvs.filter(f=>f.fecha>=_ccDesde):fvs;var recsP=_ccDesde?recs.filter(r=>r.fecha>=_ccDesde):recs;var ncsP=_ccDesde?ncs.filter(n=>n.fecha>=_ccDesde):ncs;
      if(_ccHasta){fvsP=fvsP.filter(f=>f.fecha<=_ccHasta);recsP=recsP.filter(r=>r.fecha<=_ccHasta);ncsP=ncsP.filter(n=>n.fecha<=_ccHasta);}
      var debito=fvsP.reduce((s,f)=>s+f.total,0);var credito=recsP.reduce((s,r)=>s+r.importe,0)+ncsP.reduce((s,n)=>s+n.importe,0);
      var saldo=saldoPrevio+debito-credito;
      var tieneMovs=(fvs.length+recs.length+ncs.length)>0;
      return {saldoPrevio,debito,credito,saldo,tieneMovs};
    }
    var clientesFilt=clientesCC.filter(function(cl){
      var d=calcCC2(cl);
      if(_ccOcultarSinMovs&&!d.tieneMovs)return false;
      if(_ccOcultarSinSaldo&&Math.abs(d.saldo)<0.001)return false;
      if(_ccSoloDeudor&&d.saldo<=0)return false;
      if(_ccSoloAcreedor&&d.saldo>=0)return false;
      return true;
    });
    var header=_ccDesde?['Cliente','CUIT','Saldo previo','Débito','Crédito','Saldo']:['Cliente','CUIT','Débito','Crédito','Saldo'];
    var aoa=[header];
    clientesFilt.forEach(function(cl){
      var d=calcCC2(cl);
      if(_ccDesde)aoa.push([cl.nombre,cl.cuit||'',d.saldoPrevio,d.debito,d.credito,d.saldo]);
      else aoa.push([cl.nombre,cl.cuit||'',d.debito,d.credito,d.saldo]);
    });
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb,ws,'CC Clientes');
    XLSX.writeFile(wb,'CC_Clientes_'+today()+'.xlsx');
    toast('Excel descargado','success');
  }catch(e){toast('Error al exportar: '+e.message,'error');}
}

async function saveNotaCreditoCliente(){
  const eid=_empresa.id;

  const importe=parseFloat(document.getElementById('nc-imp').value)||0;

async function delItem(key,id,cb){
  confirm('¿Eliminar registro?','Esta acción no se puede deshacer.',async()=>{
    const eid=_empresa.id;
    await DB.deleteItem(eid,key,id);
    toast('Eliminado','success');
    if(typeof cb==='function')await cb();
  });
}

function _logoHtml(h){
  if(!_empresa||!_empresa.logo)return '';
  return '<img src="'+_empresa.logo+'" style="height:'+h+'px;max-width:160px;object-fit:contain">';
}
function _empresaHeader(){
  var logoH=_empresa&&_empresa.logo?'<img src="'+_empresa.logo+'" style="height:117px;max-width:338px;object-fit:contain;display:block;margin-bottom:6px">':'';
  var nombre=_empresa?esc(_empresa.nombre||''):'';
  var cuit=_empresa&&_empresa.cuit?'CUIT: '+esc(_empresa.cuit):'';
  var dir=_empresa&&_empresa.direccion?esc(_empresa.direccion):'';
  var tel=_empresa&&_empresa.telefono?'Tel: '+esc(_empresa.telefono):'';
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #334155">'
    +'<div>'+logoH+'<div style="font-size:15px;font-weight:700;color:#1e293b">'+nombre+'</div>'
    +(cuit?'<div style="font-size:12px;color:#64748b">'+cuit+'</div>':'')
    +(dir?'<div style="font-size:12px;color:#64748b">'+dir+'</div>':'')
    +(tel?'<div style="font-size:12px;color:#64748b">'+tel+'</div>':'')
    +'</div></div>';
}

      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Fecha</th>'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Tipo</th>'
      +'<th style="text-align:left;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">N°</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Débito</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Crédito</th>'
      +'<th style="text-align:right;padding:7px 8px;font-size:11px;border-bottom:1px solid #cbd5e1">Saldo</th>'
      +'</tr></thead><tbody>'+rowsCC+'</tbody></table>'
      +'<div style="text-align:right;font-size:15px;font-weight:700;margin-top:12px;padding-top:8px;border-top:2px solid #334155;color:'+(saldo>0?'#dc2626':saldo<0?'#16a34a':'#334155')+'">Saldo: '+fmtARS(saldo)+'</div>';
  }
  if(!html)return;
  abrirVentanaImpresion(html);
}

function abrirVentanaImpresion(contenidoHtml){
  var w=window.open('','_blank','width=800,height=900');
  if(!w){toast('Habilitá las ventanas emergentes para imprimir','error');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Imprimir</title>'
    +'<style>body{font-family:Arial,sans-serif;margin:0;padding:28px 36px;color:#1e293b;background:#fff}'
    +'@media print{body{padding:0}@page{margin:1.5cm}.no-print{display:none!important}}</style></head>'
    +'<body>'+contenidoHtml
    +'<div class="no-print" style="margin-top:40px;text-align:center">'
    +'<button onclick="window.print()" style="background:#2563eb;color:#fff;border:none;padding:10px 28px;border-radius:6px;font-size:14px;cursor:pointer;margin-right:10px">🖨️ Imprimir / Guardar PDF</button>'
    +'<button onclick="window.close()" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer">Cerrar</button>'
    +'</div></body></html>');
  w.document.close();
}

async function imprimirInforme(){
  const eid=_empresa.id;
  const desde=_infDesde||'';
  const hasta=_infHasta||'';
  var html='';

  if(_infTab==='financiero'){
    const recCob=await DB.getE(eid,'recibos_cobro');
    const ordPago=await DB.getE(eid,'ordenes_pago');
    const fvCob=(await DB.getE(eid,'facturas_venta')).filter(x=>x.tipo==='contado'&&x.estado==='cobrada');
    const fcPag=(await DB.getE(eid,'facturas_compra')).filter(x=>x.tipo==='contado'&&x.estado==='pagada');
    const fps=await DB.getE(eid,'formas_pago');
    const clientes=await DB.getE(eid,'clientes');
    const provs=await DB.getE(eid,'proveedores');
    const movs=[];
    recCob.filter(r=>r.fecha>=desde&&r.fecha<=hasta).forEach(r=>{const cl=clientes.find(x=>x.id===r.clienteId);movs.push({fecha:r.fecha,tipo:'Cobro',desc:'Cobro cliente'+(cl?' · '+cl.nombre:''),numero:r.numero,importe:r.importe,dir:'in',fpId:r.formaPagoId});});
    fvCob.filter(f=>f.fecha>=desde&&f.fecha<=hasta).forEach(f=>{const cl=clientes.find(x=>x.id===f.clienteId);movs.push({fecha:f.fecha,tipo:'Cobro',desc:'Venta contado'+(cl?' · '+cl.nombre:''),numero:f.numero,importe:f.total,dir:'in',fpId:f.formaPagoId});});
    ordPago.filter(o=>o.fecha>=desde&&o.fecha<=hasta).forEach(o=>{const pv=provs.find(x=>x.id===o.proveedorId);movs.push({fecha:o.fecha,tipo:'Pago',desc:'Pago proveedor'+(pv?' · '+pv.nombre:''),numero:o.numero,importe:o.importe,dir:'out',fpId:o.formaPagoId});});
    fcPag.filter(f=>f.fecha>=desde&&f.fecha<=hasta).forEach(f=>{const pv=provs.find(x=>x.id===f.proveedorId);movs.push({fecha:f.fecha,tipo:'Pago',desc:'Compra contado'+(pv?' · '+pv.nombre:''),numero:f.numero,importe:f.total,dir:'out',fpId:f.formaPagoId});});
    movs.sort((a,b)=>a.fecha>b.fecha?-1:1);
    const totalIn=movs.filter(m=>m.dir==='in').reduce((s,m)=>s+m.importe,0);
    const totalOut=movs.filter(m=>m.dir==='out').reduce((s,m)=>s+m.importe,0);
    const resultado=totalIn-totalOut;
    html=_empresaHeader()
      +'<h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Informe Financiero</h2>'
      +'<p style="font-size:12px;color:#64748b;margin-bottom:18px">Período: '+esc(desde)+' al '+esc(hasta)+'</p>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px">'
      +'<tr style="background:#f1f5f9"><td style="padding:8px 10px;border:1px solid #e2e8f0">Total cobranzas</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600;color:#16a34a">'+fmtARS(totalIn)+'</td></tr>'
      +'<tr><td style="padding:8px 10px;border:1px solid #e2e8f0">Total pagos</td><td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:600;color:#dc2626">'+fmtARS(totalOut)+'</td></tr>'

      +'</table>'
      +'<div style="display:flex;gap:24px;margin-bottom:20px">'
      +'<div style="flex:1"><h3 style="font-size:13px;font-weight:700;margin-bottom:8px">Ventas del período ('+fv.length+')</h3>'
      +(fv.length?'<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#f1f5f9"><th style="padding:5px 8px;border:1px solid #e2e8f0;text-align:left">N°</th><th style="padding:5px 8px;border:1px solid #e2e8f0;text-align:left">Fecha</th><th style="padding:5px 8px;border:1px solid #e2e8f0;text-align:left">Cliente</th><th style="padding:5px 8px;border:1px solid #e2e8f0;text-align:right">Total</th></tr></thead><tbody>'+fv.map(function(f){var cl=clientes.find(x=>x.id===f.clienteId);return '<tr><td style="padding:4px 8px;border:1px solid #e2e8f0;font-family:monospace">'+esc(f.numero)+'</td><td style="padding:4px 8px;border:1px solid #e2e8f0">'+esc(f.fecha)+'</td><td style="padding:4px 8px;border:1px solid #e2e8f0">'+(cl?esc(cl.nombre):'—')+'</td><td style="padding:4px 8px;border:1px solid #e2e8f0;text-align:right;font-family:monospace">'+fmtARS(f.total)+'</td></tr>';}).join('')+'</tbody></table>'

  }
  if(!html)return;
  abrirVentanaImpresion(html);

  });

// APLICACIÓN DE CC — permite imputar comprobantes entre sí
// ═══════════════════════════════════════════════════════════
async function abrirAplicacionCC(clienteId){
  const eid=_empresa.id;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===clienteId);
  if(!cl)return;
  const fvs=(await DB.getE(eid,'facturas_venta')).filter(f=>f.clienteId===clienteId&&f.tipo==='cc'&&f.estado!=='cobrada');
  var ncs=[];try{ncs=(await DB.getE(eid,'notas_credito')).filter(n=>n.clienteId===clienteId&&n.tipo==='venta');}catch(e){}
  const recs=await DB.getE(eid,'recibos_cobro');
  // Recibos sin aplicar o con saldo disponible
  var recsSaldo=recs.filter(function(r){
    if(r.clienteId!==clienteId)return false;
    var aplicado=(r.comprobantesAplicados||[]).reduce(function(s,c){return s+c.importeAplicado;},0);
    return r.importe-aplicado>0.001;
  }).map(function(r){
    var aplicado=(r.comprobantesAplicados||[]).reduce(function(s,c){return s+c.importeAplicado;},0);
    return Object.assign({},r,{saldo:r.importe-aplicado});
  });
  var ncsConSaldo=ncs.filter(function(n){
    var aplicado=recs.reduce(function(s,r){return s+(r.comprobantesAplicados||[]).filter(c=>c.id===n.id).reduce(function(a,c){return a+c.importeAplicado;},0);},0);
    return n.importe-aplicado>0.001;
  }).map(function(n){
    var aplicado=recs.reduce(function(s,r){return s+(r.comprobantesAplicados||[]).filter(c=>c.id===n.id).reduce(function(a,c){return a+c.importeAplicado;},0);},0);
    return Object.assign({},n,{saldo:n.importe-aplicado});
  });

  // Panel izquierdo: créditos disponibles (recibos y NC)
  var creditRows=recsSaldo.map(function(r){
    return '<tr><td><input type="checkbox" class="apl-cred-check" value="'+r.id+'" data-tipo="rec" data-num="'+esc(r.numero)+'" data-saldo="'+r.saldo+'" onchange="aplCredToggle(this)"></td>'
      +'<td style="font-size:12px">'+esc(r.numero)+'</td><td style="font-size:12px">Recibo</td>'
      +'<td style="font-size:12px;text-align:right;font-family:monospace;color:var(--green)">'+fmtARS(r.saldo)+'</td>'
      +'<td><input id="apl-cred-imp-'+r.id+'" type="number" step="0.01" value="'+r.saldo+'" style="width:90px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px" disabled></td></tr>';
  }).join('');
  creditRows+=ncsConSaldo.map(function(n){
    return '<tr><td><input type="checkbox" class="apl-cred-check" value="'+n.id+'" data-tipo="nc" data-num="'+esc(n.numero)+'" data-saldo="'+n.saldo+'" onchange="aplCredToggle(this)"></td>'
      +'<td style="font-size:12px">'+esc(n.numero)+'</td><td style="font-size:12px">Nota crédito</td>'
      +'<td style="font-size:12px;text-align:right;font-family:monospace;color:var(--green)">'+fmtARS(n.saldo)+'</td>'
      +'<td><input id="apl-cred-imp-'+n.id+'" type="number" step="0.01" value="'+n.saldo+'" style="width:90px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px" disabled></td></tr>';
  }).join('');

  // Panel derecho: débitos pendientes (facturas)
  var debitRows=fvs.map(function(f){
    return '<tr><td><input type="checkbox" class="apl-deb-check" value="'+f.id+'" data-num="'+esc(f.numero)+'" data-total="'+f.total+'"></td>'
      +'<td style="font-size:12px">'+esc(f.numero)+'</td><td style="font-size:12px;text-align:right;font-family:monospace;color:var(--red)">'+fmtARS(f.total)+'</td></tr>';
  }).join('');

  if(!creditRows&&!debitRows){
    toast('No hay operaciones pendientes para aplicar en esta cuenta corriente.','info');return;
  }

  openModal('Aplicar operaciones CC · '+esc(cl.nombre),`
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Seleccioná los créditos disponibles (recibos / notas de crédito) y las facturas pendientes que querés imputar entre sí.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Créditos disponibles</div>
        ${creditRows?`<div style="border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:var(--surface2)"><th style="padding:5px 7px;font-size:11px"></th><th style="padding:5px 7px;font-size:11px">N°</th><th style="padding:5px 7px;font-size:11px">Tipo</th><th style="padding:5px 7px;font-size:11px;text-align:right">Saldo</th><th style="padding:5px 7px;font-size:11px">A aplicar</th></tr></thead><tbody>${creditRows}</tbody></table></div>`
        :'<p style="font-size:12px;color:var(--text2)">Sin créditos disponibles</p>'}
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Facturas pendientes</div>
        ${debitRows?`<div style="border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:var(--surface2)"><th style="padding:5px 7px;font-size:11px"></th><th style="padding:5px 7px;font-size:11px">N°</th><th style="padding:5px 7px;font-size:11px;text-align:right">Total</th></tr></thead><tbody>${debitRows}</tbody></table></div>`
        :'<p style="font-size:12px;color:var(--text2)">Sin facturas pendientes</p>'}
      </div>
    </div>
  `,[{lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},{lbl:'Aplicar imputación',cls:'btn-primary',fn:'guardarAplicacionCC(\''+clienteId+'\')'}],true);
}

function aplCredToggle(cb){
  var inp=document.getElementById('apl-cred-imp-'+cb.value);
  if(inp)inp.disabled=!cb.checked;
}

async function guardarAplicacionCC(clienteId){
  const eid=_empresa.id;
  // Créditos seleccionados
  var credSelects=document.querySelectorAll('.apl-cred-check:checked');
  if(!credSelects.length){toast('Seleccioná al menos un crédito a aplicar','error');return;}
  var debSelects=document.querySelectorAll('.apl-deb-check:checked');
  if(!debSelects.length){toast('Seleccioná al menos una factura a imputar','error');return;}

  showLoading('Aplicando imputaciones...');
  const recs=await DB.getE(eid,'recibos_cobro');
  const fvs=await DB.getE(eid,'facturas_venta');

  // Para cada crédito seleccionado: agregar comprobantes aplicados
  for(var i=0;i<credSelects.length;i++){
    var cb=credSelects[i];
    var inp=document.getElementById('apl-cred-imp-'+cb.value);
    var impApl=inp?parseFloat(inp.value)||0:0;
    if(!impApl)continue;
    if(cb.dataset.tipo==='rec'){
      // Actualizar recibo con comprobantes aplicados adicionales
      var rec=recs.find(x=>x.id===cb.value);
      if(!rec)continue;
      var compApls=rec.comprobantesAplicados||[];
      // Distribuir entre las facturas seleccionadas
      var restante=impApl;
      debSelects.forEach(function(db){
        if(restante<=0)return;
        var fac=fvs.find(x=>x.id===db.value);
        if(!fac)return;
        var ya=(rec.comprobantesAplicados||[]).filter(c=>c.id===fac.id).reduce(function(s,c){return s+c.importeAplicado;},0);
        var pendiente=fac.total-ya;
        var aplicar=Math.min(restante,pendiente);
        if(aplicar>0.001){compApls.push({id:fac.id,tipo:'fv',numero:fac.numero,importeAplicado:aplicar});restante-=aplicar;}
      });
      await DB.upsertItem(eid,'recibos_cobro',Object.assign({},rec,{comprobantesAplicados:compApls}));
    }
  }

  // Marcar facturas como cobradas si su saldo queda cubierto
  const recsUpd=await DB.getE(eid,'recibos_cobro');
  for(var j=0;j<debSelects.length;j++){
    var facId=debSelects[j].value;
    var fac=fvs.find(x=>x.id===facId);
    if(!fac)continue;
    var cobrado=recsUpd.reduce(function(s,r){return s+(r.comprobantesAplicados||[]).filter(c=>c.id===facId).reduce(function(a,c){return a+c.importeAplicado;},0);},0);
    if(cobrado>=fac.total-0.001){
      await DB.upsertItem(eid,'facturas_venta',Object.assign({},fac,{estado:'cobrada',fechaCobro:today()}));
    }
  }

  hideLoading();
  closeModal();
  toast('Imputaciones aplicadas correctamente','success');
  if(_section==='cc-clientes')renderCCClientes();
}

async function isMesCerrado(fecha){
  const cfg=await DB.cfg(_empresa.id);

function abrirCerrarMes(){
  const hoy=today();
  var mesOpts='';
  for(let i=0;i<24;i++){
    const d=new Date(hoy);d.setDate(1);d.setMonth(d.getMonth()-i);
    const m=d.toISOString().slice(0,7);
    mesOpts+='<option value="'+m+'">'+m+'</option>';
  }
  openModal('Cerrar mes',`
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Seleccioná el mes a cerrar. Una vez cerrado, no se podrán crear ni modificar registros en ese período.</p>

  `,[{lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},{lbl:'Cerrar mes',cls:'btn-primary',fn:'cerrarMes(document.getElementById(\'cm-mes\').value)'}]);

async function cerrarMes(mes){
  if(!mes){toast('Seleccioná un mes','error');return}
  confirm('¿Cerrar el mes '+mes+'?','Esto sellará todas las operaciones hasta ese mes inclusive.',async function(){
    closeModal();
    const eid=_empresa.id;
    const cfg=await DB.cfg(eid);
    const cierres=cfg.cierres||[];
    if(cierres.some(c=>c.mes===mes)){toast('Ese mes ya está cerrado','error');return}
    cierres.push({mes,fechaCierre:today(),usuario:_user.nombre});
    await DB.setCfg(eid,{cierres});
    toast('Mes '+mes+' cerrado correctamente','success');
    renderInformes();
  });
}

async function revertirCierre(mes){

    const eid=_empresa.id;
    const cfg=await DB.cfg(eid);

    renderInformes();
  });
}

// ── Importar abonos desde xlsx ──────────────────────────────────────────────
async function importarAbonos(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const sheetName=wb.SheetNames.find(n=>n!=='Instrucciones')||wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length){toast('La planilla está vacía','error');return}
      // Validar columnas
      const first=rows[0];
      if(!('CUIT' in first)||!('Concepto' in first)||!('Importe' in first)){
        toast('Faltan columnas: CUIT, Concepto, Importe','error');return;
      }
      const eid=_empresa.id;
      const clientes=await DB.getE(eid,'clientes');
      // Agrupar abonos por CUIT
      const abonosPorCuit={};
      let omitidas=0;
      rows.forEach(r=>{
        const cuit=String(r['CUIT']||'').trim();
        const concepto=String(r['Concepto']||'').trim();
        const importe=parseFloat(String(r['Importe']).replace(/\./g,'').replace(',','.'))||0;
        if(!cuit||!concepto){omitidas++;return}
        if(!abonosPorCuit[cuit])abonosPorCuit[cuit]=[];
        abonosPorCuit[cuit].push({descripcion:concepto,cantidad:1,precio:importe});
      });
      const cuitsEncontrados=Object.keys(abonosPorCuit);
      const sinMatch=[];
      let totalAbonos=0;
      // Vista previa en modal
      const resumen=cuitsEncontrados.map(cuit=>{
        const cl=clientes.find(c=>c.cuit===cuit);
        const abs=abonosPorCuit[cuit];
        const sub=abs.reduce((s,a)=>s+a.precio,0);
        if(!cl){sinMatch.push(cuit);return null}
        totalAbonos+=abs.length;
        return{cl,abs,sub};
      }).filter(Boolean);
      if(!resumen.length){toast('Ningún CUIT coincide con clientes del sistema','error');return}
      const avisoOmitidas=sinMatch.length?`<p style="color:var(--red);font-size:12px;margin-top:8px">⚠ ${sinMatch.length} CUIT sin coincidencia: ${sinMatch.slice(0,5).join(', ')}${sinMatch.length>5?'…':''}</p>`:'';
      openModal('Importar abonos — confirmar',`
        <p style="margin-bottom:12px;font-size:13px">Se cargaran <strong>${totalAbonos} abonos</strong> en <strong>${resumen.length} cliente${resumen.length!==1?'s':''}</strong>. Los abonos existentes de esos clientes serán <strong>reemplazados</strong>.</p>
        <div class="tw mb8" style="max-height:280px;overflow-y:auto"><table style="font-size:12px"><thead><tr><th>Cliente</th><th>Abonos</th><th class="td-r">Total</th></tr></thead><tbody>
        ${resumen.map(({cl,abs,sub})=>`<tr><td>${esc(cl.nombre)}</td><td>${abs.map(a=>esc(a.descripcion)).join(', ')}</td><td class="td-mono td-r">${fmtARS(sub)}</td></tr>`).join('')}
        </tbody></table></div>
        ${avisoOmitidas}
      `,[
        {lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},
        {lbl:`Confirmar importación`,cls:'btn-primary',fn:`_doImportAbonos()`}
      ],true);
      window._pendingAbonosImport=resumen.map(({cl,abs})=>({id:cl.id,abonos:abs}));
    }catch(err){console.error(err);toast('Error al leer el archivo','error')}
  };
  reader.readAsArrayBuffer(file);
  input.value='';
}

async function _doImportAbonos(){
  const updates=window._pendingAbonosImport||[];
  if(!updates.length){toast('Sin datos para importar','error');return}
  showLoading('Importando abonos...');
  closeModal();
  const eid=_empresa.id;
  let ok=0;
  for(const {id,abonos} of updates){
    const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===id);
    if(!cl)continue;
    await DB.upsertItem(eid,'clientes',{...cl,abonos});
    ok++;
  }
  DB._clearCache&&DB._clearCache(eid,'clientes');
  hideLoading();
  toast(`Abonos importados en ${ok} cliente${ok!==1?'s':''}  ✓`,'success');
  navTo('clientes');
}

// ── Convierte un item de DB a fila Excel (resuelve rubroNombre) ──
function itemToRow(item, cols, rubros) {
  const row = {};
  cols.forEach(col => {
    if (col.k === 'rubroNombre') {
      const rub = rubros.find(r => r.id === item.rubroId);
      row[col.h] = rub ? rub.nombre : '';
    } else if (col.k === 'activo') {
      row[col.h] = item.activo === false ? 'NO' : 'SI';
    } else {
      row[col.h] = item[col.k] !== undefined ? item[col.k] : (col.def !== undefined ? col.def : '');
    }
  });
  return row;
}

// ── Exportar planilla de un maestro ──
async function exportarExcelMaestro(maestroKey) {
  if (!XLSX) { toast('SheetJS no disponible', 'error'); return; }
  const def = MAESTROS[maestroKey];
  if (!def) return;
  const eid = _empresa.id;
  const items = await DB.getE(eid, def.dbKey);
  const rubros = await DB.getE(eid, 'rubros');

  // Hoja de datos
  const dataRows = items.length
    ? items.map(it => itemToRow(it, def.cols, rubros))
    : [Object.fromEntries(def.cols.map(c => [c.h, c.def !== undefined ? c.def : '']))];

  const wsData = XLSX.utils.json_to_sheet(dataRows, { header: def.cols.map(c => c.h) });

  // Estilos básicos de cabecera (ancho de columnas)
  const colWidths = def.cols.map(c => ({ wch: Math.max(c.h.length + 2, 18) }));
  wsData['!cols'] = colWidths;

  // Hoja de instrucciones
  const instrRows = [
    { A: `INSTRUCCIONES — ${def.label}` },
    { A: '' },
    { A: '• Esta planilla tiene el formato de importación para el sistema.' },
    { A: '• Podés editar las filas existentes o agregar nuevas al final.' },
    { A: '• Al importar, los registros nuevos se AGREGAN (no reemplazan la base).' },
    { A: `• Si un registro ya existe (mismo "${def.idField}"), el sistema te preguntará qué hacer.` },
    { A: '• Columnas marcadas con * son obligatorias.' },
    { A: '• No modifiques los encabezados de la primera fila.' },
    { A: '' },
    { A: 'Campos requeridos (*):', },
    ...def.cols.filter(c => c.req).map(c => ({ A: `  → ${c.h} *` })),
  ];
  const wsInstr = XLSX.utils.json_to_sheet(instrRows, { header: ['A'], skipHeader: true });
  wsInstr['!cols'] = [{ wch: 70 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsData, def.label);
  XLSX.utils.book_append_sheet(wb, wsInstr, 'Instrucciones');

  XLSX.writeFile(wb, `${def.label.replace(/ /g, '_')}_${_empresa.nombre.replace(/ /g, '_')}.xlsx`);
  toast(`Planilla "${def.label}" descargada`, 'success');
}

// ── Importar planilla: parsear y mostrar modal de confirmación ──
async function importarExcelMaestro(input, maestroKey) {
  const file = input.files[0];
  if (!file) return;
  const def = MAESTROS[maestroKey];
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      // Buscar la hoja del maestro (primera que no sea "Instrucciones")
      const sheetName = wb.SheetNames.find(n => n !== 'Instrucciones') || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!rows.length) { toast('La planilla está vacía', 'error'); return; }

      // Validar que tenga columnas correctas
      const firstRow = rows[0];
      const missingRequired = def.cols.filter(c => c.req && !(c.h in firstRow));
      if (missingRequired.length) {
        toast(`Faltan columnas: ${missingRequired.map(c => c.h).join(', ')}`, 'error');
        return;
      }

      // Procesar cada fila → objeto normalizado
      const eid = _empresa.id;
      const rubros = await DB.getE(eid, 'rubros');
      const existing = await DB.getE(eid, def.dbKey);

      const parsed = rows.map((row, i) => {
        const obj = { id: genId(), activo: true };
        def.cols.forEach(col => {
          const val = row[col.h];
          if (col.k === 'rubroNombre') {
            const rub = rubros.find(r => r.nombre.toLowerCase() === String(val || '').toLowerCase());
            obj.rubroId = rub ? rub.id : '';
          } else if (col.k === 'activo') {
            obj.activo = String(val || '').toUpperCase() !== 'NO';
          } else if (col.k === 'precio' || col.k === 'saldoInicial' || col.k === 'diasVenc') {
            obj[col.k] = parseFloat(val) || (col.def || 0);
          } else {
            obj[col.k] = val !== '' ? val : (col.def !== undefined ? col.def : '');
          }
        });
        obj._rowNum = i + 2; // fila Excel (1=header, 2=primera data)
        return obj;
      }).filter(obj => {
        // Filtrar filas completamente vacías
        const idVal = obj[def.idField];
        return idVal && String(idVal).trim() !== '';
      });

      if (!parsed.length) { toast('No se encontraron filas con datos válidos', 'error'); return; }

      // Clasificar: nuevos vs duplicados
      const idField = def.idField;
      const nuevos = [];
      const duplicados = [];

      parsed.forEach(obj => {
        const idVal = String(obj[idField] || '').toLowerCase().trim();
        const match = existing.find(ex => String(ex[idField] || '').toLowerCase().trim() === idVal);
        if (match) {
          duplicados.push({ nuevo: obj, existente: match });
        } else {
          nuevos.push(obj);
        }
      });

      // Mostrar modal de revisión
      mostrarModalImportacion(def, nuevos, duplicados, eid);

    } catch (err) {
      console.error(err);
      toast('Error al leer el archivo Excel', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  input.value = '';
}

let _importPendingDups = []; // duplicados con decisión pendiente
let _importNuevos = [];
let _importDef = null;
let _importEid = null;

function mostrarModalImportacion(def, nuevos, duplicados, eid) {
  _importDef = def;
  _importNuevos = nuevos;
  _importEid = eid;
  _importPendingDups = duplicados.map((d, i) => ({ ...d, idx: i, accion: 'omitir' }));

  const totalFilas = nuevos.length + duplicados.length;

  let dupHTML = '';
  if (duplicados.length) {
    dupHTML = `
      <div style="margin-top:16px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--yellow)">
          ⚠️ ${duplicados.length} registro${duplicados.length !== 1 ? 's' : ''} ya exist${duplicados.length !== 1 ? 'en' : 'e'} en la base
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
          Elegí qué hacer con cada uno:
        </div>
        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)">
          <table style="width:100%;border-collapse:collapse">
            <thead><tr style="background:var(--surface2)">
              <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Registro</th>
              <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Fila Excel</th>
              <th style="padding:8px 12px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)">Acción</th>
            </tr></thead>
            <tbody>
              ${_importPendingDups.map(d => `
                <tr style="border-bottom:1px solid var(--border)" id="dup-row-${d.idx}">
                  <td style="padding:9px 12px;font-size:13px"><strong>${esc(String(d.nuevo[def.idField] || ''))}</strong></td>
                  <td style="padding:9px 12px;font-size:12px;color:var(--text2)">Fila ${d.nuevo._rowNum}</td>
                  <td style="padding:9px 12px">
                    <select onchange="setDupAccion(${d.idx},this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--surface);color:var(--text);outline:none">
                      <option value="omitir" selected>Omitir (mantener existente)</option>
                      <option value="reemplazar">Reemplazar con nueva versión</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-secondary btn-sm" onclick="setTodasAccion('omitir')">Omitir todos</button>
          <button class="btn btn-secondary btn-sm" onclick="setTodasAccion('reemplazar')">Reemplazar todos</button>
        </div>
      </div>`;
  }

  openModal(`Importar ${def.label}`,`
    <div>
      <div class="g3" style="margin-bottom:16px">
        <div class="stat-card">
          <div class="stat-lbl">Total en planilla</div>
          <div class="stat-val" style="color:var(--accent);font-size:20px">${totalFilas}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Registros nuevos</div>
          <div class="stat-val" style="color:var(--green);font-size:20px">${nuevos.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Ya existentes</div>
          <div class="stat-val" style="color:var(--yellow);font-size:20px">${duplicados.length}</div>
        </div>
      </div>
      ${nuevos.length ? `<div style="font-size:13px;color:var(--green);margin-bottom:8px">✓ ${nuevos.length} registro${nuevos.length !== 1 ? 's' : ''} nuevo${nuevos.length !== 1 ? 's' : ''} listo${nuevos.length !== 1 ? 's' : ''} para agregar</div>` : ''}
      ${dupHTML}
    </div>
  `,[
    { lbl: 'Cancelar', cls: 'btn-secondary', fn: 'closeModal()' },
    { lbl: 'Confirmar importación', cls: 'btn-primary', fn: 'ejecutarImportacion()' },
  ], true);
}

function setDupAccion(idx, accion) {
  const d = _importPendingDups.find(x => x.idx === idx);
  if (d) d.accion = accion;
}

function setTodasAccion(accion) {
  _importPendingDups.forEach(d => {
    d.accion = accion;
    const sel = document.querySelector(`#dup-row-${d.idx} select`);
    if (sel) sel.value = accion;
  });
}

async function ejecutarImportacion() {
  const def = _importDef;
  const eid = _importEid;
  let agregados = 0;
  let reemplazados = 0;
  let omitidos = 0;

  showLoading('Importando registros...');
  closeModal();

  // Agregar nuevos
  for (const obj of _importNuevos) {
    delete obj._rowNum;
    await DB.upsertItem(eid, def.dbKey, obj);
    agregados++;
  }

  // Procesar duplicados según decisión
  for (const d of _importPendingDups) {
    delete d.nuevo._rowNum;
    if (d.accion === 'reemplazar') {
      d.nuevo.id = d.existente.id;
      await DB.upsertItem(eid, def.dbKey, d.nuevo);
      reemplazados++;
    } else {
      omitidos++;
    }
  }

  hideLoading();

  const parts = [];
  if (agregados) parts.push(`${agregados} agregado${agregados !== 1 ? 's' : ''}`);
  if (reemplazados) parts.push(`${reemplazados} reemplazado${reemplazados !== 1 ? 's' : ''}`);
  if (omitidos) parts.push(`${omitidos} omitido${omitidos !== 1 ? 's' : ''}`);
  toast(`Importación completada: ${parts.join(' · ')}`, 'success');

  await navTo(_section);
}

// ── Botón toolbar para cada maestro ──
// Genera el HTML de los dos botones (exportar / importar) para insertar en cada toolbar
function xlsxToolbarBtns(maestroKey) {
  return `
    <button class="btn btn-secondary btn-sm" onclick="exportarExcelMaestro('${maestroKey}')" title="Descargar planilla Excel">
      📥 Excel
    </button>
    <label class="btn btn-secondary btn-sm" style="cursor:pointer" title="Importar desde Excel">
      📤 Importar
      <input type="file" accept=".xlsx,.xls" style="display:none" onchange="importarExcelMaestro(this,'${maestroKey}')">
    </label>
  `;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  // Mostrar pantalla de empresas inmediatamente con estado de carga
  showScreen('empresas');
  const g = document.getElementById('empresas-grid');
  g.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)"><div style="font-size:32px;margin-bottom:12px">⏳</div><p>Conectando con la base de datos...</p></div>`;

  try {
    await renderEmpresasScreen();
  } catch(e) {
    console.error('Error al conectar con Supabase:', e);
    g.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red)">
        <div style="font-size:32px;margin-bottom:12px">⚠️</div>
        <h3 style="margin-bottom:8px">Error de conexión</h3>
        <p style="font-size:13px;color:var(--text2)">No se pudo conectar con la base de datos.</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Reintentar</button>
      </div>`;
  }
});
</script>
