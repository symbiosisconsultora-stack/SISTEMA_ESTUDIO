<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SistemaGestión · Contable</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;--surface3:#edf0f4;
  --border:#e2e6ed;--border2:#ccd3df;
  --text:#1a1f2e;--text2:#5a6478;--text3:#9daab8;
  --accent:#2563eb;--accent2:#1d4ed8;--accent-bg:#eff4ff;--accent-border:#bfdbfe;
  --green:#16a34a;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --yellow:#b45309;--yellow-bg:#fffbeb;--yellow-bd:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --r:8px;--r-sm:5px;--r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.1);--sh-lg:0 8px 28px rgba(0,0,0,.14);
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sidebar:230px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
input,select,textarea,button{font-family:var(--font);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

/* ══════════ EMPRESA SELECTOR ══════════ */
#screen-empresas{flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.brand{text-align:center;margin-bottom:40px}
.brand-logo{width:80px;height:80px;background:var(--accent);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:36px;color:#fff;margin-bottom:14px;box-shadow:0 4px 16px rgba(37,99,235,.25)}
.brand h1{font-size:24px;font-weight:600;letter-spacing:-.3px}
.brand p{color:var(--text2);font-size:13px;margin-top:4px}
.empresas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;width:100%;max-width:760px}
.e-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all .15s}
.e-card:hover{border-color:var(--accent);box-shadow:var(--sh-md);transform:translateY(-2px)}
.e-card.new{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;color:var(--text2)}
.e-card.new:hover{color:var(--accent)}
.e-card .e-dot{width:10px;height:10px;border-radius:50%;margin-bottom:12px}
.e-card h3{font-size:14px;font-weight:600;margin-bottom:3px}
.e-card p{font-size:12px;color:var(--text2)}

/* ══════════ LOGIN ══════════ */
#screen-login{flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px;width:100%;max-width:360px;box-shadow:var(--sh-md)}
.login-box h2{font-size:18px;font-weight:600;margin-bottom:3px}
.login-box .sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.e-tag{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);margin-bottom:18px}

/* ══════════ APP LAYOUT ══════════ */
#screen-app{flex-direction:row}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* Sidebar sections */
.sb-brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-brand .logo{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.sb-brand .bn{font-size:13px;font-weight:600;line-height:1.3}
.sb-brand .bs{font-size:11px;color:var(--text3)}
.sb-empresa{padding:10px 12px;border-bottom:1px solid var(--border)}
.e-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s}
.e-chip:hover{border-color:var(--accent)}
.e-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.e-chip-name{font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.u-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rol{font-size:11px;color:var(--text3)}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;transition:color .15s}
.logout-btn:hover{color:var(--red)}
.nav{padding:8px;flex:1}
.nav-sec{margin-bottom:16px}
.nav-sec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:4px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .12s;user-select:none}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}

/* Topbar */
.tb-left h2{font-size:17px;font-weight:600}
.tb-left p{font-size:12px;color:var(--text2);margin-top:1px}
.tb-right{display:flex;gap:8px;align-items:center}

/* ══════════ FORMS ══════════ */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fg input::placeholder{color:var(--text3)}
.fg textarea{resize:vertical;min-height:72px}
.abonos-table{width:100%;border-collapse:collapse;margin-top:6px}
.abonos-table th{font-size:11px;font-weight:600;color:var(--text2);padding:4px 6px;text-align:left;background:var(--surface2);border-bottom:1px solid var(--border)}
.abonos-table td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.abonos-table input{width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px}
.abonos-table input:focus{outline:none;border-color:var(--accent)}
.ab-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:2px 4px;transition:color .15s}
.ab-del:hover{color:var(--red)}
.fg input[readonly]{background:var(--surface2);color:var(--text2);cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ══════════ BUTTONS ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.btn-danger:hover{background:#fee2e2}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid transparent;padding:6px 10px}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:6px 8px}
.btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:var(--font)}
.btn-link:hover{text-decoration:underline}

/* ══════════ TABLES ══════════ */
.tw{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface2);padding:9px 13px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td{padding:9px 13px;font-size:13px}
.td-mono{font-family:var(--mono);font-size:12px}
.td-r{text-align:right}
.td-act{display:flex;gap:4px}

/* ══════════ BADGES ══════════ */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-bd)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.badge-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
.son{background:var(--green)}.soff{background:var(--text3)}

/* ══════════ CARDS ══════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px}
.stat-lbl{font-size:12px;color:var(--text2);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:600;font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ══════════ MODAL ══════════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:var(--sh-lg);max-height:92vh;overflow-y:auto;animation:mIn .18s ease}
.modal-lg{max-width:740px}
@keyframes mIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:15px;font-weight:600}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.mcl{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1;transition:color .15s}
.mcl:hover{color:var(--text)}

/* ══════════ TOOLBAR ══════════ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-l{display:flex;align-items:center;gap:8px;flex:1}
.sw{position:relative}
.sw input{padding-left:32px;width:240px}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

/* ══════════ EMPTY ══════════ */
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty .ei{font-size:36px;opacity:.35;margin-bottom:12px}
.empty h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px}

/* ══════════ TOAST ══════════ */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 15px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-md);min-width:220px;animation:tIn .2s ease}
@keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--accent)}

/* ══════════ CONFIRM ══════════ */
#confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#confirm-overlay.open{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:var(--sh-lg)}
.confirm-box h3{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text2);margin-bottom:22px}
.confirm-box .ca{display:flex;gap:8px;justify-content:center}

/* ══════════ MISC ══════════ */
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.sh h3{font-size:16px;font-weight:600}
.sh p{font-size:12px;color:var(--text2);margin-top:2px}
.color-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cswatch:hover,.cswatch.sel{border-color:var(--text);transform:scale(1.1)}
.mono{font-family:var(--mono);font-size:12px}
.text-right{text-align:right}
.text-muted{color:var(--text2)}
.fw6{font-weight:600}
.mb4{margin-bottom:4px}
.mb8{margin-bottom:8px}
.mb16{margin-bottom:16px}
.mb24{margin-bottom:24px}
.gap8{gap:8px}
.flex{display:flex}
.flex-c{display:flex;align-items:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.dl{font-size:11px;color:var(--text2);margin-bottom:2px}
.dv{font-size:13px;font-weight:500}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:all .15s}
.mod-card:hover{border-color:var(--accent);box-shadow:var(--sh);transform:translateY(-1px)}
.mod-icon{font-size:26px;margin-bottom:10px}
.mod-name{font-size:13px;font-weight:600;margin-bottom:3px}
.mod-desc{font-size:12px;color:var(--text2)}
.cc-saldo-pos{color:var(--green);font-weight:600}
.cc-saldo-neg{color:var(--red);font-weight:600}

/* Lineas detalle */
.lineas-header{display:grid;gap:6px;margin-bottom:6px}
.linea-row{display:grid;gap:6px;margin-bottom:6px;align-items:end}
.linea-row input{padding:7px 9px}

/* Print */
@media print{
  .sidebar,.topbar,#toast-wrap,#confirm-overlay,.overlay,.toolbar{display:none!important}
  .content{padding:0}
  body{background:#fff}
  .print-area{display:block!important}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══ SCREEN: EMPRESAS ══ -->
<div id="screen-empresas" class="screen active">
  <div class="brand">
    <div class="brand-logo" id="brand-logo-icon">📊</div>
    <h1>SistemaGestión</h1>
    <p>Seleccioná la empresa con la que querés trabajar</p>
  </div>
  <div class="empresas-grid" id="empresas-grid"></div>
</div>

<!-- ══ SCREEN: LOGIN ══ -->
<div id="screen-login" class="screen">
  <div>
    <button class="btn btn-secondary btn-sm mb16" onclick="showScreen('empresas')" style="display:block;margin-bottom:20px">← Cambiar empresa</button>
    <div class="login-box">
      <div id="lt-logo-wrap" style="text-align:center;margin-bottom:14px;display:none">
        <img id="lt-logo" src="" style="height:80px;max-width:240px;object-fit:contain">
      </div>
      <div class="e-tag">
        <span id="lt-dot" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>
        <span id="lt-name"></span>
      </div>
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresá tus credenciales para continuar</p>
      <div class="fg"><label>Usuario</label><input id="l-user" placeholder="usuario" autocomplete="username"></div>
      <div class="fg"><label>Contraseña</label><input id="l-pass" type="password" placeholder="contraseña" autocomplete="current-password"></div>
      <p id="l-err" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none"></p>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Ingresar</button>
    </div>
  </div>
</div>

<!-- ══ SCREEN: APP ══ -->
<div id="screen-app" class="screen">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="logo" id="sb-logo-wrap"><span id="sb-logo-inner">📊</span></div>
      <div><div class="bn" id="sb-brand-name">SistemaGestión</div><div class="bs">Contable v2</div></div>
    </div>
    <div class="sb-empresa">
      <div class="e-chip" onclick="changeEmpresa()">
        <span class="dot" id="sb-dot"></span>
        <span class="e-chip-name" id="sb-ename"></span>
        <span style="color:var(--text3);font-size:11px">↔</span>
      </div>
    </div>
    <div class="sb-user">
      <div class="avatar" id="sb-avatar"></div>
      <div style="flex:1;overflow:hidden">
        <div class="u-name" id="sb-uname"></div>
        <div class="u-rol" id="sb-urol"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Cerrar sesión">⏻</button>
    </div>
    <nav class="nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="tb-left"><h2 id="tb-title">Inicio</h2><p id="tb-sub">Panel principal</p></div>
      <div class="tb-right">
        <button class="btn btn-secondary btn-sm" onclick="exportBackup()">⬇ Backup</button>
        <label class="btn btn-secondary btn-sm" style="cursor:pointer">⬆ Importar<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>
      </div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div id="overlay" class="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal-box">
    <div class="mh"><h3 id="m-title"></h3><button class="mcl" onclick="closeModal()">×</button></div>
    <div class="mb" id="m-body"></div>
    <div class="mf" id="m-foot"></div>
  </div>
</div>

<!-- ══ CONFIRM ══ -->
<div id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="c-title">¿Estás seguro?</h3>
    <p id="c-msg">Esta acción no se puede deshacer.</p>
    <div class="ca">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="c-ok">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite"></div>
  <p id="loading-msg" style="font-size:13px;color:var(--text2)">Cargando...</p>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtARS=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum=n=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().split('T')[0];
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().split('T')[0]};
const hashPwd=p=>{let h=0;for(const c of p){h=((h<<5)-h)+c.charCodeAt(0);h|=0}return h.toString(16)};
const COLORS=['#2563eb','#16a34a','#b45309','#dc2626','#7c3aed','#0891b2','#db2777','#059669'];
const ROLES={admin:'Administrador',operador:'Operador',lectura:'Solo lectura'};

// ═══════════════════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════════════════
const SB_URL = 'https://clejcbqlstrhmvadxsxk.supabase.co';
const SB_KEY = 'sb_publishable_CD15LcHHlalhnAq6fFoDYA_bf5pyo_S';

// Mapa: clave interna → nombre de tabla en Supabase
const TABLE_MAP = {
  empresas:        'empresas',
  usuarios:        'usuarios',
  rubros:          'rubros',
  formas_pago:     'formas_pago',
  bancos:          'bancos',
  clientes:        'clientes',
  proveedores:     'proveedores',
  productos_venta: 'productos_venta',
  productos_compra:'productos_compra',
  facturas_venta:  'facturas_venta',
  recibos_cobro:   'recibos_cobro',
  facturas_compra: 'facturas_compra',
  ordenes_pago:    'ordenes_pago',
  notas_credito:   'notas_credito',
};

// Campos snake_case ↔ camelCase por tabla
const FIELD_TO_DB = {
  clientes:        { condicionIva:'condicion_iva', condicionCobro:'condicion_cobro', diasVenc:'dias_venc', serviciosHabituales:'servicios_habituales', abonos:'abonos' },
  proveedores:     { rubroId:'rubro_id', condicionPago:'condicion_pago', diasVenc:'dias_venc' },
  productos_venta: { rubroId:'rubro_id' },
  productos_compra:{ rubroId:'rubro_id' },
  bancos:          { numeroCuenta:'numero_cuenta', saldoInicial:'saldo_inicial' },
  facturas_venta:  { clienteId:'cliente_id', formaPagoId:'forma_pago_id', fechaCobro:'fecha_cobro', fechaCreacion:'fecha_creacion' },
  facturas_compra: { proveedorId:'proveedor_id', rubroId:'rubro_id', formaPagoId:'forma_pago_id', nFP:'n_fp', fechaPago:'fecha_pago', fechaCreacion:'fecha_creacion' },
  recibos_cobro:   { clienteId:'cliente_id', formaPagoId:'forma_pago_id', facturaIds:'factura_ids', fechaCreacion:'fecha_creacion' },
  ordenes_pago:    { proveedorId:'proveedor_id', formaPagoId:'forma_pago_id', facturaIds:'factura_ids', fechaCreacion:'fecha_creacion' },
  notas_credito:   { clienteId:'cliente_id', proveedorId:'proveedor_id', facturaId:'factura_id', fechaCreacion:'fecha_creacion' },
  usuarios:        { empresaId:'empresa_id', empresasIds:'empresas_ids' },
};
const FIELD_FROM_DB = {};
Object.entries(FIELD_TO_DB).forEach(([tbl, map]) => {
  FIELD_FROM_DB[tbl] = {};
  Object.entries(map).forEach(([js, db]) => { FIELD_FROM_DB[tbl][db] = js; });
});

function toDB(tbl, obj) {
  const map = FIELD_TO_DB[tbl] || {};
  const out = {};
  Object.entries(obj).forEach(([k, v]) => {
    const dbKey = map[k] || k;
    out[dbKey] = v;
  });
  // empresa_id siempre presente para tablas que lo necesitan
  if (_empresa && TABLE_MAP[tbl] && tbl !== 'empresas') out.empresa_id = _empresa.id;
  return out;
}

function fromDB(tbl, row) {
  if (!row) return null;
  const map = FIELD_FROM_DB[tbl] || {};
  const out = {};
  Object.entries(row).forEach(([k, v]) => {
    const jsKey = map[k] || k;
    out[jsKey] = v;
  });
  return out;
}

// Headers comunes para todas las peticiones
function sbHeaders(extra={}) {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': `Bearer ${SB_KEY}`,
    'Prefer': 'return=representation',
    ...extra
  };
}

// ═══════════════════════════════════════════════════════════
// DB LAYER — Supabase REST API
// ═══════════════════════════════════════════════════════════
const DB = {
  // ── Cache en memoria para la sesión ──
  _cache: {},
  _cacheKey(eid, tbl) { return `${eid}__${tbl}`; },
  _setCache(eid, tbl, data) { DB._cache[DB._cacheKey(eid, tbl)] = data; },
  _getCache(eid, tbl) { return DB._cache[DB._cacheKey(eid, tbl)] || null; },
  _clearCache(eid, tbl) { delete DB._cache[DB._cacheKey(eid, tbl)]; },

  // ── Empresas ──
  async getEmpresas() {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/empresas?select=*&order=nombre`, { headers: sbHeaders() });
      const data = await r.json();
      if (!Array.isArray(data)) return [];
      return data.map(e => fromDB('empresas', e));
    } catch { return []; }
  },

  async saveEmpresa(obj) {
    const row = toDB('empresas', obj);
    delete row.empresa_id;
    try {
      await fetch(`${SB_URL}/rest/v1/empresas`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=representation' }),
        body: JSON.stringify(row)
      });
    } catch(e) { console.error('saveEmpresa', e); }
  },

  async updateEmpresa(obj) {
    const row = toDB('empresas', obj);
    delete row.empresa_id;
    try {
      await fetch(`${SB_URL}/rest/v1/empresas?id=eq.${obj.id}`, {
        method: 'PATCH',
        headers: sbHeaders(),
        body: JSON.stringify(row)
      });
    } catch(e) { console.error('updateEmpresa', e); }
  },

  async deleteEmpresa(id) {
    try {
      await fetch(`${SB_URL}/rest/v1/empresas?id=eq.${id}`, {
        method: 'DELETE', headers: sbHeaders()
      });
    } catch(e) { console.error('deleteEmpresa', e); }
  },

  // ── Genérico: getE, setE (upsert), deleteItem ──
  async getE(eid, tbl) {
    const cached = DB._getCache(eid, tbl);
    if (cached) return cached;
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?empresa_id=eq.${eid}&select=*`, { headers: sbHeaders() });
      if(!r.ok){
        // tabla no existe u otro error HTTP — log silencioso, devolver vacío
        console.warn('getE HTTP error', tbl, r.status);
        return [];
      }
      const data = await r.json();
      if (!Array.isArray(data)) return [];
      const mapped = data.map(row => fromDB(tbl, row));
      DB._setCache(eid, tbl, mapped);
      return mapped;
    } catch { return []; }
  },

  async setE(eid, tbl, items) {
    // Reemplaza la lista completa: borra todo y reinserta
    // Para rendimiento usamos upsert + delete de los que ya no están
    DB._setCache(eid, tbl, items);
    try {
      // Borra todos los registros de la empresa para esta tabla
      await fetch(`${SB_URL}/rest/v1/${tbl}?empresa_id=eq.${eid}`, {
        method: 'DELETE', headers: sbHeaders()
      });
      if (!items.length) return;
      // Inserta todos
      const rows = items.map(item => {
        const row = toDB(tbl, item);
        row.empresa_id = eid;
        return row;
      });
      await fetch(`${SB_URL}/rest/v1/${tbl}`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(rows)
      });
    } catch(e) { console.error('setE', tbl, e); }
  },

  // Upsert de un solo item (más eficiente que reescribir toda la tabla)
  async upsertItem(eid, tbl, item) {
    try {
      const row = toDB(tbl, item);
      row.empresa_id = eid;
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(row)
      });
      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('upsertItem HTTP error', tbl, r.status, errBody);
        toast('Error al guardar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('upsertItem', tbl, e); toast('Error de conexión al guardar','error'); return false; }
  },

  async deleteItem(eid, tbl, id) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?id=eq.${id}&empresa_id=eq.${eid}`, {
        method: 'DELETE', headers: sbHeaders()
      });
      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('deleteItem HTTP error', tbl, r.status, errBody);
        toast('Error al eliminar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('deleteItem', tbl, e); toast('Error de conexión al eliminar','error'); return false; }
  },

  async patchItem(eid, tbl, id, changes) {
    try {
      const row = toDB(tbl, changes);
      delete row.empresa_id;
      const r = await fetch(`${SB_URL}/rest/v1/${tbl}?id=eq.${id}&empresa_id=eq.${eid}`, {
        method: 'PATCH',
        headers: sbHeaders(),
        body: JSON.stringify(row)
      });
      if(!r.ok){
        const errBody = await r.text().catch(()=>'');
        console.error('patchItem HTTP error', tbl, r.status, errBody);
        toast('Error al actualizar ('+r.status+'): '+errBody.slice(0,120),'error');
        return false;
      }
      DB._clearCache(eid, tbl);
      return true;
    } catch(e) { console.error('patchItem', tbl, e); toast('Error de conexión','error'); return false; }
  },

  // ── Configuración ──
  async cfg(eid) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/configuracion?empresa_id=eq.${eid}&select=*`, { headers: sbHeaders() });
      const data = await r.json();
      if (Array.isArray(data) && data.length) return data[0].nums ? data[0] : { nums: data[0].nums || {FAC:1,REC:1,CMP:1,OP:1} };
      return { nums: {FAC:1,REC:1,CMP:1,OP:1} };
    } catch { return { nums: {FAC:1,REC:1,CMP:1,OP:1} }; }
  },

  async setCfg(eid, val) {
    try {
      await fetch(`${SB_URL}/rest/v1/configuracion`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ empresa_id: eid, nums: val.nums || val })
      });
    } catch(e) { console.error('setCfg', e); }
  },

  // ── Usuarios ──
  async getUsuarios(eid) {
    return await DB.getE(eid, 'usuarios');
  },

  async findUsuario(eid, usuario, pwd) {
    try {
      // Busca el usuario en la empresa actual O en cualquier empresa (para multi-empresa)
      const r = await fetch(
        `${SB_URL}/rest/v1/usuarios?usuario=eq.${encodeURIComponent(usuario)}&pwd=eq.${encodeURIComponent(pwd)}&activo=eq.true&select=*`,
        { headers: sbHeaders() }
      );
      const data = await r.json();
      if (!Array.isArray(data) || !data.length) return null;
      // Buscar el que tenga esta empresa habilitada
      for (const row of data) {
        const u = fromDB('usuarios', row);
        const ids = Array.isArray(u.empresasIds) ? u.empresasIds : (u.empresaId ? [u.empresaId] : []);
        if (u.empresaId === eid || ids.includes(eid)) return u;
      }
      return null;
    } catch { return null; }
  },
};

// ═══════════════════════════════════════════════════════════
// INIT EMPRESA
// ═══════════════════════════════════════════════════════════
const FP_DEF=[
  {tipo:'efectivo',nombre:'Efectivo'},{tipo:'transferencia',nombre:'Transferencia bancaria'},
  {tipo:'cheque_comun',nombre:'Cheque común'},{tipo:'cheque_diferido',nombre:'Cheque diferido'},
  {tipo:'tarjeta',nombre:'Tarjeta débito'},{tipo:'tarjeta',nombre:'Tarjeta crédito'},
  {tipo:'digital',nombre:'MercadoPago / CBU digital'},
];
const RUBROS_DEF=['Sueldos','Alquileres','Servicios','Honorarios','Mantenimiento','Impuestos','Varios'];

async function initEmpresa(eid){
  const fps=await DB.getE(eid,'formas_pago');
  if(!fps.length) await DB.setE(eid,'formas_pago',FP_DEF.map(f=>({...f,id:genId(),activo:true})));
  const rubs=await DB.getE(eid,'rubros');
  if(!rubs.length) await DB.setE(eid,'rubros',RUBROS_DEF.map(n=>({id:genId(),nombre:n,activo:true})));
  const cfg=await DB.cfg(eid);
  if(!cfg.nums) await DB.setCfg(eid,{nums:{FAC:1,REC:1,CMP:1,OP:1}});
  const users=await DB.getUsuarios(eid);
  if(!users.length) await DB.setE(eid,'usuarios',[{id:genId(),nombre:'Administrador',usuario:'admin',pwd:hashPwd('admin'),rol:'admin',activo:true,empresaId:eid}]);
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let _empresa=null,_user=null,_section='dashboard';

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg,type='info'){
  const icons={success:'✓',error:'✕',info:'i'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span style="font-weight:700">${icons[type]}</span><span>${esc(msg)}</span>`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

function showLoading(msg='Cargando...'){
  const el=document.getElementById('loading-overlay');
  document.getElementById('loading-msg').textContent=msg;
  el.style.display='flex';
}
function hideLoading(){
  document.getElementById('loading-overlay').style.display='none';
}

// ═══════════════════════════════════════════════════════════
// CONFIRM
// ═══════════════════════════════════════════════════════════
let _confirmCb=null;
function confirm(title,msg,cb){
  _confirmCb=cb;
  document.getElementById('c-title').textContent=title;
  document.getElementById('c-msg').textContent=msg||'Esta acción no se puede deshacer.';
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('open')}
document.getElementById('c-ok').onclick=()=>{closeConfirm();_confirmCb&&_confirmCb()};

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
function openModal(title,body,btns,large){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=body;
  document.getElementById('m-foot').innerHTML=(btns||[]).map(b=>`<button class="btn ${b.cls}" onclick="${b.fn}">${b.lbl}</button>`).join('');
  document.getElementById('modal-box').className='modal'+(large?' modal-lg':'');
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal()}

// SCREENS
// ═══════════════════════════════════════════════════════════
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

// ═══════════════════════════════════════════════════════════
// EMPRESA SELECTOR
// ═══════════════════════════════════════════════════════════
async function renderEmpresasScreen(){
  const g=document.getElementById('empresas-grid');
  if(!g) return;
  try {
    const list=await DB.getEmpresas();
    g.innerHTML=list.map(e=>`
      <div class="e-card" onclick="selectEmpresa('${e.id}')">
        ${e.logo?`<img src="${e.logo}" style="height:72px;max-width:180px;object-fit:contain;margin-bottom:8px">`:`<div class="e-dot" style="background:${e.color||'#2563eb'}"></div>`}
        <h3>${esc(e.nombre)}</h3>
        <p>${esc(e.cuit||'Sin CUIT')}</p>
      </div>
    `).join('')+`<div class="e-card new" onclick="openNuevaEmpresa()"><span style="font-size:26px">+</span><span style="font-size:13px">Nueva empresa</span></div>`;
  } catch(e) {
    console.error('renderEmpresasScreen error:', e);
    g.innerHTML=`<div class="e-card new" onclick="openNuevaEmpresa()"><span style="font-size:26px">+</span><span style="font-size:13px">Nueva empresa</span></div>`;
  }
}

function openNuevaEmpresa(){
  openModal('Nueva empresa',`
    <div class="fg"><label>Nombre / Razón Social *</label><input id="ne-n" placeholder="Nombre de la empresa"></div>
    <div class="row2">
      <div class="fg"><label>CUIT</label><input id="ne-cuit"></div>
      <div class="fg"><label>Dirección</label><input id="ne-dir"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Email</label><input id="ne-email" type="email"></div>
      <div class="fg"><label>Teléfono</label><input id="ne-tel"></div>
    </div>
    <div class="fg"><label>Color</label>
      <div class="color-opts">${COLORS.map((c,i)=>`<div class="cswatch${i===0?' sel':''}" style="background:${c}" onclick="pickColor(this,'ne-color','${c}')"></div>`).join('')}</div>
      <input type="hidden" id="ne-color" value="${COLORS[0]}">
    </div>
    <p style="font-size:12px;color:var(--text2);margin-top:12px">Usuario inicial: <strong>admin</strong> / contraseña: <strong>admin</strong></p>
  `,[
    {lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},
    {lbl:'Crear empresa',cls:'btn-primary',fn:'saveNuevaEmpresa()'}
  ]);

}

function pickColor(el,hiddenId,color){
  document.querySelectorAll('.cswatch').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById(hiddenId).value=color;
}

async function saveNuevaEmpresa(){
  const nombre=document.getElementById('ne-n').value.trim();
  if(!nombre){toast('El nombre es obligatorio','error');return}
  const e={id:genId(),nombre,cuit:document.getElementById('ne-cuit').value.trim(),
    direccion:document.getElementById('ne-dir').value.trim(),
    email:document.getElementById('ne-email').value.trim(),
    telefono:document.getElementById('ne-tel').value.trim(),
    color:document.getElementById('ne-color').value};
  showLoading('Creando empresa...');
  await DB.saveEmpresa(e);
  await initEmpresa(e.id);
  hideLoading();
  closeModal();
  toast(`Empresa "${nombre}" creada`,'success');
  await renderEmpresasScreen();
  selectEmpresa(e.id);
}

async function selectEmpresa(id){
  showLoading('Cargando empresa...');
  const list=await DB.getEmpresas();
  _empresa=list.find(e=>e.id===id);
  if(!_empresa){hideLoading();return}
  await initEmpresa(id);
  hideLoading();
  document.getElementById('lt-dot').style.background=_empresa.color||'#2563eb';
  document.getElementById('lt-name').textContent=_empresa.nombre;
  document.getElementById('l-user').value='';
  document.getElementById('l-pass').value='';
  document.getElementById('l-err').style.display='none';
  // Mostrar logo en pantalla de login
  const ltLogo=document.getElementById('lt-logo');
  const ltLogoWrap=document.getElementById('lt-logo-wrap');
  if(_empresa.logo){ltLogo.src=_empresa.logo;ltLogoWrap.style.display='block';}
  else{ltLogoWrap.style.display='none';}
  showScreen('login');
  setTimeout(()=>document.getElementById('l-user').focus(),80);
}

// ═══════════════════════════════════════════════════════════
// LOGIN / LOGOUT
// ═══════════════════════════════════════════════════════════
async function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  showLoading('Verificando...');
  const found=await DB.findUsuario(_empresa.id,u,hashPwd(p));
  hideLoading();
  if(!found){err.textContent='Usuario o contraseña incorrectos';err.style.display='block';return}
  err.style.display='none';
  _user=found;
  loadApp();
}
document.getElementById('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function doLogout(){_user=null;showScreen('login')}
async function changeEmpresa(){_user=null;_empresa=null;await renderEmpresasScreen();showScreen('empresas')}

// LOAD APP
// ═══════════════════════════════════════════════════════════
function loadApp(){
  document.getElementById('sb-dot').style.background=_empresa.color;
  document.getElementById('sb-ename').textContent=_empresa.nombre;
  document.getElementById('sb-avatar').textContent=_user.nombre[0].toUpperCase();
  document.getElementById('sb-uname').textContent=_user.nombre;
  document.getElementById('sb-urol').textContent=ROLES[_user.rol]||_user.rol;
  // Logo en sidebar
  const sbLogoWrap=document.getElementById('sb-logo-wrap');
  const sbLogoInner=document.getElementById('sb-logo-inner');
  const sbBrandName=document.getElementById('sb-brand-name');
  if(_empresa.logo){
    sbLogoWrap.style.cssText='width:auto;height:48px;background:none;border-radius:0;padding:0;flex-shrink:0';
    sbLogoInner.innerHTML='<img src="'+_empresa.logo+'" style="height:48px;max-width:140px;object-fit:contain">';
    sbBrandName.textContent=_empresa.nombre;
  } else {
    sbLogoWrap.style.cssText='';
    sbLogoInner.textContent='📊';
    sbBrandName.textContent='SistemaGestión';
  }
  renderNav();
  showScreen('app');
  navTo('dashboard');
}

async function navTo(sec){

// ─── actualizar abonos globalmente ──────────────────────
async function actualizarAbonosGlobal(){
  const pct=parseFloat(prompt('¿En qué porcentaje actualizar los abonos? (ej: 15 para +15%):'));
  if(isNaN(pct)||pct===null)return;
  const factor=1+pct/100;
  const eid=_empresa.id;
  showLoading('Actualizando abonos...');
  const clientes=await DB.getE(eid,'clientes');
  let updated=0;
  for(const cl of clientes){
    if(!cl.activo||!cl.abonos||!cl.abonos.length)continue;
    const newAbonos=cl.abonos.map(a=>({...a,precio:Math.round(a.precio*factor*100)/100}));
    await DB.upsertItem(eid,'clientes',{...cl,abonos:newAbonos});
    updated++;
  }
  DB._clearCache(eid,'clientes');
  hideLoading();
  toast(`Abonos actualizados en ${updated} cliente${updated!==1?'s':''} (${pct>0?'+':''}${pct}%)  ✓`,'success');
}

// ─── actualizar precios productos venta ──────────────────
async function actualizarPreciosVenta(){
  const pct=parseFloat(prompt('¿En qué porcentaje actualizar los precios de venta? (ej: 15 para +15%):'));
  if(isNaN(pct)||pct===null)return;
  const factor=1+pct/100;
  const eid=_empresa.id;
  showLoading('Actualizando precios...');
  const prods=await DB.getE(eid,'productos_venta');
  let updated=0;
  for(const p of prods){
    if(!p.activo)continue;
    const newPrecio=Math.round(p.precio*factor*100)/100;
    await DB.upsertItem(eid,'productos_venta',{...p,precio:newPrecio});
    updated++;
  }
  DB._cache[eid+':productos_venta']=null;
  hideLoading();
  toast(`Precios actualizados en ${updated} producto${updated!==1?'s':''} (${pct>0?'+':''}${pct}%)  ✓`,'success');
  renderProductos('prod-venta');
}

async function renderConfig(){
  const e=_empresa;
  const cfg=await DB.cfg(e.id);
  const nums=cfg.nums||{FAC:1,REC:1,CMP:1,OP:1};
  document.getElementById('main-content').innerHTML=`
    <div style="max-width:580px">
      <div class="card mb16">
        <h3 class="fw6 mb16" style="font-size:14px">Datos de la empresa</h3>
        <div class="fg"><label>Nombre / Razón Social *</label><input id="ec-n" value="${esc(e.nombre)}"></div>
        <div class="row2">
          <div class="fg"><label>CUIT</label><input id="ec-cuit" value="${esc(e.cuit||'')}"></div>
          <div class="fg"><label>Dirección</label><input id="ec-dir" value="${esc(e.direccion||'')}"></div>
        </div>
        <div class="row2">
          <div class="fg"><label>Email</label><input id="ec-email" type="email" value="${esc(e.email||'')}"></div>
          <div class="fg"><label>Teléfono</label><input id="ec-tel" value="${esc(e.telefono||'')}"></div>
        </div>
        <div class="fg"><label>Color</label>
          <div class="color-opts">${COLORS.map(c=>`<div class="cswatch${e.color===c?' sel':''}" style="background:${c}" onclick="pickColor(this,'ec-color','${c}')"></div>`).join('')}</div>
          <input type="hidden" id="ec-color" value="${e.color}">
        </div>
        <div class="fg"><label>Logo de la empresa</label>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            ${e.logo?`<img id="logo-preview" src="${e.logo}" style="height:48px;max-width:180px;object-fit:contain;border:1px solid var(--border);border-radius:6px;padding:4px">`
              :`<div id="logo-preview" style="height:48px;width:120px;border:1px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2)">Sin logo</div>`}
            ${e.logo?`<button class="btn btn-ghost btn-sm" onclick="clearLogo()">🗑️ Quitar</button>`:''}
          </div>
          <input type="file" id="ec-logo" accept="image/*" style="font-size:12px" onchange="previewLogo(this)">
          <input type="hidden" id="ec-logo-data" value="${e.logo||''}">
          <p style="font-size:11px;color:var(--text2);margin-top:4px">PNG, JPG o SVG. Se usará en comprobantes y en la pantalla de selección.</p>
        </div>
        <button class="btn btn-primary" onclick="saveEmpresaConfig()">Guardar datos</button>
      </div>
      <div class="card mb16">
        <h3 class="fw6 mb4" style="font-size:14px">Numeración de comprobantes</h3>
        <p style="font-size:12px;color:var(--text2);margin-bottom:16px">Próximo número a usar en cada serie</p>
        <div class="row2">
          <div class="fg"><label>Facturas venta (FAC)</label><input id="num-fac" type="number" min="1" value="${nums.FAC}"></div>
          <div class="fg"><label>Recibos cobro (REC)</label><input id="num-rec" type="number" min="1" value="${nums.REC}"></div>
        </div>
        <div class="row2">
          <div class="fg"><label>Facturas compra (CMP)</label><input id="num-cmp" type="number" min="1" value="${nums.CMP}"></div>
          <div class="fg"><label>Órdenes de pago (OP)</label><input id="num-op" type="number" min="1" value="${nums.OP}"></div>
        </div>
        <button class="btn btn-primary" onclick="saveNums()">Guardar numeraciones</button>
      </div>
      <div class="card">
        <h3 class="fw6 mb4" style="font-size:14px;color:var(--red)">Zona de peligro</h3>
        <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Esta acción es irreversible</p>
        <button class="btn btn-danger" onclick="delEmpresa()">🗑️ Eliminar empresa y todos sus datos</button>
      </div>
    </div>`;
}
function previewLogo(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('ec-logo-data').value=e.target.result;
    const p=document.getElementById('logo-preview');
    if(p.tagName==='IMG')p.src=e.target.result;
    else{const img=document.createElement('img');img.id='logo-preview';img.src=e.target.result;img.style='height:48px;max-width:180px;object-fit:contain;border:1px solid var(--border);border-radius:6px;padding:4px';p.replaceWith(img);}
  };
  reader.readAsDataURL(file);
}
function clearLogo(){
  document.getElementById('ec-logo-data').value='';
  const p=document.getElementById('logo-preview');
  if(p){const d=document.createElement('div');d.id='logo-preview';d.style='height:48px;width:120px;border:1px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2)';d.textContent='Sin logo';p.replaceWith(d);}
}
async function saveEmpresaConfig(){
  const nombre=document.getElementById('ec-n').value.trim();
  if(!nombre){toast('Nombre obligatorio','error');return}
  const upd={..._empresa,nombre,cuit:document.getElementById('ec-cuit').value.trim(),
    direccion:document.getElementById('ec-dir').value.trim(),email:document.getElementById('ec-email').value.trim(),
    telefono:document.getElementById('ec-tel').value.trim(),color:document.getElementById('ec-color').value,
    logo:document.getElementById('ec-logo-data').value||_empresa.logo||''};
  showLoading('Guardando...');
  await DB.updateEmpresa(upd);
  hideLoading();
  _empresa=upd;
  document.getElementById('sb-dot').style.background=upd.color;
  document.getElementById('sb-ename').textContent=upd.nombre;
  toast('Configuración guardada','success');
}
async function saveNums(){
  const cfg=await DB.cfg(_empresa.id);
  const nums={FAC:+document.getElementById('num-fac').value||1,REC:+document.getElementById('num-rec').value||1,
    CMP:+document.getElementById('num-cmp').value||1,OP:+document.getElementById('num-op').value||1};
  await DB.setCfg(_empresa.id,{nums});toast('Numeraciones guardadas','success');
}
async function delEmpresa(){
  confirm('¿Eliminar empresa?','Se eliminarán TODOS los datos. Acción irreversible.',async()=>{
    showLoading('Eliminando empresa...');
    await DB.deleteEmpresa(_empresa.id);
    hideLoading();
    toast('Empresa eliminada','success');
    await changeEmpresa();
  });
}

let _fvQ='';
async function renderVentas(){
  const eid=_empresa.id;
  const fv=await DB.getE(eid,'facturas_venta');
  const cl=await DB.getE(eid,'clientes');
  const q=_fvQ.toLowerCase();
  const f=q?fv.filter(x=>{const c=cl.find(c=>c.id===x.clienteId);return x.numero.toLowerCase().includes(q)||(c&&c.nombre.toLowerCase().includes(q))}):fv;
  document.getElementById('main-content').innerHTML=`
    <div class="toolbar">
      <div class="toolbar-l">
        <div class="sw"><span class="si">🔍</span><input value="${esc(_fvQ)}" placeholder="Buscar factura o cliente..." oninput="_fvQ=this.value;renderVentas()" style="width:240px;padding-left:32px"></div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="navTo('clientes')">👥 Clientes</button>
      <button class="btn btn-primary btn-sm" onclick="openFVModal()">+ Nueva factura</button>
    </div>
    ${f.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th class="td-r">Total</th><th>Estado</th><th></th></tr></thead><tbody>
    ${[...f].reverse().map(fac=>{
      const c=cl.find(x=>x.id===fac.clienteId);
      const venc=fac.vencimiento&&fac.estado!=='cobrada'&&fac.vencimiento<today();
      const estBadge=fac.estado==='cobrada'?'badge-green':venc?'badge-red':'badge-yellow';
      const estLbl=fac.estado==='cobrada'?'Cobrada':venc?'Vencida':'Pendiente';
      return`<tr>
        <td class="td-mono">${esc(fac.numero)}</td>
        <td>${esc(fac.fecha)}</td>
        <td>${c?esc(c.nombre):'—'}</td>
        <td><span class="badge ${fac.tipo==='cc'?'badge-yellow':'badge-blue'}">${fac.tipo==='cc'?'Cta. Cte.':'Contado'}</span></td>
        <td class="td-mono td-r">${fmtARS(fac.total)}</td>
        <td><span class="badge ${estBadge}">${estLbl}</span></td>
        <td><div class="td-act">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="verFV('${fac.id}')">👁️</button>
          ${fac.tipo==='cc'&&fac.estado!=='cobrada'?`<button class="btn btn-ghost btn-sm btn-icon" onclick="abrirReciboRapido('${fac.id}')" title="Registrar cobro">💵</button>`:''}
          ${fac.tipo==='cc'?`<button class="btn btn-ghost btn-sm btn-icon" onclick="abrirNotaCreditoCliente('${fac.clienteId}')" title="Nota de crédito">📝</button>`:''}
          <button class="btn btn-ghost btn-sm btn-icon" onclick="delItem('facturas_venta','${fac.id}',renderVentas)">🗑️</button>
        </div></td>
      </tr>`}).join('')}
    </tbody></table></div>
    <p class="text-muted" style="font-size:12px;margin-top:10px">${f.length} factura${f.length!==1?'s':''} · Total: <strong>${fmtARS(f.reduce((s,x)=>s+x.total,0))}</strong></p>`
    :`<div class="empty"><div class="ei">💰</div><h3>Sin facturas</h3><p>Emití la primera factura de venta</p></div>`}`;
}

let _fvLineas=[];
async function openFVModal(){
  const eid=_empresa.id;
  const clientes=(await DB.getE(eid,'clientes')).filter(x=>x.activo);
  const fps=(await DB.getE(eid,'formas_pago')).filter(x=>x.activo);
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{FAC:1};
  const numero=`FAC-${String(nums.FAC).padStart(5,'0')}`;
  _fvLineas=[{id:genId(),desc:'',cantidad:1,precio:0}];
  openModal('Nueva factura de venta',`
    <div class="row2">
      <div class="fg"><label>N° Factura</label><input value="${numero}" readonly></div>
      <div class="fg"><label>Fecha *</label><input id="fv-f" type="date" value="${today()}"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Cliente *</label><select id="fv-cl" onchange="fvOnClienteChange()"><option value="">Seleccioná...</option>${clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>
      <div class="fg"><label>Tipo</label><select id="fv-tipo" onchange="fvOnTipoChange()"><option value="cc">Cuenta Corriente</option><option value="contado">Contado</option></select></div>
    </div>
    <div id="fv-venc-row" class="fg"><label>Fecha de vencimiento</label><input id="fv-venc" type="date" value="${addDays(today(),30)}"></div>
    <div id="fv-fp-row" class="fg" style="display:none"><label>Forma de cobro</label><select id="fv-fp"><option value="">Seleccioná...</option>${fps.map(fp=>`<option value="${fp.id}">${esc(fp.nombre)}</option>`).join('')}</select></div>
    <div class="divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong style="font-size:13px">Detalle</strong>
      <button class="btn btn-secondary btn-sm" onclick="fvAddLinea()">+ Línea</button>
    </div>
    <div style="display:grid;grid-template-columns:2fr 70px 110px 90px 28px;gap:5px;margin-bottom:5px">
      ${['Descripción','Cant.','Precio','Subtotal',''].map(h=>`<span style="font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase">${h}</span>`).join('')}
    </div>
    <div id="fv-lineas"></div>
    <div style="text-align:right;font-weight:600;font-size:15px;margin-top:10px">Total: <span id="fv-total" style="font-family:var(--mono)">$ 0,00</span></div>
    <div class="divider"></div>
    <div class="fg"><label>Observaciones</label><textarea id="fv-obs" rows="2"></textarea></div>
  `,[{lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},{lbl:'Emitir factura',cls:'btn-primary',fn:'saveFV()'}],true);
  fvRenderLineas();
}
function fvOnTipoChange(){
  const cc=document.getElementById('fv-tipo').value==='cc';
  document.getElementById('fv-venc-row').style.display=cc?'':'none';
  document.getElementById('fv-fp-row').style.display=cc?'none':'';
}
async function fvOnClienteChange(){
  const eid=_empresa.id;
  const cid=document.getElementById('fv-cl').value;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===cid);
  if(cl&&document.getElementById('fv-tipo').value==='cc'){
    document.getElementById('fv-venc').value=addDays(document.getElementById('fv-f').value,cl.diasVenc||30);
  }
}
async function fvAddLinea(){
  _fvLineas.push({id:genId(),desc:'',cantidad:1,precio:0});
  fvRenderLineas();
}
async function fvRemoveLinea(id){
  _fvLineas=_fvLineas.filter(x=>x.id!==id);
  fvRenderLineas();
}
async function fvUpdateLinea(id,field,val){
  const ln=_fvLineas.find(x=>x.id===id);if(!ln)return;
  if(field==='cantidad'||field==='precio')ln[field]=parseFloat(val)||0;
  else{
    ln[field]=val;
    if(field==='desc'&&ln.precio===0){
      const eid=_empresa.id;
      const prod=(await DB.getE(eid,'productos_venta')).find(p=>p.descripcion.toLowerCase()===val.toLowerCase());
      if(prod){ln.precio=prod.precio;fvRenderLineas();return}
    }
  }
  fvUpdateTotal();
}
async function fvRenderLineas(){
  const eid=_empresa.id;
  const prods=(await DB.getE(eid,'productos_venta')).filter(x=>x.activo);
  const cont=document.getElementById('fv-lineas');if(!cont)return;
  cont.innerHTML=_fvLineas.map(ln=>`
    <div style="display:grid;grid-template-columns:2fr 70px 110px 90px 28px;gap:5px;margin-bottom:5px;align-items:center">
      <div><input value="${esc(ln.desc)}" placeholder="Concepto..." oninput="fvUpdateLinea('${ln.id}','desc',this.value)" list="fv-prods" style="padding:7px 9px"></div>
      <div><input type="number" value="${ln.cantidad}" min="0.01" step="0.01" oninput="fvUpdateLinea('${ln.id}','cantidad',this.value)" style="text-align:right;padding:7px 9px"></div>
      <div><input type="number" value="${ln.precio}" min="0" step="0.01" oninput="fvUpdateLinea('${ln.id}','precio',this.value)" style="text-align:right;padding:7px 9px"></div>
      <div><input value="${fmtNum(ln.cantidad*ln.precio)}" readonly style="text-align:right;padding:7px 9px;background:var(--surface2);font-family:var(--mono);font-size:12px"></div>
      <button class="btn btn-ghost btn-icon" onclick="fvRemoveLinea('${ln.id}')" style="padding:4px 6px;font-size:12px">✕</button>
    </div>
  `).join('')+`<datalist id="fv-prods">${prods.map(p=>`<option value="${esc(p.descripcion)}">`).join('')}</datalist>`;
  fvUpdateTotal();
}
function fvUpdateTotal(){
  const t=_fvLineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
  const el=document.getElementById('fv-total');if(el)el.textContent=fmtARS(t);
}
async function saveFV(){
  const eid=_empresa.id;
  const clienteId=document.getElementById('fv-cl').value;
  if(!clienteId){toast('Seleccioná un cliente','error');return}
  const tipo=document.getElementById('fv-tipo').value;
  const lineas=_fvLineas.filter(l=>l.desc||l.precio>0);
  if(!lineas.length){toast('Agregá al menos una línea','error');return}
  const total=lineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{FAC:1};
  const numero=`FAC-${String(nums.FAC).padStart(5,'0')}`;
  nums.FAC++;await DB.setCfg(eid,{nums});
  const fac={id:genId(),numero,fecha:document.getElementById('fv-f').value,clienteId,tipo,total,lineas,
    vencimiento:tipo==='cc'?document.getElementById('fv-venc').value:null,
    formaPagoId:tipo==='contado'?document.getElementById('fv-fp').value:null,
    observaciones:document.getElementById('fv-obs').value.trim(),
    estado:tipo==='contado'?'cobrada':'pendiente',fechaCreacion:new Date().toISOString()};
  showLoading('Guardando factura...');
  await DB.upsertItem(eid,'facturas_venta',fac);
  hideLoading();
  closeModal();toast(`Factura ${numero} emitida`,'success');renderVentas();
}
async function verFV(id){
  const eid=_empresa.id;
  const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===id);if(!fac)return;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===fac.clienteId);
  const venc=fac.vencimiento&&fac.estado!=='cobrada'&&fac.vencimiento<today();
  openModal(`Factura ${fac.numero}`,`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px">${esc(_empresa.nombre||'')}</div>
        ${_empresa.cuit?`<div style="font-size:11px;color:var(--text2)">CUIT: ${esc(_empresa.cuit)}</div>`:''}
      </div>
      ${_empresa.logo?`<img src="${_empresa.logo}" style="height:70px;max-width:200px;object-fit:contain">`:''}
    </div>
    <div class="detail-grid">
      <div><div class="dl">Cliente</div><div class="dv">${cl?esc(cl.nombre):'—'}</div></div>
      <div><div class="dl">Fecha</div><div class="dv">${esc(fac.fecha)}</div></div>
      <div><div class="dl">Tipo</div><div class="dv"><span class="badge ${fac.tipo==='cc'?'badge-yellow':'badge-blue'}">${fac.tipo==='cc'?'Cta. Cte.':'Contado'}</span></div></div>
      <div><div class="dl">Estado</div><div class="dv"><span class="badge ${fac.estado==='cobrada'?'badge-green':venc?'badge-red':'badge-yellow'}">${fac.estado==='cobrada'?'Cobrada':venc?'Vencida':'Pendiente'}</span></div></div>
      ${fac.vencimiento?`<div><div class="dl">Vencimiento</div><div class="dv">${esc(fac.vencimiento)}</div></div>`:''}
    </div>
    <div class="tw"><table><thead><tr><th>Descripción</th><th class="td-r">Cant.</th><th class="td-r">Precio</th><th class="td-r">Subtotal</th></tr></thead>
    <tbody>
      ${(fac.lineas||[]).map(l=>`<tr><td>${esc(l.desc)}</td><td class="td-mono td-r">${l.cantidad}</td><td class="td-mono td-r">${fmtARS(l.precio)}</td><td class="td-mono td-r"><strong>${fmtARS(l.cantidad*l.precio)}</strong></td></tr>`).join('')}
      <tr><td colspan="3" style="text-align:right;font-weight:600;padding-top:12px">TOTAL</td><td class="td-mono td-r" style="font-weight:700;font-size:15px">${fmtARS(fac.total)}</td></tr>
    </tbody></table></div>
    ${fac.observaciones?`<p style="margin-top:12px;font-size:12px;color:var(--text2)">${esc(fac.observaciones)}</p>`:''}
  `,[
    {lbl:'Cerrar',cls:'btn-secondary',fn:'closeModal()'},
    {lbl:'🖨️ Imprimir',cls:'btn-secondary',fn:`imprimirComprobante('fv','${fac.id}')`},
    ...(fac.tipo==='cc'&&fac.estado!=='cobrada'?[{lbl:'💵 Registrar cobro',cls:'btn-primary',fn:`closeModal();abrirReciboRapido('${fac.id}')`}]:[])
  ],true);
}

// ═══════════════════════════════════════════════════════════
// RECIBOS DE COBRO (registro rápido)
// ═══════════════════════════════════════════════════════════
async function abrirReciboRapido(facId){
  const eid=_empresa.id;
  const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===facId);if(!fac)return;
  const cl=(await DB.getE(eid,'clientes')).find(x=>x.id===fac.clienteId);
  const fps=(await DB.getE(eid,'formas_pago')).filter(x=>x.activo);
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{REC:1};
  const numero=`REC-${String(nums.REC).padStart(5,'0')}`;
  openModal('Registrar cobro',`
    <div class="row2">
      <div class="fg"><label>N° Recibo</label><input value="${numero}" readonly></div>
      <div class="fg"><label>Fecha de cobro</label><input id="rc-f" type="date" value="${today()}"></div>
    </div>
    <div class="fg"><label>Cliente</label><input value="${cl?esc(cl.nombre):'—'}" readonly></div>
    <div class="fg"><label>Factura aplicada</label><input value="${fac.numero} · ${fmtARS(fac.total)}" readonly></div>
    <div class="row2">
      <div class="fg"><label>Importe cobrado *</label><input id="rc-imp" type="number" step="0.01" value="${fac.total}"></div>
      <div class="fg"><label>Forma de cobro *</label><select id="rc-fp"><option value="">Seleccioná...</option>${fps.map(fp=>`<option value="${fp.id}">${esc(fp.nombre)}</option>`).join('')}</select></div>
    </div>
    <div class="fg"><label>Observaciones</label><textarea id="rc-obs" rows="2"></textarea></div>
  `,[
    {lbl:'Cancelar',cls:'btn-secondary',fn:'closeModal()'},
    {lbl:'Confirmar cobro',cls:'btn-primary',fn:`saveReciboRapido('${facId}')`}
  ]);
}
async function saveReciboRapido(facId){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('rc-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('rc-fp').value;
  if(!fpId){toast('Seleccioná una forma de cobro','error');return}
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{REC:1};
  const numero=`REC-${String(nums.REC).padStart(5,'0')}`;
  nums.REC++;await DB.setCfg(eid,{...cfg,nums});
  const fac=(await DB.getE(eid,'facturas_venta')).find(x=>x.id===facId);
  const recibo={id:genId(),numero,fecha:document.getElementById('rc-f').value,
    clienteId:fac.clienteId,importe,formaPagoId:fpId,facturaIds:[facId],
    observaciones:document.getElementById('rc-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  const recibos=await DB.getE(eid,'recibos_cobro');recibos.push(recibo);
  await DB.setE(eid,'recibos_cobro',recibos);
  // marcar factura cobrada
  let fvs=await DB.getE(eid,'facturas_venta');
  fvs=fvs.map(f=>f.id===facId?{...f,estado:'cobrada',fechaCobro:recibo.fecha}:f);
  await DB.setE(eid,'facturas_venta',fvs);
  closeModal();toast(`Cobro registrado · ${numero}`,'success');renderVentas();
}

async function renderFacMasiva(){
  const eid=_empresa.id;
  const allCls=await DB.getE(eid,'clientes');
  const clientes=allCls.filter(x=>x.activo&&((x.abonos&&x.abonos.length)||(x.serviciosHabituales&&x.serviciosHabituales.length)));
  // helper: obtener lineas de abono del cliente (abonos tiene prioridad, fallback a serviciosHabituales)
  const getAbonos=cl=>(cl.abonos&&cl.abonos.length)?cl.abonos:(cl.serviciosHabituales||[]);
  if(!clientes.length){
    document.getElementById('main-content').innerHTML=`<div class="empty"><div class="ei">📋</div><h3>Sin clientes con abonos</h3><p>Asigná abonos mensuales a los clientes activos para usar la facturación masiva</p><br><button class="btn btn-primary" onclick="navTo('clientes')">Ir a Clientes</button></div>`;
    return;
  }
  // render
  document.getElementById('main-content').innerHTML=`
    <div class="card">
      <h3 class="fw6 mb8" style="font-size:14px">Facturación masiva mensual</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:16px">Revisá y confirmá las facturas a generar</p>
      <div class="row2 mb16">
        <div class="fg"><label>Fecha de emisión</label><input id="fm-fecha" type="date" value="${today()}"></div>
      </div>
      <div class="tw mb16"><table><thead><tr><th><input type="checkbox" id="fm-all" onchange="fmToggleAll(this)"></th><th>Cliente</th><th>Servicios</th><th class="td-r">Total</th></tr></thead>
      <tbody id="fm-tbody">
        ${clientes.map(cl=>{
          const abs=getAbonos(cl);
          const sub=abs.reduce((s,sv)=>s+(sv.precio*sv.cantidad),0);
          return`<tr>
            <td><input type="checkbox" class="fm-ck" value="${cl.id}" checked></td>
            <td>${esc(cl.nombre)}</td>
            <td>${abs.map(s=>`${esc(s.descripcion)} x${s.cantidad}`).join(', ')}</td>
            <td class="td-mono td-r">${fmtARS(sub)}</td>
          </tr>`;
        }).join('')}
      </tbody></table></div>
      <button class="btn btn-primary" onclick="ejecutarFacMasiva()">✓ Generar facturas</button>
    </div>`;
  document.getElementById('fm-all').checked=true;
}
function fmToggleAll(cb){document.querySelectorAll('.fm-ck').forEach(x=>x.checked=cb.checked)}
async function ejecutarFacMasiva(){
  const eid=_empresa.id;
  const fecha=document.getElementById('fm-fecha').value;
  const selected=[...document.querySelectorAll('.fm-ck:checked')].map(x=>x.value);
  if(!selected.length){toast('Seleccioná al menos un cliente','error');return}
  const clientes=(await DB.getE(eid,'clientes')).filter(x=>selected.includes(x.id));
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{FAC:1};
  let fvs=await DB.getE(eid,'facturas_venta');let count=0;
  clientes.forEach(cl=>{
    const _abs=(cl.abonos&&cl.abonos.length)?cl.abonos:(cl.serviciosHabituales||[]);
    const lineas=_abs.map(s=>({id:genId(),desc:s.descripcion,cantidad:s.cantidad,precio:s.precio}));
    const total=lineas.reduce((s,l)=>s+(l.cantidad*l.precio),0);
    const numero=`FAC-${String(nums.FAC).padStart(5,'0')}`;nums.FAC++;count++;
    fvs.push({id:genId(),numero,fecha,clienteId:cl.id,tipo:cl.condicionCobro,
      vencimiento:cl.condicionCobro==='cc'?addDays(fecha,cl.diasVenc||30):null,
      total,lineas,estado:cl.condicionCobro==='contado'?'cobrada':'pendiente',
      fechaCreacion:new Date().toISOString()});
  });
  await DB.setCfg(eid,{...cfg,nums});await DB.setE(eid,'facturas_venta',fvs);
  toast(`${count} factura${count!==1?'s':''} generada${count!==1?'s':''}  ✓`,'success');
  navTo('ventas');
}

  const fvCob=(await DB.getE(eid,'facturas_venta')).filter(x=>x.tipo==='contado'&&x.estado==='cobrada');
  const fcPag=(await DB.getE(eid,'facturas_compra')).filter(x=>x.tipo==='contado'&&x.estado==='pagada');
  const fps=await DB.getE(eid,'formas_pago');
  const bancos=(await DB.getE(eid,'bancos')).filter(x=>x.activo);
  const clientes=await DB.getE(eid,'clientes');
  const proveedores=await DB.getE(eid,'proveedores');

  // Movimientos: unificamos todo en una lista con bancoId
  const movs=[];
  recCob.forEach(r=>movs.push({fecha:r.fecha,tipo:'Cobro',subtipo:'Cobro cliente',numero:r.numero,importe:r.importe,dir:'in',fpId:r.formaPagoId,bancoId:r.bancoId||'',ref:r.clienteId,entidad:clientes.find(x=>x.id===r.clienteId)}));
  fvCob.forEach(f=>movs.push({fecha:f.fecha,tipo:'Cobro',subtipo:'Venta contado',numero:f.numero,importe:f.total,dir:'in',fpId:f.formaPagoId,bancoId:f.bancoId||'',ref:f.clienteId,entidad:clientes.find(x=>x.id===f.clienteId)}));
  ordPago.forEach(o=>movs.push({fecha:o.fecha,tipo:'Pago',subtipo:'Pago proveedor',numero:o.numero,importe:o.importe,dir:'out',fpId:o.formaPagoId,bancoId:o.bancoId||'',ref:o.proveedorId,entidad:proveedores.find(x=>x.id===o.proveedorId)}));
  fcPag.forEach(f=>movs.push({fecha:f.fecha,tipo:'Pago',subtipo:'Compra contado',numero:f.numero,importe:f.total,dir:'out',fpId:f.formaPagoId,bancoId:f.bancoId||'',ref:f.proveedorId,entidad:proveedores.find(x=>x.id===f.proveedorId)}));
  movs.sort((a,b)=>a.fecha>b.fecha?-1:1);

  // Aplicar filtros
  var movsFilt=movs.filter(function(m){
    if(_tesDesde&&m.fecha<_tesDesde)return false;
    if(_tesHasta&&m.fecha>_tesHasta)return false;
    if(_tesBanco&&m.bancoId!==_tesBanco)return false;
    if(_tesFP&&m.fpId!==_tesFP)return false;
    if(_tesTipo&&m.tipo!==_tesTipo)return false;
    return true;
  });

  const totalIn=movsFilt.filter(m=>m.dir==='in').reduce((s,m)=>s+m.importe,0);
  const totalOut=movsFilt.filter(m=>m.dir==='out').reduce((s,m)=>s+m.importe,0);
  const saldo=totalIn-totalOut;

  // Proyección: facturas CC pendientes
  const fvPend=(await DB.getE(eid,'facturas_venta')).filter(f=>f.tipo==='cc'&&f.estado!=='cobrada');
  const fcPend=(await DB.getE(eid,'facturas_compra')).filter(f=>f.tipo==='cc'&&f.estado!=='pagada');

  var bancosOpts=bancos.map(function(b){return '<option value="'+b.id+'"'+(_tesBanco===b.id?' selected':'')+'>'+esc(b.nombre)+'</option>';}).join('');
  var fpOpts=fps.map(function(fp){return '<option value="'+fp.id+'"'+(_tesFP===fp.id?' selected':'')+'>'+esc(fp.nombre)+'</option>';}).join('');

  var movRows=movsFilt.map(function(m){
    var fp=fps.find(x=>x.id===m.fpId);
    var bk=bancos.find(x=>x.id===m.bancoId);
    var entNombre=m.entidad?esc(m.entidad.nombre):'—';
    return '<tr>'
      +'<td>'+esc(m.fecha)+'</td>'
      +'<td>'+esc(m.subtipo)+'</td>'
      +'<td class="td-mono">'+esc(m.numero)+'</td>'
      +'<td>'+entNombre+'</td>'
      +'<td>'+(fp?esc(fp.nombre):'—')+'</td>'
      +'<td>'+(bk?esc(bk.nombre):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--green)">'+(m.dir==='in'?fmtARS(m.importe):'—')+'</td>'
      +'<td class="td-mono td-r" style="color:var(--red)">'+(m.dir==='out'?fmtARS(m.importe):'—')+'</td>'
      +'</tr>';
  }).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="card mb20">
      <div class="flex-c gap8 flex-wrap">
        <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Desde</label><input type="date" value="${_tesDesde}" onchange="_tesDesde=this.value;renderTesoreria()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
        <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Hasta</label><input type="date" value="${_tesHasta}" onchange="_tesHasta=this.value;renderTesoreria()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
        <div class="fg" style="margin:0;flex:1;min-width:140px"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Banco</label><select onchange="_tesBanco=this.value;renderTesoreria()" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"><option value="">Todos</option>${bancosOpts}</select></div>
        <div class="fg" style="margin:0;flex:1;min-width:140px"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Forma de pago</label><select onchange="_tesFP=this.value;renderTesoreria()" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"><option value="">Todas</option>${fpOpts}</select></div>
        <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Tipo</label><select onchange="_tesTipo=this.value;renderTesoreria()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"><option value="">Todos</option><option value="Cobro"${_tesTipo==='Cobro'?' selected':''}>Cobranzas</option><option value="Pago"${_tesTipo==='Pago'?' selected':''}>Pagos</option></select></div>
        <div class="fg" style="margin:0;flex:0 0 auto;align-self:flex-end"><button class="btn btn-ghost btn-sm" onclick="_tesDesde='';_tesHasta='';_tesBanco='';_tesFP='';_tesTipo='';renderTesoreria()">↺ Limpiar</button></div>
      </div>
    </div>

    <div class="g4 mb24">
      <div class="stat-card"><div class="stat-lbl">Ingresos filtrados</div><div class="stat-val" style="color:var(--green);font-size:18px">${fmtARS(totalIn)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Egresos filtrados</div><div class="stat-val" style="color:var(--red);font-size:18px">${fmtARS(totalOut)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Saldo neto</div><div class="stat-val" style="color:${saldo>=0?'var(--green)':'var(--red)'};font-size:18px">${fmtARS(saldo)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Movimientos</div><div class="stat-val" style="color:var(--accent);font-size:18px">${movsFilt.length}</div></div>
    </div>

    <div class="toolbar mb16" style="padding:0">
      <div style="flex:1;font-size:14px;font-weight:600">Movimientos de fondos</div>
      <button class="btn btn-secondary btn-sm" onclick="abrirCobroDirecto()">+ Registrar cobro</button>
      <button class="btn btn-secondary btn-sm" onclick="abrirPagoDirecto()">+ Registrar pago</button>
    </div>

    <div class="card mb24">
      ${movsFilt.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>N°</th><th>Entidad</th><th>Forma pago</th><th>Banco</th><th class="td-r">Ingreso</th><th class="td-r">Egreso</th></tr></thead>
      <tbody>${movRows}</tbody></table></div>`
      :`<div class="empty" style="padding:30px"><div class="ei">📋</div><p>Sin movimientos en el período seleccionado</p></div>`}
    </div>

    <div class="g2" style="gap:20px;align-items:start">
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Proyección — Cobros pendientes</h3>
        ${fvPend.length?fvPend.sort((a,b)=>a.vencimiento>b.vencimiento?1:-1).map(f=>{
          const cl=clientes.find(x=>x.id===f.clienteId);
          const venc=f.vencimiento&&f.vencimiento<today();
          return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-size:13px;font-weight:500">${cl?esc(cl.nombre):'—'}</div><div style="font-size:11px;color:${venc?'var(--red)':'var(--text2)'}">${esc(f.numero)} · vence ${esc(f.vencimiento||'—')}</div></div>
            <div class="td-mono" style="color:var(--green);font-weight:600">${fmtARS(f.total)}</div>
          </div>`;}).join('')
        :`<p style="font-size:13px;color:var(--text2)">Sin cobros pendientes 🎉</p>`}
      </div>
      <div class="card">
        <h3 class="fw6 mb12" style="font-size:14px">Proyección — Pagos pendientes</h3>
        ${fcPend.length?fcPend.sort((a,b)=>a.vencimiento>b.vencimiento?1:-1).map(f=>{
          const pv=proveedores.find(x=>x.id===f.proveedorId);
          const venc=f.vencimiento&&f.vencimiento<today();
          return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-size:13px;font-weight:500">${pv?esc(pv.nombre):'—'}</div><div style="font-size:11px;color:${venc?'var(--red)':'var(--text2)'}">${esc(f.numero)} · vence ${esc(f.vencimiento||'—')}</div></div>
            <div class="td-mono" style="color:var(--red);font-weight:600">${fmtARS(f.total)}</div>
          </div>`;}).join('')
        :`<p style="font-size:13px;color:var(--text2)">Sin pagos pendientes 🎉</p>`}
      </div>
    </div>`;
}

async function abrirCobroDirecto(){

async function saveCobroDirecto(){
  const eid=_empresa.id;
  const importe=parseFloat(document.getElementById('cd-imp').value)||0;
  if(!importe){toast('El importe es obligatorio','error');return}
  const fpId=document.getElementById('cd-fp').value;
  if(!fpId){toast('Seleccioná una forma de pago','error');return}
  const cfg=await DB.cfg(eid);const nums=cfg.nums||{RC:1};
  if(!nums.RC)nums.RC=1;
  const numero='RC-'+String(nums.RC).padStart(5,'0');nums.RC++;
  await DB.setCfg(eid,{nums});
  const rec={id:genId(),numero,fecha:document.getElementById('cd-f').value,
    clienteId:document.getElementById('cd-cl').value||null,
    importe,formaPagoId:fpId,
    bancoId:document.getElementById('cd-bk').value||null,
    facturaIds:[],
    observaciones:document.getElementById('cd-obs').value.trim(),
    fechaCreacion:new Date().toISOString()};
  showLoading('Registrando cobro...');
  await DB.upsertItem(eid,'recibos_cobro',rec);
  hideLoading();
  closeModal();toast('Cobro registrado · '+numero,'success');renderTesoreria();
}

var _infDesde='',_infHasta='',_infTab='economico';
async function renderInformes(){

  if(!_infHasta)_infHasta=today();

  var filtros=`<div class="card mb20">
    <div class="flex-c gap8">
      <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Desde</label><input type="date" value="${_infDesde}" onchange="_infDesde=this.value;renderInformes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
      <div class="fg" style="margin:0;flex:0 0 auto"><label style="display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px">Hasta</label><input type="date" value="${_infHasta}" onchange="_infHasta=this.value;renderInformes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:var(--font)"></div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:6px;align-self:flex-end">
        <button class="btn btn-sm ${_infTab==='economico'?'btn-primary':'btn-secondary'}" onclick="_infTab='economico';renderInformes()">📊 Informe Económico</button>
        <button class="btn btn-sm ${_infTab==='financiero'?'btn-primary':'btn-secondary'}" onclick="_infTab='financiero';renderInformes()">💵 Informe Financiero</button>
